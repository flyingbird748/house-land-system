      }
      const cols = VISIBLE_COLS.map((k) => COL_MAP.get(k)).filter(Boolean);
      const ACT_W = 168;              // 操作列宽（冻结在右侧）
      const totalW = cols.reduce((s, c) => s + c.w, 0) + 34 + ACT_W;

      // 固定布局 + 精确宽度：列宽不再被拉伸，冻结列的 left 偏移才能严格对齐
      const tbl = h(`<table class="tbl fixed" style="width:${totalW}px"><thead><tr></tr></thead><tbody></tbody></table>`);
      const tr = $('thead tr', tbl);

      const allOn = ListState.rows.length && ListState.rows.every((r) => ListState.selected.has(r.id));
      tr.appendChild(h(`<th class="fx" style="left:0;width:34px"><input type="checkbox" id="ck-all" ${allOn ? 'checked' : ''}></th>`));

      // 最后一个冻结列需要分隔阴影
      let lastFx = -1;
      cols.forEach((c, i) => { if (c.freeze) lastFx = i; });

      // 冻结列左侧偏移：34(选择框) + 前面各列宽度
      let left = 34;
      cols.forEach((c, i) => {
        const isSort = c.sort && c.sort === ListState.sort;
        const th = h(`<th class="${c.sort ? 'sortable' : ''} ${c.right ? 'right' : ''} ${c.freeze ? 'fx' : ''} ${i === lastFx ? 'fx-last' : ''}" style="width:${c.w}px${c.freeze ? `;left:${left}px` : ''}">${esc(c.t)}${c.sort ? `<span class="arw">${isSort ? (ListState.order === 'asc' ? ' ▲' : ' ▼') : ' ⇅'}</span>` : ''}</th>`);
        if (c.sort) {
          on(th, 'click', () => {
            if (ListState.sort === c.sort) ListState.order = ListState.order === 'asc' ? 'desc' : 'asc';
            else { ListState.sort = c.sort; ListState.order = 'desc'; }
            load();
          });
        }
        tr.appendChild(th);
        left += c.w;
      });
      tr.appendChild(h(`<th class="fxr" style="width:${ACT_W}px">操作</th>`));

      const tb = $('tbody', tbl);
      ListState.rows.forEach((a, i) => {
        const tds = cols.map((c, i) => {
          const cls = [c.right ? 'right' : '', c.freeze ? 'fx' : '', c.mono ? 'mono' : '', i === lastFx ? 'fx-last' : ''].filter(Boolean).join(' ');
          const inner = c.cell ? c.cell(a) : defCell(a, c);
          return `<td class="${cls}" style="width:${c.w}px${c.freeze ? `;left:${leftOffset(cols, c)}px` : ''}">${inner}</td>`;
        }).join('');
        const row = h(`<tr class="${ListState.selected.has(a.id) ? 'sel' : ''}">
          <td class="fx" style="left:0"><input type="checkbox" class="ck" data-id="${a.id}" ${ListState.selected.has(a.id) ? 'checked' : ''}></td>
          ${tds}
          <td class="act fxr" style="width:${ACT_W}px">
            ${Session.canWriteAsset(a)
              ? `<span class="link" data-act="edit" data-id="${a.id}">编辑</span>`
              : `<span class="link" data-act="view" data-id="${a.id}">查看</span>`}
            <span class="link" data-act="map" data-id="${a.id}">定位</span>
            ${Session.can('delete') && Session.canWriteAsset(a) ? `<span class="link dg" data-act="del" data-id="${a.id}">删除</span>` : ''}
          </td>
        </tr>`);
        tb.appendChild(row);
      });
      box.appendChild(tbl);

      on($('#ck-all', box), 'change', (e) => {
        const on2 = e.target.checked;
        ListState.rows.forEach((r) => { if (on2) ListState.selected.add(r.id); else ListState.selected.delete(r.id); });
        renderTable(box);
        renderPager(pager);
      });
      $$('.ck', box).forEach((ck) => on(ck, 'change', (e) => {
        const id = ck.dataset.id;
        if (e.target.checked) ListState.selected.add(id); else ListState.selected.delete(id);
        renderPager(pager);
      }));
      $$('[data-act]', box).forEach((n) => on(n, 'click', () => {
        const id = n.dataset.id;
        const a = ListState.rows.find((x) => x.id === id);
        const act = n.dataset.act;
        if (act === 'view') AssetForm.view(a);
        else if (act === 'edit') AssetForm.edit(a, () => load());
        else if (act === 'map') { location.hash = '#/map'; setTimeout(() => MapPage.focus(id), 260); }
        else if (act === 'del') delOne(a, () => load());
      }));
    }

    function renderPager(box) {
      clear(box);
      const total = ListState.total;
      const pages = Math.max(1, Math.ceil(total / ListState.pageSize));
      const sel = ListState.selected.size;
      const from = total ? (ListState.page - 1) * ListState.pageSize + 1 : 0;
      const to = Math.min(total, ListState.page * ListState.pageSize);

      box.appendChild(h(`<div class="info">共 ${fmt.n(total)} 条，当前 ${from}-${to} 条${sel ? `，已选 ${sel} 条` : ''}</div>`));
      box.appendChild(h('<div class="spacer"></div>'));

      if (Session.can('export')) {
        const ex = h('<button class="btn sm">导出当前结果</button>');
        on(ex, 'click', () => downloadExport());
        box.appendChild(ex);
      }
      // 下级单位数据只读：只统计有写权限的选中条数
      const writableSel = ListState.rows.filter((r) => ListState.selected.has(r.id) && Session.canWriteAsset(r)).length;
      if (writableSel && Session.can('delete')) {
        const bd = h(`<button class="btn sm danger">批量删除 (${writableSel})</button>`);
        on(bd, 'click', async () => {
          if (!await confirmDlg(`确定删除选中的 <b>${writableSel}</b> 条资产记录吗？此操作不可恢复。`)) return;
          try {
            const r = await API.post('/api/assets/batch-delete', { ids: [...ListState.selected] });
            toast(`已删除 ${r.removed} 条${r.denied ? `，${r.denied} 条无权限` : ''}`, 'ok');
            ListState.selected.clear();
            load();
          } catch (e) { toast(e.message, 'err'); }
        });
        box.appendChild(bd);
      }

      const pb = h('<div style="display:flex;gap:6px;align-items:center"></div>');
      const mk = (t, p, dis) => {
        const b = h(`<button class="btn sm" ${dis ? 'disabled' : ''}>${t}</button>`);
        if (!dis) on(b, 'click', () => { ListState.page = p; load(); });
        pb.appendChild(b);
      };
      mk('首页', 1, ListState.page <= 1);
      mk('上一页', ListState.page - 1, ListState.page <= 1);
      pb.appendChild(h(`<span class="muted" style="padding:0 6px">${ListState.page} / ${pages}</span>`));
      mk('下一页', ListState.page + 1, ListState.page >= pages);
      mk('末页', pages, ListState.page >= pages);
      const sz = h('<select class="sel" style="width:88px"></select>');
      [20, 50, 100, 200].forEach((n) => sz.appendChild(h(`<option value="${n}" ${n === ListState.pageSize ? 'selected' : ''}>${n} 条/页</option>`)));
      on(sz, 'change', () => { ListState.pageSize = Number(sz.value); ListState.page = 1; load(); });
      pb.appendChild(sz);
      box.appendChild(pb);
    }

    async function downloadExport() {
      const p = new URLSearchParams();
      if (ListState.q) p.set('q', ListState.q);
      if (ListState.category.length) p.set('category', ListState.category.join(','));
      if (ListState.useStatus.length) p.set('useStatus', ListState.useStatus.join(','));
      if (ListState.hasTitle.length) p.set('hasTitle', ListState.hasTitle.join(','));
      // 与列表筛选取交集；交集为空则无可导出记录
      let unitParam = ListState.unit;
      if (Scope.unit) {
        unitParam = ListState.unit.length ? ListState.unit.filter((u) => u === Scope.unit) : [Scope.unit];
        if (!unitParam.length) { toast('当前筛选条件下没有可导出的记录', 'warn'); return; }
      }
      if (unitParam.length) p.set('unit', unitParam.join(','));
      if (ListState.marked) p.set('marked', ListState.marked);
      if (ListState.selected.size) p.set('ids', [...ListState.selected].join(','));
      else {
        if (ListState.areaMin) p.set('areaMin', ListState.areaMin);
        if (ListState.areaMax) p.set('areaMax', ListState.areaMax);
        p.set('sort', ListState.sort);
        p.set('order', ListState.order);
        p.set('pageSize', 'all');
      }
      try {
        await downloadAuth('/api/export?format=xlsx&' + p.toString(), `房屋土地台账-${new Date().toISOString().slice(0, 10)}.xlsx`);
        toast('已导出 Excel', 'ok');
      } catch (e) { toast(e.message, 'err'); }
    }
  },
};

/** 冻结列的左偏移：34(选择框) + 之前所有列宽度之和 */
function leftOffset(cols, target) {
  let x = 34;
  for (const c of cols) {
    if (c === target) return x;
    x += c.w;
  }
  return x;
}

/* ------------------------------ 工具栏 ------------------------------ */

function buildToolbar(wrap) {
  const tb = h('<div class="toolbar"></div>');
  wrap.appendChild(tb);

  const search = h(`<div class="search"><span class="si">⌕</span><input class="inp" placeholder="搜索名称/编号/坐落/证号/单位"></div>`);
  const si = $('.inp', search);
  si.value = ListState.q;
  let timer;
  on(si, 'input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { ListState.q = si.value.trim(); ListState.page = 1; reloadList(wrap); }, 260);
  });
  tb.appendChild(search);

  const mkSel = (label, key, opts, multi) => {
    const box = h(`<div style="display:flex;align-items:center;gap:5px"><span class="muted" style="font-size:12px">${label}</span></div>`);
    const sel = h('<select class="sel w"></select>');
    sel.appendChild(h(`<option value="">全部</option>`));
    opts.forEach((o) => sel.appendChild(h(`<option value="${esc(o)}">${esc(o)}</option>`)));
    const cur = ListState[key];
    sel.value = Array.isArray(cur) ? (cur[0] || '') : (cur || '');
    on(sel, 'change', () => {
      ListState[key] = multi ? (sel.value ? [sel.value] : []) : sel.value;
      ListState.page = 1;
      reloadList(wrap);
    });
    box.appendChild(sel);
    tb.appendChild(box);
    return sel;
  };

  const opts = Session.options || {};
  const F = (k) => (opts.fields || []).find((x) => x.key === k);
  mkSel('分类', 'category', (F('category') || {}).options || []);
  mkSel('状态', 'useStatus', (F('useStatus') || {}).options || []);
  mkSel('产权', 'hasTitle', (F('hasTitle') || {}).options || []);
  // 已通过左侧单位树限定单位时，工具栏不再重复提供单位筛选
  if (!Scope.unit) mkSel('单位', 'unit', (opts.units || []));
  else ListState.unit = [];

  const mk = h('<select class="sel w2"></select>');
  mk.appendChild(h('<option value="">全部</option>'));
  mk.appendChild(h('<option value="yes">已标注</option>'));
  mk.appendChild(h('<option value="no">未标注</option>'));
  mk.value = ListState.marked;
  on(mk, 'change', () => { ListState.marked = mk.value; ListState.page = 1; reloadList(wrap); });
  const mkBox = h('<div style="display:flex;align-items:center;gap:5px"><span class="muted" style="font-size:12px">标注</span></div>');
  mkBox.appendChild(mk);
  tb.appendChild(mkBox);

  tb.appendChild(h('<div class="spacer"></div>'));

  // 列设置
  const colBtn = h(`<button class="btn">列设置 ${VISIBLE_COLS.length}/${ALL_KEYS.length}</button>`);
  on(colBtn, 'click', () => openColPicker(wrap));
  tb.appendChild(colBtn);

  if (Session.can('write')) {
    const add = h('<button class="btn pri">＋ 新增资产</button>');
    on(add, 'click', () => AssetForm.create(() => reloadList(wrap)));
    tb.appendChild(add);
  }
  const rst = h('<button class="btn">重置筛选</button>');
  on(rst, 'click', () => {
    Object.assign(ListState, { q: '', category: [], useStatus: [], hasTitle: [], unit: [], marked: '', areaMin: '', areaMax: '', page: 1, sort: 'rowNo', order: 'asc' });
    ListState.selected.clear();
    Pages.assets.render(wrap.closest('.content') || wrap.parentNode);
  });
  tb.appendChild(rst);
}

/* ------------------------------ 列设置弹窗 ------------------------------ */

function openColPicker(wrap) {
  const draft = new Set(VISIBLE_COLS);
  const root = h('<div class="colpick"></div>');

  const bar = h(`<div class="bar">
    <input class="inp" id="cp-q" placeholder="搜索字段名" style="width:180px">
    <div class="spacer" style="flex:1"></div>
    <button class="btn sm" data-p="core">核心视图</button>
    <button class="btn sm" data-p="src">源表全字段</button>
    <button class="btn sm" data-p="all">全部字段</button>
    <button class="btn sm" data-p="none">清空</button>
    <span class="muted" id="cp-n" style="font-size:12px"></span>
  </div>`);
  root.appendChild(bar);

  const grid = h('<div class="grp-wrap"></div>');
  root.appendChild(grid);

  const boxes = [];
  COL_GROUPS.forEach((g) => {
    const items = COL_DEFS.filter((c) => c.g === g.k);
    if (!items.length) return;
    const sec = h(`<div class="grp" data-g="${g.k}">
      <div class="grp-h"><span>${esc(g.t)}</span><span class="muted" style="font-weight:400">${items.length} 项</span>
        <span class="link" data-all="${g.k}" style="font-weight:400;margin-left:4px">全选</span>
        <span class="link" data-none="${g.k}" style="font-weight:400">清空</span>
      </div>
      <div class="ci-wrap"></div>
    </div>`);
    const cw = $('.ci-wrap', sec);
    items.forEach((c) => {
      const lb = h(`<label class="ci" title="${esc(c.t)}"><input type="checkbox" data-k="${c.k}" ${draft.has(c.k) ? 'checked' : ''}><span>${esc(c.t)}</span></label>`);
      const ck = $('input', lb);
      on(ck, 'change', () => { if (ck.checked) draft.add(c.k); else draft.delete(c.k); updateN(); });
      boxes.push({ el: lb, ck, c });
      cw.appendChild(lb);
    });
    grid.appendChild(sec);
  });

  const nEl = $('#cp-n', bar);
  function updateN() { nEl.textContent = `已选 ${draft.size} 列`; }
  updateN();

  on($('#cp-q', bar), 'input', (e) => {
    const kw = String(e.target.value || '').trim().toLowerCase();
    boxes.forEach(({ el, c }) => {
      el.style.display = (!kw || c.t.toLowerCase().includes(kw) || c.k.toLowerCase().includes(kw)) ? '' : 'none';
    });
    $$('.grp', grid).forEach((g) => {
      const vis = $$('.ci', g).some((x) => x.style.display !== 'none');
      g.style.display = vis ? '' : 'none';
    });
  });

  $$('[data-p]', bar).forEach((b) => on(b, 'click', () => {
    const p = b.dataset.p;
    let keys = [];
    if (p === 'core') keys = CORE_KEYS.slice();
    else if (p === 'src') keys = SRC_KEYS.slice();
    else if (p === 'all') keys = ALL_KEYS.slice();
    draft.clear();
    keys.forEach((k) => draft.add(k));
    boxes.forEach(({ ck, c }) => { ck.checked = draft.has(c.k); });
    updateN();
  }));

  $$('[data-all]', grid).forEach((b) => on(b, 'click', () => {
    COL_DEFS.filter((c) => c.g === b.dataset.all).forEach((c) => { draft.add(c.k); });
    boxes.forEach(({ ck, c }) => { ck.checked = draft.has(c.k); });
    updateN();
  }));
  $$('[data-none]', grid).forEach((b) => on(b, 'click', () => {
    const gk = b.dataset.none;
    const keep = ['name'];
    COL_DEFS.filter((c) => c.g === gk && keep.indexOf(c.k) < 0).forEach((c) => draft.delete(c.k));
    boxes.forEach(({ ck, c }) => { ck.checked = draft.has(c.k); });
    updateN();
  }));

  modal({
    title: '列设置',
    size: 'wide',
    bodyNode: root,
    buttons: [
      { text: '取消' },
      {
        text: '应用',
        cls: 'pri',
        onClick: (c) => {
          const keys = ALL_KEYS.filter((k) => draft.has(k));
          if (!keys.length) { toast('至少保留一列', 'err'); return; }
          saveCols(keys);
          VISIBLE_COLS = keys;
          reloadList(wrap);
          c();
        },
      },
    ],
  });
}

function reloadList(wrap) {
  const content = wrap.closest('.content');
  if (content) { clear(content); Pages.assets.render(content); }
}

async function delOne(a, done) {
  if (!await confirmDlg(`确定删除资产 <b>${esc(a.name || a.id)}</b> 吗？此操作不可恢复。`)) return;
  try {
    await API.del('/api/assets/' + a.id);
    toast('已删除', 'ok');
    done && done();
  } catch (e) { toast(e.message, 'err'); }
}

/* ===== 06-form.js ===== */
'use strict';
/* ============================================================
 *  form —— 资产新增 / 编辑 / 详情
 * ============================================================ */

const AssetForm = {
  create(done) { this.open(null, done); },
  edit(asset, done) { this.open(asset, done); },

  open(asset, done) {
    const isNew = !asset;
    // 下级单位只读：编辑入口只对本单位（或系统管理员）开放
    if (!isNew && !Session.canWriteAsset(asset)) { this.view(asset); return; }
    const opts = Session.options || { fields: [], groups: [] };
    const fields = opts.fields;
    const groups = opts.groups;

    const body = h('<div></div>');
    const tabs = h('<div class="tabs"></div>');
    const panes = h('<div style="padding:16px 18px"></div>');
    body.appendChild(tabs);
    body.appendChild(panes);

    groups.forEach((g, gi) => {
      const gf = fields.filter((f) => f.group === g.key);
      if (!gf.length) return;
      const tb = h(`<div class="tb ${gi === 0 ? 'on' : ''}" data-g="${g.key}">${esc(g.label)}</div>`);
      tabs.appendChild(tb);
      const pane = h(`<div class="pane" data-g="${g.key}" style="${gi === 0 ? '' : 'display:none'}"></div>`);
      pane.appendChild(h(`<div class="sec-title">${esc(g.label)}</div>`));
      const grid = h('<div class="form-grid"></div>');

      gf.forEach((f) => {
        const isGeo = f.key === 'lng' || f.key === 'lat';
        // 新建时「所属单位」默认取左侧单位树当前选中的单位；选中只读的下级单位时回退到本单位
        const newUnit = Session.canWriteUnit(Scope.unit) ? Scope.unit : (Session.myUnit() || '');
        const val = asset ? asset[f.key] : (f.key === 'unit' ? newUnit : '');
        const cls = (f.type === 'textarea' || f.key === 'location') ? 'col-2' : '';
        const box = h(`<div class="field ${cls}"><label>${esc(f.label)}${f.required ? ' <span style="color:var(--danger)">*</span>' : ''}${f.unit ? ` <span class="unit">(${esc(f.unit)})</span>` : ''}</label></div>`);

        let input;
        if (f.type === 'enum') {
          input = h('<select class="sel"></select>');
          input.appendChild(h('<option value="">— 请选择 —</option>'));
          const list = (f.options || []).slice();
          if (val && list.indexOf(String(val)) < 0) list.push(String(val));
          list.forEach((o) => input.appendChild(h(`<option value="${esc(o)}" ${String(val) === String(o) ? 'selected' : ''}>${esc(o)}</option>`)));
        } else if (f.type === 'textarea') {
          input = h('<textarea class="ta"></textarea>');
          input.value = val == null ? '' : val;
        } else if (f.type === 'date') {
          input = h('<input class="inp" type="date">');
          input.value = val ? String(val).slice(0, 10) : '';
        } else if (f.type === 'number') {
          input = h(`<input class="inp" type="number" step="${f.key === 'lng' || f.key === 'lat' ? '0.000001' : 'any'}" ${isGeo ? 'placeholder="由地图标注写入"' : ''}>`);
          input.value = val == null ? '' : val;
        } else {
          input = h('<input class="inp">');
          input.value = val == null ? '' : val;
        }
        input.dataset.k = f.key;
        input.classList.add('fd');
        box.appendChild(input);
        grid.appendChild(box);
      });

      pane.appendChild(grid);

      if (g.key === 'geo') {
        const has = asset && Number.isFinite(asset.lng) && Number.isFinite(asset.lat);
        const extra = h(`<div style="margin-top:6px;padding:12px;border:1px dashed var(--line);border-radius:6px;background:var(--panel-2)">
          <div style="font-size:12.5px;margin-bottom:8px">
            当前标注状态：${has
              ? `<span class="tag g">已标注</span> <span class="muted">${asset.lng}, ${asset.lat}</span> ${asset.geoAddress ? '· ' + esc(asset.geoAddress) : ''}${asset.geoBy ? ' · 由 ' + esc(asset.geoBy) + ' 于 ' + esc(fmt.rel(asset.geoAt)) : ''}`
              : '<span class="tag n">未标注</span>'}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn" id="f-goto-map" ${isNew ? 'disabled' : ''}>在地图上标注</button>
            <button class="btn" id="f-clear-geo" ${has ? '' : 'disabled'}>清除坐标</button>
          </div>
          <div class="muted" style="font-size:11.5px;margin-top:7px">提示：坐标采用 GCJ-02（火星坐标），由腾讯地图拾取，请勿手工填写其它坐标系数值。</div>
        </div>`);
        pane.appendChild(extra);
      }

      panes.appendChild(pane);
    });

    $$('.tb', tabs).forEach((t) => on(t, 'click', () => {
      $$('.tb', tabs).forEach((x) => x.classList.toggle('on', x === t));
      $$('.pane', panes).forEach((p) => { p.style.display = p.dataset.g === t.dataset.g ? '' : 'none'; });
    }));

    // 房产图片：在编辑界面上传（最多 3 张 / 单张 ≤ 2MB），详见 Img 模块
    const imgBox = h('<div class="img-box"></div>');
    body.appendChild(imgBox);
    if (isNew) {
      Img.gallery(imgBox, '', [], null); // 未保存的资产还没有 id，提示先保存
    } else {
      Img.gallery(imgBox, asset.id, [], null); // 先出骨架，图片异步到位后重画
      const refresh = (imgs) => Img.gallery(imgBox, asset.id, imgs, refresh);
      API.get('/api/assets/' + asset.id + '/images')
        .then((r) => refresh(r.images || []))
        .catch(() => {});
    }

    const errBox = h('<div style="color:var(--danger);font-size:12px;min-height:16px"></div>');

    const collect = () => {
      const out = {};
      $$('.fd', body).forEach((i) => {
        const k = i.dataset.k;
        let v = i.value;
        if (v === '') { out[k] = null; return; }
        const f = fields.find((x) => x.key === k);
        if (f && f.type === 'number') v = Number(v);
        out[k] = v;
      });
      return out;
    };

    const buttons = [];
    buttons.push({ text: '取消' });
    if (!isNew && Session.can('geo')) {
      buttons.push({
        text: '保存并去地图标注', onClick: async (close) => {
          const id = await save(close, false);
          if (id) { location.hash = '#/map'; setTimeout(() => MapPage.focus(id), 260); }
        },
      });
    }
    if (Session.can('write')) {
      buttons.push({ text: isNew ? '创建' : '保存', cls: 'pri', onClick: (close) => save(close, true) });
    }

    // 所属单位下拉：只能选到有写权限的单位（系统管理员不受限）
    const unitInput = $$('.fd', body).find((i) => i.dataset.k === 'unit');
    if (unitInput && !Session.canWriteUnit(unitInput.value || '')) {
      unitInput.disabled = true;
      unitInput.title = '当前单位不可修改（下级单位只读）';
    }

    const dlg = modal({
      title: isNew ? '新增房屋土地资产' : `编辑：${asset.name || asset.id}`,
      size: 'full',
      bodyNode: body,
      buttons,
      maskClose: false,
    });
    $('.dlg-b', dlg.mask).appendChild(errBox);

    on($('#f-goto-map', body), 'click', () => {
      if (isNew) return;
      dlg.close();
      location.hash = '#/map';
      setTimeout(() => MapPage.focus(asset.id), 260);
    });
    on($('#f-clear-geo', body), 'click', async () => {
      try {
        await API.put('/api/assets/' + asset.id + '/geo', { lng: null, lat: null });
        toast('已清除坐标', 'ok');
        dlg.close();
        done && done();
      } catch (e) { toast(e.message, 'err'); }
    });

    async function save(close, closeAfter) {
      errBox.textContent = '';
      const data = collect();
      if (data.name === null || data.name === undefined || !String(data.name).trim()) {
        errBox.textContent = '资产名称不能为空';
        $$('.tb', tabs)[0].click();
        return null;
      }
      try {
        const r = isNew ? await API.post('/api/assets', data) : await API.put('/api/assets/' + asset.id, data);
        toast(isNew ? '已创建资产' : '已保存修改', 'ok');
        if (closeAfter) close();
        done && done();
        return r.asset.id;
      } catch (e) {
        errBox.textContent = e.message;
        return null;
      }
    }
  },

  /** 只读详情（onClose 可选：弹窗关闭后的回调） */
  view(asset, onClose) {
    const opts = Session.options || { fields: [], groups: [] };
    const body = h('<div></div>');

    // 房产图片：详情里以只读缩略图墙呈现（点开看大图）
    const imgBox = h('<div class="img-box"></div>');
    body.appendChild(imgBox);
    Img.gallery(imgBox, asset.id, [], null, { readonly: true });
    API.get('/api/assets/' + asset.id + '/images')
      .then((r) => Img.gallery(imgBox, asset.id, r.images || [], null, { readonly: true }))
      .catch(() => {});

    opts.groups.forEach((g) => {
      const gf = opts.fields.filter((f) => f.group === g.key && (asset[f.key] !== null && asset[f.key] !== undefined && asset[f.key] !== ''));
      if (!gf.length) return;
      body.appendChild(h(`<div class="sec-title">${esc(g.label)}</div>`));
      const grid = h('<div class="form-grid" style="margin-bottom:16px"></div>');
      gf.forEach((f) => {
        let v = asset[f.key];
        if (f.type === 'number') v = fmt.n(v);
        else if (f.key === 'originalValue' || f.key === 'rentIncome' || f.key === 'leaseRent' || f.key === 'overhaulAmount') v = fmt.moneyPlain(v) + ' 元';
        grid.appendChild(h(`<div><div class="muted" style="font-size:11.5px">${esc(f.label)}</div>
          <div style="font-size:13px;margin-top:2px;line-height:1.5">${esc(v)}</div></div>`));
      });
      body.appendChild(grid);
    });
    if (Number.isFinite(asset.lng) && Number.isFinite(asset.lat)) {
      body.appendChild(h(`<div class="sec-title">地图标注</div>
        <div style="font-size:13px">坐标 ${asset.lng}, ${asset.lat}（GCJ-02）${asset.geoAddress ? ' · ' + esc(asset.geoAddress) : ''}</div>`));
    }
    body.appendChild(h(`<div class="muted" style="font-size:11.5px;margin-top:14px">
      创建：${esc(asset.createdBy || '-')} ${esc(asset.createdAt ? asset.createdAt.slice(0, 16).replace('T', ' ') : '')} ｜
      最后修改：${esc(asset.updatedBy || '-')} ${esc(asset.updatedAt ? asset.updatedAt.slice(0, 16).replace('T', ' ') : '')}
    </div>`));

    const writable = Session.can('write') && Session.canWriteAsset(asset);
    modal({
      title: asset.name || '资产详情',
      size: 'wide',
      bodyNode: body,
      onClose,
      buttons: [
        { text: '关闭' },
        Session.can('geo') ? { text: '在地图上查看', onClick: (c) => { c(); location.hash = '#/map'; setTimeout(() => MapPage.focus(asset.id), 260); } } : null,
        writable ? { text: '编辑', cls: 'pri', onClick: (c) => { c(); AssetForm.edit(asset); } } : null,
      ].filter(Boolean),
    });
  },
};

/* ===== 07-import.js ===== */
'use strict';
/* ============================================================
 *  import —— Excel 导入向导（上传 → 字段映射 → 预览 → 写入）
 * ============================================================ */

const ImportState = {
  token: '', fileName: '', sheetName: '', headerRowIndex: 0,
  mapping: [], cols: [], preview: [], total: 0, skipped: [], issues: [], issueCount: 0,
  sheets: [],
};

Pages.import = {
    title: 'Excel 导入',
  render(root) {
    if (guard(root, 'import')) return;
    const wrap = h('<div></div>');
    root.appendChild(wrap);

    /* ---- 步骤一：上传 ---- */
    const step1 = h(`
      <div class="card">
        <div class="card-h"><h3>① 选择 Excel 台账文件</h3><div class="spacer"></div>
          <button class="btn sm" id="tpl">下载内置导入模板</button>
        </div>
        <div class="card-b">
          <div class="tpl-box" id="tpl-info">
            <div class="tt">导入模板（内置）</div>
            <div class="ts muted">正在读取模板结构…</div>
          </div>
          <div class="drop" id="drop">
            <div class="ic">⇪</div>
            <div class="t">点击选择，或把 .xlsx 文件拖到这里</div>
            <div class="s">严格兼容《房屋土地统计表》格式，自动识别表头行与字段，支持合并单元格、日期、公式结果值</div>
          </div>
          <input type="file" id="file" accept=".xlsx,.xlsm" style="display:none">
          <div class="muted" style="margin-top:12px;font-size:12px;line-height:1.8">
            · 模板第 1-4 行为表头（合并单元格），第 5 行序号、第 6 行填表说明，<b>数据请从第 7 行开始</b>；<br>
            · 表头行可以不在第一行，系统会自动寻找字段最多的一行；<br>
            · 「资产编号」相同的记录会被识别为同一条资产（用于更新而非重复新增）；<br>
            · 首列为「序号 / 行次 / 填表说明 / 合计」等非数据行会自动跳过。
          </div>
        </div>
      </div>`);
    wrap.appendChild(step1);

    // 展示内置模板的结构信息
    API.get('/api/import/template/info').then((info) => {
      const box = $('#tpl-info', step1);
      if (!box || !info) return;
      const items = [
        ['列数', info.cols + ' 列'],
        ['表头', `第 ${info.headerRow}-${info.headerToRow} 行（合并）`],
        ['序号行', `第 ${info.seqRow} 行`],
        ['填表说明行', `第 ${info.noteRow} 行`],
        ['数据起始行', `第 ${info.dataRow} 行`],
        ['字段匹配', `${info.matched} / ${info.cols}`],
      ];
      box.innerHTML = '<div class="tt">导入模板（内置'
        + (info.builtin ? '' : '·兜底生成') + '）</div>'
        + '<div class="ts">' + items.map(([k, v]) => `<span class="ti"><b>${esc(k)}</b>${esc(v)}</span>`).join('') + '</div>'
        + '<div class="ts muted" style="margin-top:6px">'
        + esc(info.sheets && info.sheets.length > 1 ? '工作表：' + info.sheets.join('、') + '（第二个表为逐列填写说明）' : '工作表：' + ((info.sheets || [])[0] || ''))
        + esc(info.size ? ` · ${(info.size / 1024).toFixed(1)} KB` : '')
        + '</div>';
    }).catch(() => {});

    const box2 = h('<div id="imp-2"></div>');
    wrap.appendChild(box2);
    const box3 = h('<div id="imp-3"></div>');
    wrap.appendChild(box3);

    on($('#tpl', step1), 'click', async () => {
      try {
        await downloadAuth('/api/import/template', '房屋土地导入模板.xlsx');
        toast('模板已下载', 'ok');
      } catch (e) { toast(e.message, 'err'); }
    });

    const fileInput = $('#file', step1);
    const drop = $('#drop', step1);
    on(drop, 'click', () => fileInput.click());
    on(fileInput, 'change', () => { if (fileInput.files[0]) upload(fileInput.files[0]); });
    ['dragenter', 'dragover'].forEach((ev) => on(drop, ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((ev) => on(drop, ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    on(drop, 'drop', (e) => { const f = e.dataTransfer.files[0]; if (f) upload(f); });

    async function upload(file) {
      if (!/\.xlsx$/i.test(file.name) && !/\.xlsm$/i.test(file.name)) {
        toast('请上传 .xlsx 格式的 Excel 文件', 'err');
        return;
      }
      drop.innerHTML = '<div class="ic">◌</div><div class="t">正在解析 ' + esc(file.name) + ' …</div>';
      const buf = await file.arrayBuffer();
      let bin = '';
      const bytes = new Uint8Array(buf);
      const CH = 0x8000;
      for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
      const b64 = btoa(bin);
      try {
        const r = await API.post('/api/import/preview', { fileName: file.name, content: b64 });
        Object.assign(ImportState, r, { fileName: file.name });
        ImportState.mapping = r.mapping.map((m) => m.key);
        ImportState.cols = r.mapping;
        renderStep2();
        renderStep3();
        toast(`解析完成，识别到 ${r.total} 条记录`, 'ok');
      } catch (e) {
        drop.innerHTML = '<div class="ic">⚠</div><div class="t">解析失败</div><div class="s">' + esc(e.message) + '</div>';
      }
    }

    /* ---- 步骤二：字段映射与预览 ---- */
    function renderStep2() {
      clear(box2);
      if (!ImportState.token) return;
      const fields = (Session.options || {}).fields || [];
      const opt = (k) => `<option value="">— 不导入 —</option>` + fields.map((f) =>
        `<option value="${f.key}" ${k === f.key ? 'selected' : ''}>${esc(f.label)}</option>`).join('');

      const card = h(`<div class="card" style="margin-top:12px">
        <div class="card-h"><h3>② 字段匹配与数据预览</h3><div class="spacer"></div>
          <span class="muted" style="font-size:12px">${esc(ImportState.fileName)} ｜ 工作表 <b>${esc(ImportState.sheetName)}</b> ｜ 表头第 ${ImportState.headerRowIndex + 1} 行 ｜ 识别 <b>${ImportState.total}</b> 条</span>
        </div>
        <div class="card-b">
          <div class="tabs">
            <div class="tb on" data-t="map">字段匹配（${ImportState.mapping.filter(Boolean).length} 列）</div>
            <div class="tb" data-t="pv">数据预览</div>
            <div class="tb" data-t="is">异常提示${ImportState.issueCount ? `（${ImportState.issueCount}）` : ''}</div>
            <div class="tb" data-t="sk">跳过行（${ImportState.skipped.length}）</div>
          </div>
          <div id="tp-map"></div>
          <div id="tp-pv" style="display:none"></div>
          <div id="tp-is" style="display:none"></div>
          <div id="tp-sk" style="display:none"></div>
        </div>
      </div>`);
      box2.appendChild(card);

      $$('.tb', card).forEach((t) => on(t, 'click', () => {
        $$('.tb', card).forEach((x) => x.classList.toggle('on', x === t));
        ['map', 'pv', 'is', 'sk'].forEach((k) => { $('#tp-' + k, card).style.display = t.dataset.t === k ? '' : 'none'; });
      }));

      // 字段匹配
      const mt = h(`<table class="map-tbl"><thead><tr><th style="width:52px">列</th><th style="width:230px">Excel 表头</th><th style="width:230px">导入到字段</th><th>示例值</th></tr></thead><tbody></tbody></table>`);
      const mb = $('tbody', mt);
      const sample = ImportState.preview[0] || {};
      ImportState.mapping.forEach((k, i) => {
        const tr = h(`<tr>
          <td class="muted">${String.fromCharCode(65 + (i % 26))}${i >= 26 ? Math.floor(i / 26) : ''}</td>
          <td>${esc(hdrText(i))}${ImportState.cols[i] && ImportState.cols[i].key ? '' : ' <span class="tag n">未匹配</span>'}</td>
          <td><select class="sel" data-i="${i}">${opt(k)}</select></td>
          <td class="muted ellip" style="max-width:280px">${esc(sampleText(i))}</td>
        </tr>`);
        mb.appendChild(tr);
      });
      $('#tp-map', card).appendChild(mt);
      $$('select[data-i]', mt).forEach((s) => on(s, 'change', () => {
        ImportState.mapping[Number(s.dataset.i)] = s.value;
        $$('.tb', card)[0].textContent = `字段匹配（${ImportState.mapping.filter(Boolean).length} 列）`;
      }));

      // 数据预览
      const pv = h('<div style="overflow:auto;max-height:420px"></div>');
      const pt = h('<table class="pv-tbl"><thead></thead><tbody></tbody></table>');
      const keys = ImportState.mapping.filter(Boolean);
      $('thead', pt).appendChild(h('<tr>' + keys.map((k) => `<th>${esc(labelOf(k))}</th>`).join('') + '</tr>'));
      const pbody = $('tbody', pt);
      ImportState.preview.forEach((r) => {
        pbody.appendChild(h('<tr>' + keys.map((k) => `<td>${esc(r[k] == null ? '' : r[k])}</td>`).join('') + '</tr>'));
      });
      pv.appendChild(pt);
      $('#tp-pv', card).appendChild(pv);
      $('#tp-pv', card).appendChild(h(`<div class="muted" style="margin-top:8px;font-size:12px">仅显示前 ${ImportState.preview.length} 行，共 ${ImportState.total} 条将被处理。</div>`));

      // 异常
      const isb = $('#tp-is', card);
      if (!ImportState.issueCount) isb.appendChild(h('<div class="empty">未发现明显问题 ✓</div>'));
      else {
        const t2 = h('<table class="map-tbl"><thead><tr><th style="width:70px">行号</th><th style="width:70px">级别</th><th>说明</th></tr></thead><tbody></tbody></table>');
        const b2 = $('tbody', t2);
        ImportState.issues.slice(0, 200).forEach((x) => {
          b2.appendChild(h(`<tr><td class="muted">${x.row}</td>
            <td><span class="tag ${x.level === 'error' ? 'r' : x.level === 'warn' ? 'o' : 'n'}">${x.level === 'error' ? '错误' : x.level === 'warn' ? '提醒' : '提示'}</span></td>
            <td>${esc(x.msg)}</td></tr>`));
        });
        isb.appendChild(h('<div style="max-height:340px;overflow:auto"></div>')).appendChild(t2);
      }

      // 跳过行
      const skb = $('#tp-sk', card);
      if (!ImportState.skipped.length) skb.appendChild(h('<div class="empty">没有跳过的行</div>'));
      else {
        const t3 = h('<table class="map-tbl"><thead><tr><th style="width:70px">行号</th><th style="width:170px">原因</th><th>首列内容</th></tr></thead><tbody></tbody></table>');
        const b3 = $('tbody', t3);
        ImportState.skipped.forEach((x) => b3.appendChild(h(`<tr><td class="muted">${x.row}</td><td>${esc(x.reason)}</td><td class="muted">${esc(x.sample)}</td></tr>`)));
        skb.appendChild(h('<div style="max-height:340px;overflow:auto"></div>')).appendChild(t3);
      }
    }

    function hdrText(i) {
      const c = ImportState.cols && ImportState.cols[i];
      if (c && c.header) return c.header;
      return '（空表头）';
    }
    function sampleText(i) {
      const k = ImportState.mapping[i];
      const r = ImportState.preview[0];
      if (!k || !r) return '';
      return String(r[k] == null ? '' : r[k]).slice(0, 40);
    }
    function labelOf(k) {
      const f = ((Session.options || {}).fields || []).find((x) => x.key === k);
      return f ? f.label : k;
    }

    /* ---- 步骤三：确认导入 ---- */
    function renderStep3() {
      clear(box3);
      if (!ImportState.token) return;
      // 只能向有写权限的单位导入（下级单位只读）
      const units = ((Session.options || {}).units || []).filter((u) => Session.canWriteUnit(u));
      const defUnit = Session.canWriteUnit(Scope.unit) ? Scope.unit : (Session.myUnit() || '');
      const card = h(`<div class="card" style="margin-top:12px">
        <div class="card-h"><h3>③ 确认导入</h3></div>
        <div class="card-b">
          <div class="grid" style="grid-template-columns:1fr 1fr">
            <div class="field" style="margin:0">
              <label>导入模式</label>
              <select class="sel" id="im-mode">
                <option value="upsert">新增并更新（按资产编号去重，推荐）</option>
                <option value="insert">仅新增（编号已存在的跳过）</option>
                <option value="replace">清空当前数据后全部导入</option>
              </select>
            </div>
            <div class="field" style="margin:0">
              <label>默认所属单位（Excel 中未填写单位时套用）</label>
              <input class="inp" id="im-unit" list="im-units" value="${esc(defUnit)}" placeholder="留空则不设置">
              <datalist id="im-units">${units.map((u) => `<option value="${esc(u)}"></option>`).join('')}</datalist>
            </div>
          </div>
          <div class="muted" style="font-size:12px;margin-top:10px;line-height:1.7">
            去重依据：<b>资产编号</b>。编号为空的记录始终按新增处理。<br>
            「清空后导入」会删除当前${Session.user && Session.user.unit ? `单位（${esc(Session.user.unit)}）下` : '全部'}的资产数据，请谨慎操作。
          </div>
          <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
            <button class="btn pri lg" id="im-go">开始导入 ${ImportState.total} 条</button>
            <button class="btn" id="im-cancel">取消</button>
            <span id="im-res" style="font-size:12.5px"></span>
          </div>
        </div>
      </div>`);
      box3.appendChild(card);

      on($('#im-cancel', card), 'click', () => {
        ImportState.token = '';
        clear(box2); clear(box3);
        drop.innerHTML = '<div class="ic">⇪</div><div class="t">点击选择，或把 .xlsx 文件拖到这里</div><div class="s">自动识别表头行与字段，支持合并单元格、日期、公式结果值</div>';
      });

      on($('#im-go', card), 'click', async () => {
        const btn = $('#im-go', card);
        const res = $('#im-res', card);
        const mode = $('#im-mode', card).value;
        const unit = $('#im-unit', card).value.trim();
        if (mode === 'replace') {
          if (!await confirmDlg('「清空后导入」将删除现有数据后再导入，<b>此操作不可恢复</b>。确定继续吗？')) return;
        }
        btn.disabled = true;
        btn.textContent = '导入中…';
        res.className = 'muted';
        res.textContent = '正在写入数据库…';
        try {
          const r = await API.post('/api/import/commit', {
            token: ImportState.token, mode, unit, mapping: ImportState.mapping,
          });
          res.className = '';
          res.innerHTML = `<span style="color:var(--ok)">导入完成：新增 <b>${r.created}</b> 条，更新 <b>${r.updated}</b> 条，跳过 <b>${r.skipped}</b> 条。当前共 ${r.total} 条。</span>`;
          toast('导入完成', 'ok');
          btn.textContent = '已完成';
          await Session.loadOptions(true);
          $('#im-cancel', card).textContent = '导入其它文件';
        } catch (e) {
          res.innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
          btn.disabled = false;
          btn.textContent = '重试导入';
        }
      });
    }
  },
};

/* ===== 08-admin.js ===== */
'use strict';
/* ============================================================
 *  admin —— 用户管理 / 单位管理 / 操作日志
 * ============================================================ */

function guard(root, perm) {
  if (Session.can(perm)) return false;
  root.appendChild(h('<div class="empty"><div class="ic">⛔</div><div>当前角色无权访问此页面</div></div>'));
  return true;
}

/* ------------------------------ 单位 ↔ 用户 通用工具 ------------------------------ */

/** 当前用户是否有权管理目标用户：系统管理员全部；其余仅本单位及下级单位的非管理员账号 */
function canManageUser(u) {
  if (Session.isSysAdmin()) return true;
  if (!u || u.role === 'admin') return false;
  if (!Session.myUnit()) return true;
  return Scope.units.indexOf(u.unit || '') >= 0;
}

/** 可分配的单位（系统管理员可留空 = 全部单位；其余为本单位及下级），带层级缩进 */
function unitOptions(selected, allowEmpty) {
  const out = [];
  if (allowEmpty) {
    out.push(`<option value="" ${!selected ? 'selected' : ''}>（全部单位 · 仅系统管理员）</option>`);
  }
  const walk = (arr, depth) => (arr || []).forEach((n) => {
    const pad = depth ? '　'.repeat(depth) + '└ ' : '';
    out.push(`<option value="${esc(n.name)}" ${n.name === selected ? 'selected' : ''}>${pad}${esc(n.name)}</option>`);
    walk(n.children || [], depth + 1);
  });
  walk(Scope.tree, 0);
  if (!out.length) out.push('<option value="">（暂无可选单位）</option>');
  return out.join('');
}

        rows = us.rows || [];
        render(rows);
        // 单位有增删 / 层级变动时同步左侧单位树
        await Scope.refresh();
        if (Scope.unit && Scope.units.indexOf(Scope.unit) < 0) Scope.set('');
        else renderUnitTree();
      } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    }

    /** 由扁平行构建「本单位 + 全部下级」的合计条数 */
    function subtreeCount(list) {
      const kids = new Map();
      list.forEach((u) => {
        const p = u.parent || '';
        if (!kids.has(p)) kids.set(p, []);
        kids.get(p).push(u);
      });
      const total = {};
      const walk = (u) => {
        let s = u.assetCount || 0;
        (kids.get(u.id) || []).forEach((c) => { s += walk(c); });
        total[u.id] = s;
        return s;
      };
      list.filter((u) => !u.parent).forEach(walk);
      list.forEach((u) => { if (total[u.id] === undefined) total[u.id] = u.assetCount || 0; });
      return total;
    }

    function render(list) {
      clear(box);
      if (!list.length) { box.appendChild(h('<div class="empty"><div class="ic">⚑</div><div>尚未登记任何单位</div></div>')); return; }
      const sums = subtreeCount(list);
      const byId = {};
      list.forEach((u) => { byId[u.id] = u; });
      // 按层级排序输出：父在前、子紧随其后
      const ordered = [];
      const walk = (parentId, depth) => list.filter((u) => (u.parent || '') === parentId)
        .sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), 'zh-CN'))
        .forEach((u) => { ordered.push({ u, depth }); walk(u.id, depth + 1); });
      walk('', 0);

      const tbl = h(`<table class="tbl"><thead><tr><th style="width:52px">序</th><th>单位名称</th><th>上级单位</th><th>代码</th>
        <th class="right">本单位</th><th class="right">含下级</th><th class="right">操作</th></tr></thead><tbody></tbody></table>`);
      const tb = $('tbody', tbl);
      ordered.forEach(({ u, depth }, i) => {
        const hasKid = list.some((x) => x.parent === u.id);
        tb.appendChild(h(`<tr>
          <td class="muted mono">${i + 1}</td>
          <td style="padding-left:${10 + depth * 16}px">${depth ? '<span class="muted">└ </span>' : ''}${esc(u.name)}${hasKid ? ' <span class="tag n">上级</span>' : ''}</td>

            <span class="link" data-e="${u.id}">编辑</span>
            <span class="link dg" data-x="${u.id}">删除</span>
          </td>
        </tr>`));
      });
      box.appendChild(tbl);

      $$('[data-e]', box).forEach((n) => on(n, 'click', () => editUnit(list.find((x) => x.id === n.dataset.e), list, load)));
      $$('[data-x]', box).forEach((n) => on(n, 'click', async () => {
        const u = list.find((x) => x.id === n.dataset.x);
        if (!await confirmDlg(`确定删除单位 <b>${esc(u.name)}</b> 吗？`)) return;
        try { await API.del('/api/units/' + u.id); toast('已删除', 'ok'); await Session.loadOptions(true); load(); }
        catch (e) { toast(e.message, 'err'); }
      }));
    }
    load();
  },
};

/** 新增 / 编辑单位（含上级单位层级） */
function editUnit(u, allRows, done) {
  const isNew = !u;
  // 上级候选排除自己及其所有下级，避免把上级设成自己的下级（成环）
  const banned = new Set();
  if (u) {
    banned.add(u.id);
    const collect = (id) => (allRows || []).filter((x) => x.parent === id).forEach((c) => { banned.add(c.id); collect(c.id); });
    collect(u.id);
  }
  const opts = (allRows || []).filter((x) => !banned.has(x.id))
    .sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), 'zh-CN'))
    .map((x) => `<option value="${esc(x.id)}" ${u && u.parent === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');

  modal({
    title: isNew ? '新增单位' : '编辑单位：' + u.name,
    body: `<div class="field"><label>单位全称</label><input class="inp" id="nu-n" value="${esc(u ? u.name : '')}" placeholder="例如：国家税务总局重庆市江北区税务局"></div>
           <div class="field"><label>上级单位（留空则为顶级单位）</label>
             <select class="sel" id="nu-p"><option value="">— 顶级单位 —</option>${opts}</select>
             <div class="muted" style="font-size:11.5px;margin-top:4px">上级单位的用户可查看本单位（下级）数据，但不能修改。</div>
           </div>
           <div class="field"><label>单位代码（可选）</label><input class="inp" id="nu-c" value="${esc(u ? (u.code || '') : '')}"></div>
           <div class="err" style="color:var(--danger);font-size:12px;min-height:16px" id="nu-err"></div>`,
    buttons: [
      { text: '取消' },
      {
        text: '保存', cls: 'pri', onClick: async (close) => {
          try {
            const data = { name: $('#nu-n').value.trim(), code: $('#nu-c').value.trim(), parent: $('#nu-p').value };

            else await API.put('/api/units/' + u.id, data);
            toast('已保存', 'ok'); close(); await Session.loadOptions(true); done && done();
          } catch (e) { $('#nu-err').textContent = e.message; }

'use strict';
/* ============================================================
 *  map —— 资产标注
 *  地图服务商由「系统设置 → 地图服务」决定，页面通过 Geo 适配层操作地图，
 *  不再直接依赖某一家 SDK（见 00-geo.js）。
 * ============================================================ */

function markerIcon(color) {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">'
    + '<path d="M13 1C6.9 1 2 5.9 2 12c0 8 11 21 11 21s11-13 11-21c0-6.1-4.9-11-11-11z" fill="' + color + '" stroke="#ffffff" stroke-width="2"/>'
    + '<circle cx="13" cy="12" r="4.2" fill="#ffffff"/></svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function tempIcon(color) {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">'
    + '<path d="M13 1C6.9 1 2 5.9 2 12c0 8 11 21 11 21s11-13 11-21c0-6.1-4.9-11-11-11z" fill="' + color + '" stroke="#2159d6" stroke-width="2"/>'
    + '<circle cx="13" cy="12" r="4.2" fill="#2159d6"/></svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* 地图容器高度兜底：
 * Android WebView 开启 wide viewport + overview 后，height:100% 百分比链可能解析成
 * 页面内容高度（实测塌陷到 8192px），WebGL 纹理超出 GPU 上限（常见 4096/8192），
 * 腾讯地图直接报「超过支持的最大纹理尺寸」并整块白屏。这里按视口高度显式设像素值：
 * 正常布局取父容器高度，异常时（父高远超视口）回退视口高度。 */
function fixMapHeight(el) {
  if (!el) return;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
  const parentH = el.parentElement ? el.parentElement.clientHeight : 0;
  let h = parentH > 200 ? parentH : vh;
  if (vh > 0 && h > vh) h = vh; // 钳制：绝不超过视口高度
  if (h > 200) el.style.height = Math.round(h) + 'px';
}

            <div class="mp-sea-res" id="mp-sea-res" style="display:none"></div>
          </div>
          <div class="map-box" id="mp-keybox" style="display:none"></div>
          <div class="map-box" id="mp-draw" style="display:none">
            <div style="display:flex;gap:6px;align-items:center">
              <span class="muted" style="font-size:12px">用地范围</span>
              <button class="btn sm" id="mp-draw-on">开始绘制</button>
              <button class="btn sm pri" id="mp-draw-ok" style="display:none">完成</button>
              <button class="btn sm" id="mp-draw-clr" style="display:none">撤销</button>
            </div>
          </div>
          <div class="map-box">
            <span class="muted" id="mp-mode" style="font-size:12px">点击左侧资产 → 在地图上打点标注</span>
            <button class="btn sm" id="mp-exit" style="display:none;margin-left:8px">退出标注</button>
          </div>
        </div>
      </div>
    </div>`);
    root.appendChild(page);

    const kw = $('#mp-kw', page);
    let t;
    on(kw, 'input', () => { clearTimeout(t); t = setTimeout(() => { self.kw = kw.value.trim(); self.renderList(); }, 200); });
    $$('.chip', page).forEach((c) => on(c, 'click', () => {
      $$('.chip', page).forEach((x) => x.classList.remove('on'));
      c.classList.add('on');
      self.filter = c.dataset.f;
      self.renderList();
    }));
    on($('#mp-reload', page), 'click', () => {
      self.load().then(() => self.refresh()).catch((e) => toast(e.message, 'err'));
    });
    /* ---- 位置搜索 ---- */
    const sea = $('#mp-sea', page);
    let st;
    on(sea, 'input', () => { clearTimeout(st); st = setTimeout(() => self.runSearch(), 350); });
    on(sea, 'keydown', (e) => {
      if (e.key === 'Enter') { clearTimeout(st); self.runSearch(); }
      else if (e.key === 'Escape') self.hideSeaRes();
    });
    on($('#mp-sea-go', page), 'click', () => { clearTimeout(st); self.runSearch(); });
    on($('#mp-sea-clr', page), 'click', () => self.clearSea());
    on($('#mp-exit', page), 'click', () => self.exitMarking());
    // 点击搜索框以外的地方收起候选列表（放在 document 上，避免结果项还没触发 click 就被移除）
    this._seaDocFn = (e) => {
      const box = $('#mp-sea-box', page);
      if (box && !box.contains(e.target)) self.hideSeaRes();
    };
    document.addEventListener('mousedown', this._seaDocFn);

    on($('#mp-fit', page), 'click', () => self.fitAll());
    on($('#mp-geo', page), 'click', () => self.batchGeocode());
    on($('#mp-draw-on', page), 'click', () => self.startDraw());
    on($('#mp-draw-ok', page), 'click', () => self.finishDraw());
    on($('#mp-draw-clr', page), 'click', () => self.undoDraw());

    this.load()
      .then(() => this.initMap())
      .catch((e) => {
        if (e.message === 'NO_CONFIG') this.showKeySetup(e);
        else toast(e.message, 'err');
      });
  },

  isMarked(a) { return Number.isFinite(a.lng) && Number.isFinite(a.lat); },

  /* ------------------------------ 数据 ------------------------------ */

  async load() {
    const r = await API.getQ('/api/assets', Scope.params({ pageSize: 'all', sort: 'rowNo', order: 'asc' }));
    this.assets = r.rows;
    this.renderList();
    this.renderMarkers();
  },

  renderList() {
    const box = $('#mp-lst', this.rootEl);
    if (!box) return;
    const kw = this.kw.toLowerCase();
    let list = this.assets.slice();
    if (this.filter === 'no') list = list.filter((a) => !this.isMarked(a));
    if (this.filter === 'yes') list = list.filter((a) => this.isMarked(a));
    if (kw) list = list.filter((a) => [a.name, a.location, a.useUnit, a.assetNo].join(' ').toLowerCase().includes(kw));

    clear(box);
    if (!list.length) box.appendChild(h('<div class="empty" style="padding:24px">没有匹配的资产</div>'));
    list.slice(0, 500).forEach((a) => {
      const marked = this.isMarked(a);
      const it = h(`<div class="it ${marked ? 'done' : ''} ${this.markingId === a.id ? 'on' : ''}" data-id="${a.id}">
        <div class="pin">${marked ? '◉' : '◎'}</div>
        <div style="min-width:0;flex:1">
          <div class="nm ellip">${esc(a.name || '未命名资产')}</div>
          <div class="mt ellip">${esc(a.location || a.unit || '')}</div>
          <div class="mt" style="margin-top:3px">
            <span class="tag ${a.category === '办公用房' ? 'b' : 'n'}">${esc(a.category || '-')}</span>
            <span class="tag ${marked ? 'g' : 'n'}" style="margin-left:4px">${marked ? '已标注' : '待标注'}</span>
          </div>
        </div>
      </div>`);
      on(it, 'click', () => this.focus(a.id));
      box.appendChild(it);
    });

    const marked = this.assets.filter((a) => this.isMarked(a)).length;
    const st = $('#mp-stat', this.rootEl);
    if (st) st.innerHTML = `列表 ${list.length} / ${this.assets.length} 条 ｜ 已标注 <b>${marked}</b> 条`;
  },

  /* ------------------------------ 地图初始化 ------------------------------ */

  async initMap() {
    await Geo.sdk();
    const self = this;
    const el = document.getElementById('map');
    if (!el || this.map) return;

    // Android WebView（useWideViewPort + overview 模式）下 height:100% 链可能塌陷成
    // 内容高度（实测 8192px），WebGL 纹理超限 → 地图整块白屏。创建前显式按视口高度兜底。
    fixMapHeight(el);

    // 容器 id 交给适配层（各家用法不同）；默认视野取自系统设置
    this.map = Geo.createMap('map', Geo.center());

    this.markers = Geo.markerLayer(this.map, {});
    Geo.layerOn(this.markers, 'click', (evt) => {
      const id = evt.geometry && evt.geometry.id;
      const a = self.assets.find((x) => x.id === id);
      if (a) self.showInfo(a);
    });

    this.tempMarker = Geo.markerLayer(this.map, {
      t: { src: tempIcon('#f0a500'), width: 26, height: 34, anchorX: 13, anchorY: 34 }, // 待确认的标注点
      q: { src: tempIcon('#2f7de1'), width: 26, height: 34, anchorX: 13, anchorY: 34 }, // 搜索定位点
    });

    this.polygonLayer = Geo.polygonLayer(this.map, {
      fillColor: 'rgba(33,89,214,0.20)', borderColor: '#2159d6', borderWidth: 2,
    });

    this.polyLayer = Geo.polylineLayer(this.map, { borderColor: '#2159d6', borderWidth: 3 });

    this.infoWin = Geo.infoWindow(this.map);

    Geo.onMap(this.map, 'click', (evt) => self.onMapClick(evt));

    this.refresh(el);
  },

  /** 刷新地图：重绘点位，等容器布局完成后再校正尺寸与视野 */
  refresh(el) {
    this.renderMarkers();
    const box = el || document.getElementById('map');
    whenMapSized(box, () => {
      if (!this.map) return;
      fixMapHeight(box);
      Geo.resize(this.map);
      this.fitAll();
    });
  },

  onMapClick(evt) {
    const p = Geo.clickLngLat(evt);
    if (!p) return;
    const { lat, lng } = p;
    if (this.drawing) {
      this.poly.push({ lng: Math.round(lng * 1e6) / 1e6, lat: Math.round(lat * 1e6) / 1e6 });
      this.renderDraft();
      return;
    }
    if (!this.markingId) return;
    Geo.closeIw(this.infoWin);
    this.tempPos = { lng, lat };
    this.renderTemp();
    this.confirmMark();
  },

  /** 临时图层：搜索定位点（q）与待确认标注点（t）一起渲染，避免后者把前者覆盖掉 */
  renderTemp() {
    if (!this.tempMarker || this.drawing) return;
    const gs = [];
    if (this.searchPos) {
      gs.push({ id: 'sea', styleId: 'q', position: { lat: this.searchPos.lat, lng: this.searchPos.lng } });
    }
    if (this.tempPos) {
      gs.push({ id: 'tmp', styleId: 't', position: { lat: this.tempPos.lat, lng: this.tempPos.lng } });
    }
    Geo.setMarkers(this.tempMarker, gs);
  },

  /* ------------------------------ 位置搜索 ------------------------------ */

  /** 解析「经度,纬度」文本；系统内坐标一律按经度在前展示，反序也能容错识别 */
  parseLngLat(s) {
    const m = String(s || '').trim().match(/^(-?\d+(?:\.\d+)?)\s*[,，、\s]\s*(-?\d+(?:\.\d+)?)$/);
    if (!m) return null;
    const a = Number(m[1]), b = Number(m[2]);
    if (Math.abs(a) <= 180 && Math.abs(b) <= 90) return { lng: a, lat: b };
    if (Math.abs(b) <= 180 && Math.abs(a) <= 90) return { lng: b, lat: a };
    return null;
  },

  async runSearch() {
    const inp = $('#mp-sea', this.rootEl);
    const box = $('#mp-sea-res', this.rootEl);
    if (!inp || !box) return;
    const q = (inp.value || '').trim();
    if (!q) { this.hideSeaRes(); return; }
    if (!this.map) { toast('地图尚未就绪，无法定位。请先到「系统设置 → 地图服务」完成配置', 'warn'); return; }

    // 直接输入坐标：不走搜索服务，立即定位
    const c = this.parseLngLat(q);
    if (c) {
      this.hideSeaRes();
      this.locate({ title: '坐标定位', address: q, lng: c.lng, lat: c.lat }, true);
      return;
    }

    const seq = ++this._seaSeq;
    box.style.display = '';
    box.innerHTML = '<div class="mp-sea-tip">搜索中…</div>';
    try {
      const list = await Geo.suggest(q, 10);
      if (seq !== this._seaSeq) return; // 已有更新的请求，丢弃旧结果
      this.searchItems = list || [];
      this.renderSeaRes();
    } catch (e) {
      if (seq !== this._seaSeq) return;
      this.searchItems = [];
      box.style.display = '';
      box.innerHTML = `<div class="mp-sea-tip err">搜索失败：${esc(e.message || '未知错误')}</div>`
        + '<div class="mp-sea-tip">可稍后重试，或在「系统设置 → 地图服务」更换密钥；也可以直接输入「经度,纬度」定位</div>';
    }
  },

  renderSeaRes() {
    const box = $('#mp-sea-res', this.rootEl);
    if (!box) return;
    box.style.display = '';
    clear(box);
    if (!this.searchItems.length) {
      box.appendChild(h('<div class="mp-sea-tip">没有找到匹配的位置：可补全地址（带上区县/街道）后重试，'
        + '或直接输入「经度,纬度」定位</div>'));
      return;
    }
    this.searchItems.slice(0, 8).forEach((it, i) => {
      const row = h(`<div class="mp-sea-item" data-i="${i}">
        <div class="t">${esc(it.title || '未命名地点')}</div>
        <div class="a">${esc(it.address || '')}</div>
        <div class="c mono">${Number(it.lng).toFixed(6)}, ${Number(it.lat).toFixed(6)}</div>
      </div>`);
      on(row, 'click', () => this.locate(it));
      box.appendChild(row);
    });
  },

  hideSeaRes() {
    const box = $('#mp-sea-res', this.rootEl);
    if (box) { box.style.display = 'none'; clear(box); }
  },

  /** 定位到搜索结果：地图放大到街道级并落下临时点位（keepText：保留输入框原文） */
  locate(it, keepText) {
    const lat = Number(it && it.lat), lng = Number(it && it.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
    if (!this.map) { toast('地图尚未就绪，无法定位', 'warn'); return; }

    this.searchPos = { lng, lat };
    this.renderTemp();
    Geo.panTo(this.map, lat, lng, this.SEA_ZOOM);
    this.hideSeaRes();

    const inp = $('#mp-sea', this.rootEl);
    if (inp && !keepText) inp.value = it.title || inp.value;
    const clr = $('#mp-sea-clr', this.rootEl);
    if (clr) clr.style.display = '';

    const a = this.assets.find((x) => x.id === this.markingId);
    if (a && Session.canWriteAsset(a)) {
      // 正在标注：把搜索到的位置直接作为候选点交给确认流程
      this.tempPos = { lng, lat };
      this.confirmMark();
      return;
    }
    const mode = $('#mp-mode', this.rootEl);
    const name = it.title || '该位置';
    if (mode) mode.innerHTML = `<span class="tag b">已定位：${esc(fmt.cut(name, 14))}</span>`;
    toast(`已定位到「${name}」，点击左侧资产后即可在该位置打点`, 'ok');
  },

  clearSea() {
    this.searchPos = null;
    this.searchItems = [];
    this._seaSeq++;
    const inp = $('#mp-sea', this.rootEl);
    if (inp) inp.value = '';
    const clr = $('#mp-sea-clr', this.rootEl);
    if (clr) clr.style.display = 'none';
    this.hideSeaRes();
    this.renderTemp();
  },

  /* ------------------------------ 图层渲染 ------------------------------ */

  renderMarkers() {
    if (!this.markers) return;
    const marked = this.assets.filter((a) => this.isMarked(a));

    const cats = [...new Set(marked.map((a) => a.category || '未填写'))];
    const styles = {};
    cats.forEach((c, i) => {
      styles['s' + i] = { src: markerIcon(colorOf(CAT_COLOR, c, i)), width: 26, height: 34, anchorX: 13, anchorY: 34 };
    });

    const geoms = marked.map((a) => ({
      id: a.id,
      styleId: 's' + cats.indexOf(a.category || '未填写'),
      position: { lat: a.lat, lng: a.lng },
    }));

    const polys = marked
      .filter((a) => Array.isArray(a.polygon) && a.polygon.length >= 3)
      .map((a) => ({
        id: a.id,
        styleId: 'p',
        paths: a.polygon.map((p) => ({ lat: p.lat, lng: p.lng })),
      }));

    Geo.setStyles(this.markers, styles);
    // 注意：必须整体替换（天地图适配层按 id 增量维护，多余的会自动移除），
    // 否则筛选后已消失的点位会残留在地图上。
    Geo.setMarkers(this.markers, geoms);
    Geo.setPaths(this.polygonLayer, polys);
  },

  fitAll() {
    if (!this.map) return;
    const marked = this.assets.filter((a) => this.isMarked(a));
    if (!marked.length) {
      const c = Geo.center();
      Geo.setCenter(this.map, c.lat, c.lng);
      Geo.setZoom(this.map, c.zoom);
      return;
    }
    Geo.fitBounds(this.map, marked.map((a) => ({ lat: a.lat, lng: a.lng })));
  },

  /* ------------------------------ 标注流程 ------------------------------ */

  focus(id) {
    const a = this.assets.find((x) => x.id === id);
    if (!a) return;
    // 下级单位数据只读：只定位查看，不进入标注模式
    if (!Session.canWriteAsset(a)) {
      this.exitMarking();
      if (this.map && this.isMarked(a)) {
        Geo.panTo(this.map, a.lat, a.lng, 16);
        this.showInfo(a);
      }
      toast('下级单位数据为只读，仅可查看', 'warn');
      return;
    }
    this.markingId = id;
    this.tempPos = null;
    this.poly = [];
    this.drawing = false;
    this.syncDrawUI();
    this.renderList();

    const hint = $('#mp-hint', this.rootEl);
    const mode = $('#mp-mode', this.rootEl);
    if (hint) {
      hint.style.display = '';
      hint.innerHTML = `正在标注：<b>${esc(a.name || '')}</b> — ${this.isMarked(a) ? '已有点位，可点击地图重新选点' : '在地图上点击目标位置'}`;
    }
    if (mode) mode.innerHTML = '<span class="tag b">标注模式</span>';
    const ex = $('#mp-exit', this.rootEl);
    if (ex) ex.style.display = '';

    if (this.map && this.isMarked(a)) {
      Geo.panTo(this.map, a.lat, a.lng, 16);
      this.showInfo(a);
    } else if (this.infoWin) {
      Geo.closeIw(this.infoWin);
    }
  },

  exitMarking() {
    this.markingId = null;
    this.tempPos = null;
    this.poly = [];
    this.drawing = false;
    this.renderTemp(); // 清掉待确认的标注点，搜索定位点保留
    if (this.polyLayer) Geo.setPaths(this.polyLayer, []);
    this.syncDrawUI();
    const hint = $('#mp-hint', this.rootEl);
    if (hint) hint.style.display = 'none';
    const mode = $('#mp-mode', this.rootEl);
    if (mode) mode.textContent = '点击左侧资产 → 在地图上打点标注';
    const ex = $('#mp-exit', this.rootEl);
    if (ex) ex.style.display = 'none';
    this.renderList();
  },

  /** 信息窗内容会被序列化为字符串，因此用全局函数绑定点击 */
  showInfo(a) {
    if (!this.infoWin) return;
    const self = this;
    const html = `<div class="iw">
      <div class="t">${esc(a.name || '未命名资产')}</div>
      <div class="r">${esc(a.category || '-')} ｜ ${esc(a.useStatus || '-')} ｜ ${esc(fmt.area(a.area))} ㎡</div>
      <div class="r">${esc(a.location || '')}</div>
      <div class="r muted">${a.lng}, ${a.lat}${a.geoBy ? ' · ' + esc(a.geoBy) : ''}</div>
      <div class="r muted">${esc(a.unit || '未填写单位')}${Session.canWriteAsset(a) ? '' : ' · <b>只读</b>（下级单位数据仅可查看）'}</div>
      <div class="a">
        <button class="btn sm" onclick="MapPage.iwView('${a.id}')">详情</button>
        ${Session.canWriteAsset(a) ? `
        <button class="btn sm" onclick="MapPage.iwEdit('${a.id}')">资料</button>
        <button class="btn sm" onclick="MapPage.iwRemark('${a.id}')">重新标注</button>
        <button class="btn sm danger" onclick="MapPage.iwClear('${a.id}')">清除</button>` : ''}
      </div>
    </div>`;
    Geo.setIwContent(this.infoWin, html);
    Geo.setIwPosition(this.infoWin, a.lat, a.lng);
    Geo.openIw(this.infoWin);
  },

  /** 只读详情（下级单位资产在此只能查看） */
  iwView(id) {
    const a = this.assets.find((x) => x.id === id);
    if (!a) return;
    Geo.closeIw(this.infoWin);
    AssetForm.view(a);
  },
  iwEdit(id) {
    const a = this.assets.find((x) => x.id === id);
    if (!a) return;
    if (!Session.canWriteAsset(a)) { toast('下级单位数据为只读，不能修改', 'warn'); return; }
    Geo.closeIw(this.infoWin); // 先收起地图信息窗，避免与资料弹窗叠在一起
    AssetForm.edit(a, () => this.load());
  },
  iwRemark(id) {
    Geo.closeIw(this.infoWin);
    this.focus(id);
  },
  async iwClear(id) {
    const a = this.assets.find((x) => x.id === id);
    if (!await confirmDlg(`确定清除 <b>${esc((a && a.name) || '')}</b> 的地图标注吗？`)) return;
    try {
      await API.put('/api/assets/' + id + '/geo', { lng: null, lat: null });
      toast('已清除标注', 'ok');
      Geo.closeIw(this.infoWin);
      this.exitMarking();
      this.load();
    } catch (e) { toast(e.message, 'err'); }
  },

  async confirmMark() {
    const a = this.assets.find((x) => x.id === this.markingId);
    if (!a || !this.tempPos) return;
    const { lng, lat } = this.tempPos;

    let addr = '';
    try {
      addr = (await Geo.reverse(lat, lng)) || '';
    } catch (e) { /* 逆地理编码失败不阻断标注 */ }

    const coordName = (Geo.cfg && Geo.cfg.coord) || 'GCJ-02';
    const body = h(`<div>
      <div style="font-size:13px;margin-bottom:10px">将资产 <b>${esc(a.name || '')}</b> 标注到该位置：</div>
      <div class="muted" style="font-size:12px;line-height:1.9">
        坐标：<span class="mono">${lng.toFixed(6)}, ${lat.toFixed(6)}</span>（${esc(coordName)}）<br>
        解析地址：${esc(addr || '（未能解析）')}<br>
        原坐落位置：${esc(a.location || '（空）')}
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px">
        <input type="checkbox" id="ck-addr" ${addr ? 'checked' : ''}> 同时用解析地址更新「坐落位置」字段
      </label>
    </div>`);

    const self = this;
    modal({
      title: '确认标注位置',
      bodyNode: body,
      buttons: [
        {
          text: '取消', onClick: (c) => {
            c();
            self.tempPos = null;
            self.renderTemp();
          },
        },
        {
          text: '保存标注', cls: 'pri', onClick: async (close) => {
            try {
              await API.put('/api/assets/' + a.id + '/geo', { lng, lat, address: addr });
              if ($('#ck-addr').checked && addr) {
                await API.put('/api/assets/' + a.id, Object.assign({}, a, { location: addr }));
              }
              toast('标注已保存', 'ok');
              close();
              self.tempPos = null;
              self.renderTemp();
              self.exitMarking();
              self.load();
            } catch (e) { toast(e.message, 'err'); }
          },
        },
      ],
    });
  },

  /* ------------------------------ 用地范围绘制 ------------------------------ */

  syncDrawUI() {
    const box = $('#mp-draw', this.rootEl);
    if (!box) return;
    box.style.display = this.markingId ? '' : 'none';
    const on2 = $('#mp-draw-on', box);
    const ok2 = $('#mp-draw-ok', box);
    const clr = $('#mp-draw-clr', box);
    if (!on2) return;
    on2.style.display = this.drawing ? 'none' : '';
    ok2.style.display = this.drawing ? '' : 'none';
    clr.style.display = this.drawing ? '' : 'none';
    if (this.drawing) {
      const hint = $('#mp-hint', this.rootEl);
      if (hint) { hint.style.display = ''; hint.innerHTML = `正在绘制用地范围：<b>${this.poly.length}</b> 个顶点 · 继续在地图上点击添加，完成后点「完成」`; }
    }
  },

  startDraw() {
    const a = this.assets.find((x) => x.id === this.markingId);
    if (!a) { toast('请先选择一条资产', 'warn'); return; }
    if (!this.isMarked(a)) { toast('请先完成点位标注，再绘制用地范围', 'warn'); return; }
    this.drawing = true;
    this.poly = Array.isArray(a.polygon) ? a.polygon.slice() : [];
    Geo.closeIw(this.infoWin);
    this.renderDraft();
    this.syncDrawUI();
  },

  renderDraft() {
    if (!this.polyLayer) return;
    const pts = this.poly.map((p) => ({ lat: p.lat, lng: p.lng }));
    if (pts.length >= 2) {
      Geo.setPaths(this.polyLayer, [{ id: 'draft', styleId: 'd', paths: pts.concat([pts[0]]) }]);
    } else {
      Geo.setPaths(this.polyLayer, []);
    }
    Geo.setMarkers(this.tempMarker, this.poly.map((p, i) => ({
      id: 'v' + i, styleId: 't', position: { lat: p.lat, lng: p.lng },
    })));
    this.syncDrawUI();
  },

  undoDraw() {
    this.poly.pop();
    this.renderDraft();
  },

  async finishDraw() {
    const a = this.assets.find((x) => x.id === this.markingId);
    if (!a) return;
    if (this.poly.length < 3) { toast('用地范围至少需要 3 个顶点', 'warn'); return; }
    try {
      await API.put('/api/assets/' + a.id + '/geo', { lng: a.lng, lat: a.lat, polygon: this.poly });
      toast('用地范围已保存', 'ok');
      this.drawing = false;
      this.poly = [];
      if (this.polyLayer) Geo.setPaths(this.polyLayer, []);
      this.renderTemp();
      this.syncDrawUI();
      this.load();
    } catch (e) { toast(e.message, 'err'); }
  },

  /* ------------------------------ 批量地理编码 ------------------------------ */

  async batchGeocode() {
    const todo = this.assets.filter((a) => !this.isMarked(a) && a.location);
    if (!todo.length) { toast('没有可用于解析的未标注资产', 'warn'); return; }
    const n = Math.min(todo.length, 60);
    const pname = (Geo.cfg && Geo.cfg.providerName) || '地图服务';
    if (!await confirmDlg(`将对前 <b>${n}</b> 条未标注资产按「坐落位置」调用${esc(pname)}地理编码解析坐标，<br>结果会<b>自动保存</b>，之后请人工核对点位是否准确。`)) return;

    try { await Geo.sdk(); } catch (e) {
      if (e.message === 'NO_CONFIG') this.showKeySetup(e);
      else toast(e.message, 'err');
      return;
    }

    const items = [];
    let okCount = 0, failCount = 0;

    const dlg = modal({
      title: '批量地址解析',
      body: `<div id="bg-t" style="font-size:13px">正在解析 0 / ${n} …</div>
        <div style="margin-top:10px">${progressBar(0, n).outerHTML}</div>
        <div class="muted" id="bg-log" style="font-size:11.5px;margin-top:10px;max-height:180px;overflow:auto;line-height:1.7"></div>`,
      footer: false,
      maskClose: false,
    });
    const title = $('#bg-t', dlg.body);
    const bar = $('.p', dlg.body);
    const log = $('#bg-log', dlg.body);

    for (let i = 0; i < n; i++) {
      const a = todo[i];
      let addr = String(a.location).trim();
      if (!/重庆/.test(addr)) addr = '重庆市' + addr.replace(/^.*?(省|市)/, '');
      try {
        const loc = await Geo.geocode(addr);
        if (loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lng)) {
          items.push({ id: a.id, lng: loc.lng, lat: loc.lat, address: a.location });
          okCount++;
          log.innerHTML += `<span style="color:var(--ok)">✓</span> ${esc(fmt.cut(a.name, 18))}<br>`;
        } else {
          failCount++;
          log.innerHTML += `<span style="color:var(--danger)">✕</span> ${esc(fmt.cut(a.name, 18))}（未返回结果）<br>`;
        }
      } catch (e) {
        failCount++;
        log.innerHTML += `<span style="color:var(--danger)">✕</span> ${esc(fmt.cut(a.name, 18))}（${esc(e.message || '失败')}）<br>`;
      }
      title.textContent = `正在解析 ${i + 1} / ${n} …`;
      bar.style.width = Math.round(((i + 1) / n) * 100) + '%';
      log.scrollTop = log.scrollHeight;
      await new Promise((r) => setTimeout(r, 120));
    }

    if (items.length) {
      try { await API.post('/api/assets/geo/batch', { items }); }
      catch (e) { toast(e.message, 'err'); }
    }
    dlg.close();
    toast(`解析完成：成功 ${okCount} 条，失败 ${failCount} 条`, okCount ? 'ok' : 'warn');
    this.load();
  },

  /* ------------------------------ 地图未配置时的引导 ------------------------------ */

  /** e：Geo.sdk() 抛出的 NO_CONFIG 错误（msg 已按服务商给出具体说明） */
  showKeySetup(e) {
    const box = $('#mp-keybox', this.rootEl);
    const hint = $('#mp-hint', this.rootEl);
    if (hint) { hint.style.display = ''; hint.innerHTML = '地图服务未就绪：资产列表可用，但无法在地图上打点'; }
    geoNotReady((e && e.msg) || '地图服务未配置');
    if (!box) return;
    box.style.display = '';
    box.innerHTML = `
      <div style="max-width:360px;font-size:12px;line-height:1.8">
        <div style="font-weight:600;font-size:12.5px;margin-bottom:4px">地图服务未配置</div>
        ${esc((e && e.msg) || '请在「系统设置 → 地图服务」中选择服务商并填写密钥。')}
        ${Session.isSysAdmin() ? '<div style="margin-top:8px"><button class="btn pri sm" id="tk-go">前往系统设置</button></div>' : '<div style="margin-top:6px">请联系系统管理员配置。</div>'}
      </div>`;
    const go = $('#tk-go', box);
    if (go) on(go, 'click', () => { location.hash = '#/settings'; });
  },
};

'use strict';
/* ============================================================
 *  preview —— 房产预览：把已标注的房产土地点位铺在地图上，
 *  鼠标移到点位即浮出简要信息（名称/分类/面积/使用状态/产权/账面原值）。
 *  合规说明：底图与地理编码均使用腾讯地图（见 09-map.js）。
 * ============================================================ */

/** 简要信息卡片需要的字段 */
const PV_ROWS = [
  { k: '分类', get: (a) => esc(a.category || '-') },
  { k: '面积', get: (a) => `<b>${esc(fmt.area(a.area))}</b> ㎡` },
  { k: '使用状态', get: (a) => esc(a.useStatus || '-') },
  { k: '产权', get: (a) => pvTitle(a) },
  { k: '账面原值', get: (a) => `<b>${esc(fmt.money(a.originalValue))}</b>` },
];

function pvTitle(a) {
  const parts = [];
  if (a.hasTitle) parts.push(esc(a.hasTitle));
  if (a.titleType) parts.push(esc(fmt.cut(a.titleType, 16)));
  return parts.length ? parts.join(' · ') : '-';
}

/** 悬停态图标：外圈光环 + 放大，锚点仍在底部中心 */
function pvActiveIcon(color) {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">'
    + '<circle cx="18" cy="17" r="15" fill="' + color + '" fill-opacity="0.22" stroke="' + color + '" stroke-width="2.5"/>'
    + '<path d="M18 6C12.5 6 8 10.5 8 16c0 7.5 10 20 10 20s10-12.5 10-20c0-5.5-4.5-10-10-10z" fill="' + color + '" stroke="#ffffff" stroke-width="2"/>'
    + '<circle cx="18" cy="16" r="4.6" fill="#ffffff"/></svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/** 批量地址解析（供预览页在无坐标时快速生成点位） */
async function pvBatchGeocode(assets, onDone) {
  const todo = assets.filter((a) => !(Number.isFinite(a.lng) && Number.isFinite(a.lat)) && a.location);
  if (!todo.length) { toast('没有可用于解析的未标注资产', 'warn'); return; }
  const n = Math.min(todo.length, 60);
  const pname = (Geo.cfg && Geo.cfg.providerName) || '地图服务';
  if (!await confirmDlg(`将对前 <b>${n}</b> 条未标注资产按「坐落位置」调用${esc(pname)}地理编码解析坐标，<br>结果会<b>自动保存</b>，之后请人工核对点位是否准确。`)) return;

  try { await Geo.sdk(); } catch (e) { toast(e.message === 'NO_CONFIG' ? (e.msg || '地图服务未配置') : e.message, 'err'); return; }

  const items = [];
  let okCount = 0, failCount = 0;

  const dlg = modal({
    title: '批量地址解析',
    body: `<div id="bg-t" style="font-size:13px">正在解析 0 / ${n} …</div>
      <div style="margin-top:10px">${progressBar(0, n).outerHTML}</div>
      <div class="muted" id="bg-log" style="font-size:11.5px;margin-top:10px;max-height:180px;overflow:auto;line-height:1.7"></div>`,
    footer: false,
    maskClose: false,
  });
  const title = $('#bg-t', dlg.body);
  const bar = $('.p', dlg.body);
  const log = $('#bg-log', dlg.body);

  for (let i = 0; i < n; i++) {
    const a = todo[i];
    let addr = String(a.location).trim();
    if (!/重庆/.test(addr)) addr = '重庆市' + addr.replace(/^.*?(省|市)/, '');
    try {
      const loc = await Geo.geocode(addr);
      if (loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lng)) {
        items.push({ id: a.id, lng: loc.lng, lat: loc.lat, address: a.location });
        okCount++;
        log.innerHTML += `<span style="color:var(--ok)">✓</span> ${esc(fmt.cut(a.name, 18))}<br>`;
      } else {
        failCount++;
        log.innerHTML += `<span style="color:var(--danger)">✕</span> ${esc(fmt.cut(a.name, 18))}（未返回结果）<br>`;
      }
    } catch (e) {
      failCount++;
      log.innerHTML += `<span style="color:var(--danger)">✕</span> ${esc(fmt.cut(a.name, 18))}（${esc(e.message || '失败')}）<br>`;
    }
    title.textContent = `正在解析 ${i + 1} / ${n} …`;
    bar.style.width = Math.round(((i + 1) / n) * 100) + '%';
    log.scrollTop = log.scrollHeight;
    await new Promise((r) => setTimeout(r, 120));
  }

  if (items.length) {
    try { await API.post('/api/assets/geo/batch', { items }); }
    catch (e) { toast(e.message, 'err'); }
  }
  dlg.close();
  toast(`解析完成：成功 ${okCount} 条，失败 ${failCount} 条`, okCount ? 'ok' : 'warn');
  if (onDone) await onDone();
}
