const PreviewPage = {
  title: '房产预览',
  map: null,
  markers: null,
  highlight: null,
  polygons: null,
  assets: [],
  kw: '',
  cat: 'all',
  status: '',
  hasTitle: '',
  hoverId: null,
  tipTimer: null,
  detailOpen: false, // 详情弹窗打开期间，禁止简要信息浮卡弹出（避免两卡重叠）

  /** 离开页面：销毁地图实例。再次进入时重新创建，避免地图绑在已移除的容器上 */
  leave() {
    if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
    if (this.tipTimer) { clearTimeout(this.tipTimer); this.tipTimer = null; }
    this.hoverId = null;
    this.detailOpen = false;
    this.geoms = null;
    this._projKey = '';
    this._projPts = null;
    this.markers = Geo.destroyLayer(this.markers);
    this.polygons = Geo.destroyLayer(this.polygons);
    this.map = Geo.destroyMap(this.map);
    this.rootEl = null;
  },

  render(root) {
    if (guard(root, 'read')) return;
    const self = this;
    this.leave(); // 每次进入都从干净的地图状态开始（相当于自动刷新）
    root.style.padding = '0';
    this.rootEl = root;
    this.hoverId = null;

    const page = h(`<div class="map-page">
      <div class="map-side">
        <div class="hd">
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">
            <input class="inp" id="pv-kw" placeholder="搜索名称 / 坐落位置 / 使用单位" style="flex:1">
            <button class="btn sm" id="pv-reload" title="刷新">↻</button>
          </div>
          <div class="chips" id="pv-cats"></div>
          <div style="display:flex;gap:6px;margin-top:8px">
            <select class="inp" id="pv-st" style="flex:1"></select>
            <select class="inp" id="pv-ti" style="flex:1"></select>
          </div>
        </div>
        <div class="lst" id="pv-lst"><div class="empty" style="padding:24px">加载中…</div></div>
        <div style="padding:8px 12px;border-top:1px solid var(--line-2)">
          <div style="display:flex;gap:6px">
            <button class="btn sm" id="pv-fit" style="flex:1">全览点位</button>
            <button class="btn sm" id="pv-reset">重置</button>
          </div>
          <div class="muted" style="font-size:11px;margin-top:6px" id="pv-stat"></div>
        </div>
      </div>
      <div class="pv-stage" id="pv-stage">
        <div id="pv-map" class="pv-canvas"></div>
        <div class="pv-stat" id="pv-badge" style="display:none"></div>
        <div class="pv-legend" id="pv-legend"></div>
        <div class="pv-tip" id="pv-tip"></div>
        <div class="map-toolbar">
          <div class="map-box" id="pv-keybox" style="display:none"></div>
          <div class="map-box"><span class="muted" style="font-size:12px">鼠标移到点位查看简要信息 · 点击查看详情</span></div>
        </div>
        <div class="pv-mask" id="pv-mask" style="display:none"></div>
      </div>
    </div>`);
    root.appendChild(page);

    const kw = $('#pv-kw', page);
    let t;
    on(kw, 'input', () => { clearTimeout(t); t = setTimeout(() => { self.kw = kw.value.trim(); self.renderList(); }, 200); });
    on($('#pv-reload', page), 'click', () => {
      self.load().then(() => self.refresh()).catch((e) => toast(e.message, 'err'));
    });
    on($('#pv-fit', page), 'click', () => self.fitAll());
    on($('#pv-reset', page), 'click', () => {
      kw.value = ''; self.kw = ''; self.cat = 'all'; self.status = ''; self.hasTitle = '';
      $$('#pv-cats .chip', page).forEach((c) => c.classList.toggle('on', c.dataset.f === 'all'));
      $('#pv-st', page).value = '';
      $('#pv-ti', page).value = '';
      self.renderList();
      self.fitAll();
    });
    on($('#pv-st', page), 'change', function () { self.status = this.value; self.renderList(); });
    on($('#pv-ti', page), 'change', function () { self.hasTitle = this.value; self.renderList(); });
    on($('#pv-stage', page), 'mouseleave', () => self.hideTip());
    on($('#pv-stage', page), 'mousemove', (e) => self.onStageMove(e));

    this.load()
      .then(() => this.initMap())
      .catch((e) => {
        if (e.message === 'NO_CONFIG') this.showKeySetup(e);
        else toast(e.message, 'err');
      });
  },

  /* ------------------------------ 数据 ------------------------------ */

  isMarked(a) { return Number.isFinite(a.lng) && Number.isFinite(a.lat); },

  async load() {
    const r = await API.getQ('/api/assets', Scope.params({ pageSize: 'all', sort: 'rowNo', order: 'asc' }));
    this.assets = r.rows;
    this.buildFilters();
    this.renderList();
    await this.loadImages();
  },

  /** 一次性拉齐图片索引（元数据，不含二进制），悬停浮卡据此渲染缩略图 */
  async loadImages() {
    this.imgMap = {};
    try {
      const ids = this.assets.filter((a) => this.isMarked(a)).map((a) => a.id);
      if (!ids.length) return;
      const r = await API.getQ('/api/images', { ids: ids.join(',') });
      this.imgMap = (r && r.map) || {};
    } catch (e) { /* 图片取不到不影响点位与列表 */ }
  },

  filtered() {
    const kw = this.kw.toLowerCase();
    return this.assets.filter((a) => {
      if (!this.isMarked(a)) return false;
      if (this.cat !== 'all' && (a.category || '未填写') !== this.cat) return false;
      if (this.status && (a.useStatus || '') !== this.status) return false;
      if (this.hasTitle && (a.hasTitle || '') !== this.hasTitle) return false;
      if (kw && ![a.name, a.location, a.useUnit, a.assetNo, a.unit].join(' ').toLowerCase().includes(kw)) return false;
      return true;
    });
  },

  buildFilters() {
    const marked = this.assets.filter((a) => this.isMarked(a));
    const box = $('#pv-cats', this.rootEl);
    if (box && !box.dataset.built) {
      const cats = [...new Set(marked.map((a) => a.category || '未填写'))];
      clear(box);
      const mk = (f, label) => {
        const c = h(`<span class="chip ${f === this.cat ? 'on' : ''}" data-f="${esc(f)}">${esc(label)}</span>`);
        on(c, 'click', () => {
          this.cat = f;
          $$('#pv-cats .chip', this.rootEl).forEach((x) => x.classList.remove('on'));
          c.classList.add('on');
          this.renderList();
        });
        box.appendChild(c);
      };
      mk('all', '全部');
      cats.forEach((c) => mk(c, c));
      box.dataset.built = '1';
    }

    const opts = ((Session.options || {}).fields || []);
    const fillSel = (id, key, state) => {
      const sel = $('#' + id, this.rootEl);
      if (!sel || sel.options.length) return;
      const f = opts.find((x) => x.key === key) || {};
      sel.appendChild(h('<option value="">' + (f.label || key) + '：全部</option>'));
      (f.options || []).forEach((o) => sel.appendChild(h(`<option value="${esc(o)}">${esc(o)}</option>`)));
      sel.value = state;
    };
    fillSel('pv-st', 'useStatus', this.status);
    fillSel('pv-ti', 'hasTitle', this.hasTitle);
  },

  renderList() {
    const box = $('#pv-lst', this.rootEl);
    if (!box) return;
    this._projKey = ''; // 过滤条件变化后投影缓存作废
    const list = this.filtered();

    clear(box);
    if (!list.length) {
      box.appendChild(h('<div class="empty" style="padding:24px">没有匹配的已标注资产</div>'));
    }
    list.forEach((a) => {
      const it = h(`<div class="it done ${this.hoverId === a.id ? 'on' : ''}" data-id="${a.id}">
        <div class="pin" style="color:${esc(colorOf(CAT_COLOR, a.category || '未填写', 0))}">◉</div>
        <div style="min-width:0;flex:1">
          <div class="nm ellip">${esc(a.name || '未命名资产')}</div>
          <div class="mt ellip">${esc(a.location || a.unit || '')}</div>
          <div class="mt" style="margin-top:3px">
            <span class="tag b">${esc(a.category || '-')}</span>
            <span class="tag n" style="margin-left:4px">${esc(a.useStatus || '-')}</span>
            <span class="tag n" style="margin-left:4px">${esc(fmt.area(a.area))} ㎡</span>
          </div>
        </div>
      </div>`);
      on(it, 'mouseenter', () => this.showTip(a, true));
      on(it, 'mouseleave', () => this.hideTip());
      on(it, 'click', () => this.focus(a.id));
      box.appendChild(it);
    });

    const st = $('#pv-stat', this.rootEl);
    if (st) {
      const all = this.assets.filter((a) => this.isMarked(a)).length;
      st.innerHTML = `显示 ${list.length} / 已标注 ${all} 条 ｜ 全部 ${this.assets.length} 条`;
    }

    const badge = $('#pv-badge', this.rootEl);
    if (badge) {
      if (list.length) {
        badge.style.display = '';
        const area = list.reduce((s, a) => s + (Number(a.area) || 0), 0);
        const val = list.reduce((s, a) => s + (Number(a.originalValue) || 0), 0);
        badge.innerHTML = `当前显示 <b>${list.length}</b> 处 ｜ 面积 ${esc(fmt.area(area))} ㎡ ｜ 原值 ${esc(fmt.money(val))}`;
      } else {
        badge.style.display = 'none';
      }
    }

    this.renderLegend(list);
    this.renderMask();
    // 列表与地图点位始终同源：筛选/搜索后同步重绘点位
    if (this.markers) {
      this.hoverId = null;
      this.hideTip();
      this.renderMarkers();
    }
  },

  renderLegend(list) {
    const box = $('#pv-legend', this.rootEl);
    if (!box) return;
    const cats = [...new Set(list.map((a) => a.category || '未填写'))];
    clear(box);
    cats.forEach((c, i) => {
      box.appendChild(h(`<div class="li"><span class="dot" style="background:${esc(colorOf(CAT_COLOR, c, i))}"></span>${esc(c)}</div>`));
    });
  },

  renderMask() {
    const mask = $('#pv-mask', this.rootEl);
    if (!mask) return;
    const marked = this.assets.filter((a) => this.isMarked(a)).length;
    if (marked) { mask.style.display = 'none'; return; }
    mask.style.display = '';
    clear(mask);
    mask.appendChild(h(`<div>
      <div class="ic">⌖</div>
      <div class="t">还没有已标注的点位</div>
      <div class="s">共 ${this.assets.length} 条房屋土地数据，均未完成地图标注。<br>可先按「坐落位置」自动解析坐标，或到地图标注页逐条打点。</div>
      <div class="a">
        ${Session.can('geo') ? '<button class="btn pri sm" id="pv-m-geo">一键地址解析</button>' : ''}
        <button class="btn sm" id="pv-m-go">前往地图标注</button>
      </div>
    </div>`));
    const g = $('#pv-m-geo', mask);
    if (g) on(g, 'click', () => pvBatchGeocode(this.assets, () => this.load()));
    const go2 = $('#pv-m-go', mask);
    if (go2) on(go2, 'click', () => { location.hash = '#/map'; });
  },

  /* ------------------------------ 地图 ------------------------------ */

  async initMap() {
    await Geo.sdk();
    const self = this;
    const el = document.getElementById('pv-map');
    if (!el) return;
    if (this.map) { this.renderMarkers(); return; }

    fixMapHeight(el); // WebView 高度链塌陷兜底，同地图标注页

    // 容器 id 交给适配层；默认视野取自系统设置
    this.map = Geo.createMap('pv-map', Geo.center());

    this.markers = Geo.markerLayer(this.map, {});
    // SDK 的 hover 需要鼠标在点内连续移动才触发，仅作为补充；
    // 主要的悬停判定由容器级命中检测完成（见 onStageMove）。
    Geo.layerOn(this.markers, 'hover', (evt) => {
      const id = evt && evt.geometry && evt.geometry.id;
      if (!id) return;
      const a = self.assets.find((x) => x.id === id);
      if (a) self.showTip(a, false);
    });
    Geo.layerOn(this.markers, 'click', (evt) => {
      const id = evt && evt.geometry && evt.geometry.id;
      const a = id && self.assets.find((x) => x.id === id);
      if (a) self.openDetail(a);
    });

    this.polygons = Geo.polygonLayer(this.map, {
      fillColor: 'rgba(33,89,214,0.16)', borderColor: '#2159d6', borderWidth: 2,
    });

    // 地图平移/缩放时浮动卡位置会失效，直接隐藏
    Geo.onMap(this.map, 'viewchange', () => self.hideTip());

    this.refresh(el);
  },

  /** 刷新地图：重绘点位，等容器布局完成后再校正尺寸与视野 */
  refresh(el) {
    this.renderMarkers();
    const box = el || document.getElementById('pv-map');
    whenMapSized(box, () => {
      if (!this.map) return;
      fixMapHeight(box);
      Geo.resize(this.map);
      this.fitAll();
    });
  },

  renderMarkers() {
    if (!this.markers) return;
    const list = this.filtered();

    const cats = [...new Set(list.map((a) => a.category || '未填写'))];
    const styles = {};
    cats.forEach((c, i) => {
      const color = colorOf(CAT_COLOR, c, i);
      styles['s' + i] = { src: markerIcon(color), width: 26, height: 34, anchorX: 13, anchorY: 34 };
      styles['a' + i] = { src: pvActiveIcon(color), width: 36, height: 48, anchorX: 18, anchorY: 48 };
    });

    const hid = this.hoverId;
    this.geoms = list.map((a) => {
      const i = cats.indexOf(a.category || '未填写');
      return {
        id: a.id,
        styleId: a.id === hid ? 'a' + i : 's' + i,
        position: { lat: a.lat, lng: a.lng },
        _base: 's' + i,
        _on: 'a' + i,
      };
    });

    const polys = list
      .filter((a) => Array.isArray(a.polygon) && a.polygon.length >= 3)
      .map((a) => ({ id: a.id, styleId: 'p', paths: a.polygon.map((p) => ({ lat: p.lat, lng: p.lng })) }));

    Geo.setStyles(this.markers, styles);
    // 注意：必须整体替换。腾讯 SDK 的 updateGeometries 是「合并更新」，
    // 不会移除已消失的点位；天地图适配层则按 id 增量维护，多余的会自动移除。
    Geo.setMarkers(this.markers, this.geoms);
    Geo.setPaths(this.polygons, polys);
    this._projKey = '';
  },

  /** 用样式切换实现悬停高亮（避免额外图层拦截点击） */
  applyHoverStyle(id) {
    if (!this.markers || !this.geoms) return;
    const gs = this.geoms.map((g) => Object.assign({}, g, { styleId: g.id === id ? g._on : g._base }));
    Geo.setMarkers(this.markers, gs);
  },

  fitAll() {
    if (!this.map) return;
    const list = this.filtered();
    if (!list.length) {
      const c = Geo.center();
      Geo.setCenter(this.map, c.lat, c.lng);
      Geo.setZoom(this.map, c.zoom);
      return;
    }
    if (list.length === 1) {
      Geo.panTo(this.map, list[0].lat, list[0].lng, 16);
      return;
    }
    Geo.fitBounds(this.map, list.map((a) => ({ lat: a.lat, lng: a.lng })));
  },

  /**
   * 点击点位打开详情：先立即收起简要信息浮卡，并在弹窗打开期间禁止浮卡再次弹出，
   * 关闭后恢复悬停预览（避免「简要信息」与「详细信息」重叠显示）。
   */
  openDetail(a) {
    this.detailOpen = true;
    this._mx = null;
    if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
    this.hideTip(true);
    AssetForm.view(a, () => {
      this.detailOpen = false;
      this._mx = null;
      if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
    });
  },

  focus(id) {
    const a = this.assets.find((x) => x.id === id);
    if (!a || !this.isMarked(a)) return;
    if (this.map) Geo.panTo(this.map, a.lat, a.lng, 16);
    this.showTip(a, true);
    $$('#pv-lst .it', this.rootEl).forEach((x) => x.classList.toggle('on', x.dataset.id === id));
  },

  /* ------------------------------ 悬停浮卡 ------------------------------ */

  /** 当前点位的容器像素坐标（按视图状态缓存，避免每帧重复投影） */
  projPoints() {
    const list = this.filtered();
    if (!this.map) return [];
    let key = '';
    try {
      const c = Geo.getCenter(this.map);
      key = [Geo.getZoom(this.map), c.lat.toFixed(6), c.lng.toFixed(6), list.length].join('|');
    } catch (e) { key = ''; }
    if (key && key === this._projKey && this._projPts) return this._projPts;

    const pts = [];
    for (let i = 0; i < list.length; i++) {
      const p = Geo.project(this.map, list[i].lat, list[i].lng);
      if (p && Number.isFinite(p.x)) pts.push({ a: list[i], x: p.x, y: p.y });
    }
    this._projKey = key;
    this._projPts = pts;
    return pts;
  },

  /** 容器像素命中检测：找出鼠标下的点位（图标 26×34，锚点在底部中心） */
  hitTest(px, py) {
    const pts = this.projPoints();
    let best = null, bestD = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const dx = px - pts[i].x;
      const dy = py - (pts[i].y - 17); // 图标中心
      if (Math.abs(dx) > 15 || Math.abs(dy) > 20) continue;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = pts[i].a; }
    }
    return best;
  },

  /** 鼠标移动：只记录最新位置，用 rAF 合并处理，保证停下的那一帧也会判定 */
  onStageMove(e) {
    const stage = $('#pv-stage', this.rootEl);
    if (!stage) return;
    const r = stage.getBoundingClientRect();
    this._mx = e.clientX - r.left;
    this._my = e.clientY - r.top;
    if (this._raf) return;
    const self = this;
    this._raf = requestAnimationFrame(() => {
      self._raf = null;
      self.resolveHover();
    });
  },

  resolveHover() {
    if (this._mx == null || this.detailOpen) return;
    const a = this.hitTest(this._mx, this._my);
    if (a) {
      if (this.hoverId !== a.id) this.showTip(a, false);
      else this.positionTip(a);
    } else if (this.hoverId) {
      this.hideTip();
    }
  },

  /** 与 a 落在同一屏幕位置（4px 内）的其他资产数量 */
  coLocated(a) {
    const pts = this.projPoints();
    const me = pts.find((p) => p.a.id === a.id);
    if (!me) return 0;
    return pts.filter((p) => p.a.id !== a.id && Math.abs(p.x - me.x) <= 4 && Math.abs(p.y - me.y) <= 4).length;
  },

  showTip(a, fromList) {
    if (this.detailOpen) return; // 详情弹窗打开时不显示简要信息
    const tip = $('#pv-tip', this.rootEl);
    if (!tip) return;
    clearTimeout(this.tipTimer);
    this.hoverId = a.id;

    const rows = PV_ROWS.map((r) => `<div class="kv"><span class="k">${esc(r.k)}</span><span class="v">${r.get(a)}</span></div>`).join('');
    const sub = [a.useUnit, a.location].filter(Boolean).map((s) => esc(fmt.cut(s, 26))).join(' · ');
    const extra = [];
    if (a.titleNo) extra.push('证号 ' + esc(a.titleNo));
    if (a.unit) extra.push(esc(fmt.cut(a.unit, 20)));
    extra.push('点击查看完整资料');

    // 共址提示：多条资产落在同一像素（同一楼栋多套房屋很常见）
    const near = this.coLocated(a);
    const nearTip = near ? `<div class="ft" style="border-top:none;padding-top:2px">该位置另有 <b>${near}</b> 处资产，可在左侧列表逐条查看</div>` : '';

    // 缩略图：取已上传图片（最多 3 张），按 正面 / 侧面 / 室内 的顺序展示
    const thumbs = Img.thumbRow(a.id, this.imgMap && this.imgMap[a.id]);

    tip.innerHTML = `<div class="tt">${esc(a.name || '未命名资产')}</div>`
      + (sub ? `<div class="ts">${sub}</div>` : '')
      + thumbs
      + rows
      + `<div class="ft">${extra.join(' · ')}</div>`
      + nearTip;
    tip.style.display = '';

    // 点位高亮（样式切换）
    this.applyHoverStyle(a.id);

    $$('#pv-lst .it', this.rootEl).forEach((x) => x.classList.toggle('on', x.dataset.id === a.id));

    this.positionTip(a, fromList);
    requestAnimationFrame(() => tip.classList.add('on'));
  },

  positionTip(a, forceInside) {
    const tip = $('#pv-tip', this.rootEl);
    const stage = $('#pv-stage', this.rootEl);
    if (!tip || !stage || !this.map) return;
    const p = Geo.project(this.map, a.lat, a.lng);
    if (!p || !Number.isFinite(p.x)) return;

    const W = stage.clientWidth;
    const H = stage.clientHeight;
    const w = tip.offsetWidth || 272;
    const h = tip.offsetHeight || 160;

    let left = p.x - w / 2;
    let top = p.y - 34 - h - 10;
    let below = false;
    if (top < 8) { top = p.y + 12; below = true; }
    left = Math.max(8, Math.min(left, W - w - 8));
    top = Math.max(8, Math.min(top, H - h - 8));

    tip.classList.toggle('below', below);
    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
    // 小箭头对准点位（考虑左右夹紧后的偏移）
    const ax = Math.max(12, Math.min(p.x - left, w - 12));
    tip.style.setProperty('--ax', Math.round(ax) + 'px');
    if (forceInside) tip.classList.add('on');
  },

  /** immediate=true 时立即隐藏（打开详情弹窗用），否则保留 200ms 淡出 */
  hideTip(immediate) {
    const tip = $('#pv-tip', this.rootEl);
    if (!tip) return;
    clearTimeout(this.tipTimer);
    this.hoverId = null;
    tip.classList.remove('on');
    this.applyHoverStyle(null);
    $$('#pv-lst .it', this.rootEl).forEach((x) => x.classList.remove('on'));
    if (immediate) { tip.style.display = 'none'; return; }
    this.tipTimer = setTimeout(() => { if (!tip.classList.contains('on')) tip.style.display = 'none'; }, 200);
  },

  /* ------------------------------ 地图未配置时的引导 ------------------------------ */

  showKeySetup(e) {
    const box = $('#pv-keybox', this.rootEl);
    geoNotReady((e && e.msg) || '地图服务未配置');
    if (!box) return;
    box.style.display = '';
    box.innerHTML = `
      <div style="max-width:360px;font-size:12px;line-height:1.8">
        <div style="font-weight:600;font-size:12.5px;margin-bottom:4px">地图服务未配置</div>
        ${esc((e && e.msg) || '请在「系统设置 → 地图服务」中选择服务商并填写密钥。')}
        ${Session.isSysAdmin() ? '<div style="margin-top:8px"><button class="btn pri sm" id="pv-tk-go">前往系统设置</button></div>' : '<div style="margin-top:6px">请联系系统管理员配置。</div>'}
      </div>`;
    const go = $('#pv-tk-go', box);
    if (go) on(go, 'click', () => { location.hash = '#/settings'; });
  },
};

'use strict';
/* ============================================================
 *  settings —— 系统设置（地图服务商与密钥、默认视野）
 *  仅系统管理员可见。服务商清单与「如何注册获取 Key」的指引由后端
 *  /api/settings/map 下发（server/lib/mapconfig.js），新增服务商无需改前端。
 * ============================================================ */

Pages.settings = {
  title: '系统设置',
    render(root) {
      clear(root);
      if (!Session.isSysAdmin()) {
        root.appendChild(h('<div class="empty"><div class="ic">⛔</div><div>仅系统管理员可访问系统设置</div></div>'));
        return;
      }
      const self = this;
      const wrap = h('<div class="set-wrap"></div>');
      root.appendChild(wrap);

    let data = null;          // /api/settings/map 返回
    let cur = null;           // 当前编辑中的配置
    let dirty = false;
    let rep = null;           // /api/settings/report 返回
    let repDirty = false;

    /* ---------------- 载入 ---------------- */

    async function load() {
      wrap.innerHTML = '<div class="empty">加载中…</div>';
      try {
        data = await API.get('/api/settings/map');
        cur = JSON.parse(JSON.stringify(data.map));
        dirty = false;
        rep = await API.get('/api/settings/report').catch(() => null);
        repDirty = false;
        render();
      } catch (e) {
        wrap.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    function providerOf(key) {
      return (data.providers || []).find((p) => p.key === key) || (data.providers || [])[0] || {};
    }

    /* ---------------- 渲染 ---------------- */

    function render() {
      clear(wrap);
      wrap.appendChild(statusCard());
      wrap.appendChild(pickerCard());
      wrap.appendChild(keyCard());
      wrap.appendChild(viewCard());
      (data.providers || []).forEach((p) => wrap.appendChild(guideCard(p)));
      if (rep) wrap.appendChild(reportCard());
      wrap.appendChild(footerBar());
    }

    /** 顶部：当前生效状态 */
    function statusCard() {
      const p = providerOf(cur.provider);
      const hasKey = !!String((cur.keys || {})[cur.provider] || '').trim();
      return h(`<div class="card">
        <div class="card-h"><h3>地图服务</h3><div class="spacer"></div>
          <span class="tag ${hasKey ? 'g' : 'n'}">${hasKey ? '密钥已配置' : '未配置密钥'}</span>
        </div>
        <div class="card-b">
          <div class="set-note">
            当前生效：<b>${esc(p.name || cur.provider)}</b>（${esc(p.sdk || '')}）·
            坐标系 <b>${esc(p.coord || '-')}</b> ·
            默认视野 <span class="mono">${cur.center.lat}, ${cur.center.lng}</span>（缩放 ${cur.center.zoom}）
          </div>
          <div class="muted" style="font-size:11.5px;line-height:1.8;margin-top:6px">
            切换服务商或密钥后，<b>重新进入「地图标注 / 房产预览」</b>即可生效；
            系统内坐标统一按 GCJ-02 存储，使用天地图时会自动换算为 CGCS2000，点位不会整体偏移。
          </div>
        </div>
      </div>`);
    }

    /** 服务商选择 */
    function pickerCard() {
      const card = h(`<div class="card">
        <div class="card-h"><h3>选择地图服务商</h3></div>
        <div class="card-b"><div class="set-grid" id="st-grid"></div></div>
      </div>`);
      const grid = $('#st-grid', card);
      (data.providers || []).forEach((p) => {
        // 注意：变量名不要用 on —— 会遮蔽全局的事件绑定函数
        const active = p.key === cur.provider;
        const hasKey = !!String((cur.keys || {})[p.key] || '').trim();
        const it = h(`<div class="set-prov ${active ? 'on' : ''}" data-p="${esc(p.key)}">
          <div class="hd"><span class="nm">${esc(p.name)}</span>${active ? '<span class="tag b">生效中</span>' : ''}${hasKey ? '<span class="tag g">已填密钥</span>' : '<span class="tag n">未填</span>'}</div>
          <div class="sub">${esc(p.sdk || '')}</div>
          <div class="sub">坐标系：${esc(p.coord || '-')}</div>
          <div class="sub">需要：${esc((p.needServices || []).join('、'))}</div>
        </div>`);
        on(it, 'click', () => { if (cur.provider !== p.key) { cur.provider = p.key; dirty = true; render(); } });
        grid.appendChild(it);
      });
      return card;
    }

    /** 密钥配置 + 连通性测试 */
    function keyCard() {
      const p = providerOf(cur.provider);
      const key = String((cur.keys || {})[cur.provider] || '');
      const card = h(`<div class="card">
        <div class="card-h"><h3>密钥配置 · ${esc(p.name || '')}</h3></div>
        <div class="card-b">
          <div class="field">
            <label>${esc(p.keyLabel || '密钥')}</label>
            <input class="inp mono" id="st-key" placeholder="${esc(p.keyPlaceholder || '')}" value="${esc(key)}" spellcheck="false">
            <div class="muted" style="font-size:11.5px;margin-top:6px">
              ${p.needKey !== false ? '该服务商必须填写密钥才能加载地图。' : '留空时：内置预览环境会自动使用免密钥代理；正式部署建议填写自己的 Key。'}
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
            <button class="btn sm" id="st-test">测试连接</button>
            <a class="btn sm" id="st-console" href="${esc(p.consoleUrl || '#')}" target="_blank" rel="noreferrer">打开控制台申请密钥</a>
            <a class="btn sm" id="st-doc" href="${esc(p.docUrl || '#')}" target="_blank" rel="noreferrer">开发文档</a>
            <span class="muted" id="st-test-r" style="font-size:11.5px"></span>
          </div>
        </div>
      </div>`);

      on($('#st-key', card), 'input', function () {
        cur.keys[cur.provider] = this.value.trim();
        dirty = true;
        $('#st-test-r', card).textContent = '';
        if (self._sync) self._sync();
      });

      on($('#st-test', card), 'click', async () => {
        const box = $('#st-test-r', card);
        box.textContent = '正在测试…';
        try {
          const v = String(cur.keys[cur.provider] || '').trim();
          if (!v) {
            // 未填时测「已保存的」那一份，帮助确认服务端是否已配好
            const r = await API.post('/api/settings/map/test', { provider: cur.provider });
            box.innerHTML = `<span style="color:${r.ok ? 'var(--ok)' : 'var(--warn)'}">${esc(r.msg)}</span>`;
            return;
          }
          const r = await API.post('/api/settings/map/test', { provider: cur.provider, key: v });
          box.innerHTML = `<span style="color:${r.ok ? 'var(--ok)' : 'var(--danger)'}">${esc(r.msg)}</span>`;
        } catch (e) {
          box.innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
        }
      });
      return card;
    }

    /** 默认视野 */
    function viewCard() {
      const d = data.defaultCenter || { lat: 29.5889, lng: 106.5515, zoom: 12 };
      const card = h(`<div class="card">
        <div class="card-h"><h3>默认视野</h3><div class="spacer"></div>
          <button class="btn sm" id="st-view-reset">恢复默认</button>
        </div>
        <div class="card-b">
          <div class="set-row">
            <div class="field" style="flex:1"><label>中心纬度</label><input class="inp mono" id="st-lat" value="${cur.center.lat}"></div>
            <div class="field" style="flex:1"><label>中心经度</label><input class="inp mono" id="st-lng" value="${cur.center.lng}"></div>
            <div class="field" style="flex:1"><label>缩放级别</label><input class="inp mono" id="st-zoom" value="${cur.center.zoom}"></div>
          </div>
          <div class="muted" style="font-size:11.5px;margin-top:6px">
            打开地图且没有已标注点位时，会定位到这里。默认：重庆市江北区（${d.lat}, ${d.lng}，缩放 ${d.zoom}）。
          </div>
        </div>
      </div>`);
      const bind = (id, k, isInt) => on($('#' + id, card), 'change', function () {
        const n = Number(this.value);
        if (!Number.isFinite(n)) { this.value = cur.center[k]; return; }
        cur.center[k] = isInt ? Math.round(n) : n;
        dirty = true;
        if (self._sync) self._sync();
      });
      bind('st-lat', 'lat', false);
      bind('st-lng', 'lng', false);
      bind('st-zoom', 'zoom', true);
      on($('#st-view-reset', card), 'click', () => {
        cur.center = Object.assign({}, data.defaultCenter || { lat: 29.5889, lng: 106.5515, zoom: 12 });
        dirty = true;
        render();
        toast('已恢复默认视野（记得点「保存」）', 'ok');
      });
      return card;
    }

    /** 分析报告参数（台账中没有的口径数据，留空时报告自动推算） */
    function reportCard() {
      const card = h(`<div class="card">
        <div class="card-h"><h3>分析报告参数</h3><div class="spacer"></div>
          <span class="muted" style="font-size:11.5px">留空时由报告引擎自动推算</span>
        </div>
        <div class="card-b">
          <div class="set-note">
            报告里的「编制干部职工人数 / 现有干部职工人数 / 内设科室数 / 税务所数」在资产台账中并不存在，
            需按人事口径维护；<b>留空</b>时报告会按各自的兜底规则自动推算（见首页「分析报告 → 替代规则」）。
          </div>
          <div class="set-row" style="flex-wrap:wrap;gap:10px 14px;margin-top:10px" id="rp-row"></div>
        </div>
      </div>`);
      const row = $('#rp-row', card);
      (rep.params || []).forEach((p) => {
        const v = rep.values[p.key];
        const f = h(`<div class="field" style="min-width:200px;flex:1">
          <label>${esc(p.label)}${p.unit ? '（' + esc(p.unit) + '）' : ''}</label>
          <input class="inp mono" data-rp="${esc(p.key)}" value="${v === '' || v === undefined || v === null ? '' : esc(String(v))}"
            placeholder="留空自动推算" ${p.key === 'asOf' ? '' : 'inputmode="numeric"'}>
          <div class="muted" style="font-size:11px;line-height:1.7;margin-top:5px">
            ${esc(p.hint || '')}<br>兜底：${esc(p.fallback || '')}
          </div>
        </div>`);
        // 用 input 而非 change：自动填充/粘贴只触发 input，change 要等失焦且不一定触发
        on($('[data-rp]', f), 'input', function () {
          rep.values[p.key] = this.value.trim();
          repDirty = true;
          if (self._sync) self._sync();
        });
        row.appendChild(f);
      });
      return card;
    }

    /** 注册获取 Key 的详细指引 */
    function guideCard(p) {
      const expanded = p.key === cur.provider;
      const steps = (p.steps || []).map((s, i) => `
        <div class="set-step">
          <div class="n">${i + 1}</div>
          <div class="b">
            <div class="t">${esc(s.t)}</div>
            <div class="d">${esc(s.d)}</div>
            ${s.url ? `<a class="lnk" href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.url)}</a>` : ''}
          </div>
        </div>`).join('');
      const notes = (p.notes || []).map((n) => `<li>${esc(n)}</li>`).join('');
      const card = h(`<div class="card">
        <div class="card-h">
          <h3>如何获取 ${esc(p.name)} 的密钥</h3>
          <div class="spacer"></div>
          <button class="btn sm" data-tg="${esc(p.key)}">${expanded ? '收起' : '展开'}</button>
        </div>
        <div class="card-b" id="gd-${esc(p.key)}" style="${expanded ? '' : 'display:none'}">
          <div class="set-note">以下步骤在天地图 / 腾讯位置服务官网完成，申请到的密钥粘贴到上方「密钥配置」里即可。</div>
          <div class="set-steps">${steps}</div>
          ${notes ? `<div class="set-note warn" style="margin-top:10px"><b>注意事项</b><ul style="margin:6px 0 0 18px;padding:0">${notes}</ul></div>` : ''}
        </div>
      </div>`);
      on($('[data-tg]', card), 'click', function () {
        const box = $('#gd-' + p.key, card);
        const shown = box.style.display !== 'none';
        box.style.display = shown ? 'none' : '';
        this.textContent = shown ? '展开' : '收起';
      });
      return card;
    }

    /** 底部保存栏 */
    function footerBar() {
      const bar = h(`<div class="set-foot">
        <span class="muted" id="st-hint" style="font-size:11.5px"></span>
        <div class="spacer"></div>
        <button class="btn sm" id="st-reload">放弃修改</button>
        <button class="btn pri sm" id="st-save">保存设置</button>
      </div>`);
      const hint = $('#st-hint', bar);
      const sync = () => {
        const d2 = dirty || repDirty;
        hint.innerHTML = d2 ? '<span style="color:var(--warn)">有未保存的修改</span>' : '已是最新';
      };
      self._sync = sync;
      sync();
      on($('#st-save', bar), 'click', async () => {
        try {
          const r = await API.put('/api/settings/map', { provider: cur.provider, keys: cur.keys, center: cur.center });
          cur = JSON.parse(JSON.stringify(r.map));
          data.map = r.map;
          dirty = false;
          await Geo.config(true); // 让地图页立即拿到新配置
          if (rep && repDirty) {
            const patch = {};
            (rep.params || []).forEach((p) => { patch[p.key] = rep.values[p.key]; });
            const r2 = await API.put('/api/settings/report', patch);
            rep.values = r2.values;
            repDirty = false;
          }
          toast('已保存，重新进入地图页面即可生效', 'ok');
          render();
        } catch (e) { toast(e.message, 'err'); }
      });
      on($('#st-reload', bar), 'click', () => { self.render(root); });
      return bar;
    }

    load();
  },
};

/* ===== 12-images.js ===== */
'use strict';
/* ============================================================
 *  Img —— 房产图片：上传 / 删除 / 改标签 / 缩略图 / 大图查看
 *  规则：每条资产最多 MAX_COUNT 张，单张 ≤ MAX_SIZE（前端预检 + 后端把关）
 * ============================================================ */

const Img = {
  MAX_COUNT: 3,
  MAX_SIZE: 2 * 1024 * 1024,
  LABELS: ['正面', '侧面', '室内', '其他'],
  ACCEPT: '.jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp',

  /** 图片直链：<img src> 无法带 Authorization 头，用短期令牌走查询串 */
  url(assetId, imageId) {
    return `${API.base}/api/assets/${encodeURIComponent(assetId)}/images/${encodeURIComponent(imageId)}/raw?token=${encodeURIComponent(Session.token || '')}`;
  },

  sizeText(n) { return n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(2) + ' MB' : Math.round(n / 1024) + ' KB'; },

  /**
   * 读取本地文件 → 必要时压缩 → 上传。
   * 原图 ≤ 2MB 时原样直传（不重编码，保留画质）；超出才按长边 1920 压到 JPEG，
   * 压完仍超 2MB 直接拒绝。
   */
  async upload(assetId, file, label) {
    const name = file.name || '图片';
    const okType = /^image\/(jpeg|png|gif|webp)$/i.test(file.type || '') || /\.(jpe?g|png|gif|webp)$/i.test(name);
    if (!okType) throw new Error('仅支持 JPG / PNG / GIF / WebP 格式的图片');
    if (file.size > this.MAX_SIZE * 4) throw new Error(`「${name}」过大（${this.sizeText(file.size)}），请先压缩后再上传`);

    let blob = file;
    let dim = { w: 0, h: 0 };
    if (file.size > this.MAX_SIZE) {
      const packed = await Img.downscale(file, 1920, 0.85);
      blob = packed.blob;
      dim = { w: packed.w, h: packed.h };
      if (blob.size > this.MAX_SIZE) throw new Error(`「${name}」压缩后仍有 ${this.sizeText(blob.size)}，超过单张 2MB 上限`);
    }
    const data = await Img.readDataURL(blob);
    return API.post('/api/assets/' + assetId + '/images', {
      name, label: label || '其他', data,
      w: dim.w || undefined, h: dim.h || undefined,
    });
  },

  readDataURL(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('读取本地文件失败'));
      fr.readAsDataURL(blob);
    });
  },

  /** canvas 降采样（零依赖方案）：返回新的 Blob 与尺寸 */
  downscale(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        try {
          const w0 = image.naturalWidth || 0, h0 = image.naturalHeight || 0;
          const scale = Math.min(1, maxSide / Math.max(w0, h0 || 1));
          const w = Math.max(1, Math.round(w0 * scale));
          const h = Math.max(1, Math.round(h0 * scale));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(image, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const done = (b) => b ? resolve({ blob: b, w, h }) : reject(new Error('图片压缩失败'));
          if (cv.toBlob) cv.toBlob(done, 'image/jpeg', quality);
          else done(Img.dataUrlToBlob(cv.toDataURL('image/jpeg', quality)));
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法解析该图片文件')); };
      image.src = url;
    });
  },

  dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl).split(',');
    const bin = atob(parts[1] || '');
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: 'image/jpeg' });
  },

  /* ---------------------- 编辑界面的图片区 ---------------------- */

  /**
   * 渲染编辑用图片墙。
   * @param {HTMLElement} box 容器
   * @param {string} assetId 资产 id（为空表示尚未保存）
   * @param {Array}  images 已上传图片
   * @param {Function} onChange 变化后回调（拿到最新列表）
   */
  gallery(box, assetId, images, onChange, opts) {
    const ro = !!(opts && opts.readonly);
    clear(box);
    const list = (images || []).slice(0, Img.MAX_COUNT);
    const canEdit = !!assetId && Session.can('write') && !ro;

    const head = h(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div style="font-weight:600;font-size:12.5px">房产图片</div>
      <span class="muted" style="font-size:11.5px">最多 ${Img.MAX_COUNT} 张，单张 ≤ 2MB（正面 / 侧面 / 室内）</span>
      <div class="spacer"></div>
      <span class="muted" style="font-size:11.5px">${list.length} / ${Img.MAX_COUNT}</span>
    </div>`);
    box.appendChild(head);

    const grid = h('<div class="img-grid"></div>');
    box.appendChild(grid);

    if (!assetId) {
      grid.appendChild(h('<div class="img-add disabled">请先保存资产后再上传图片</div>'));
      return;
    }

    if (!list.length) {
      // 只读模式且无图片：给出明确说明，避免出现「空白区域」的错觉
      grid.appendChild(h(`<div class="img-add disabled">${ro ? '暂无图片' : '暂未上传图片'}</div>`));
      if (!canEdit) return;
    }

    const file = h(`<input type="file" accept="${Img.ACCEPT}" style="display:none">`);
    file.multiple = false;
    box.appendChild(file);

    const pickThenUpload = () => {
      if (list.length >= Img.MAX_COUNT) { toast(`最多只能上传 ${Img.MAX_COUNT} 张图片`, 'err'); return; }
      file.click();
    };
    on(file, 'change', async () => {
      const f = file.files && file.files[0];
      file.value = '';
      if (!f) return;
      // 默认标签按顺序补位：正面 → 侧面 → 室内 → 其他
      const used = list.map((x) => x.label);
      const label = Img.LABELS.find((l) => used.indexOf(l) < 0) || '其他';
      try {
        const r = await Img.upload(assetId, f, label);
        toast('图片已上传', 'ok');
        onChange && onChange(r.images || []);
      } catch (e) { toast(e.message, 'err'); }
    });

    const addSlot = () => {
      const add = h('<div class="img-add" title="点击上传图片（≤2MB）">＋ 上传图片</div>');
      on(add, 'click', pickThenUpload);
      grid.appendChild(add);
      return add;
    };

    if (!list.length) {
      // 一张都没有时就给一个可用的上传格子，不再额外放「暂未上传图片」占位（避免两个格子）
      if (canEdit) addSlot();
      else grid.appendChild(h('<div class="img-add disabled">暂无图片</div>'));
      return;
    }

    list.forEach((img) => {
      const cell = h(`<div class="img-cell">
        <div class="img-thumb"><img src="${Img.url(assetId, img.id)}" alt="${esc(img.label || '图片')}"></div>
        <select class="sel sm img-label">${Img.LABELS.map((l) => `<option value="${esc(l)}" ${img.label === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
        <div class="img-meta" title="${esc(img.name || '')}">${esc(fmt.cut(img.name || '图片', 14))} · ${Img.sizeText(img.size)}</div>
        <div class="img-ops">
          <button class="btn sm img-view">查看</button>
          ${canEdit ? '<button class="btn sm danger img-del">删除</button>' : ''}
        </div>
      </div>`);
      on($('.img-thumb img', cell), 'click', () => Img.lightbox(assetId, list, img.id));
      on($('.img-view', cell), 'click', () => Img.lightbox(assetId, list, img.id));
      if (canEdit) {
        on($('.img-del', cell), 'click', async () => {
          confirmDlg(`确定删除这张「${esc(img.label || '图片')}」吗？`).then(async (yes) => {
            if (!yes) return;
            try {
              await API.del('/api/assets/' + assetId + '/images/' + img.id);
              toast('图片已删除', 'ok');
              onChange && onChange((await API.get('/api/assets/' + assetId + '/images')).images || []);
            } catch (e) { toast(e.message, 'err'); }
          });
        });
        on($('.img-label', cell), 'change', async () => {
          const v = $('.img-label', cell).value;
          try {
            await API.put('/api/assets/' + assetId + '/images/' + img.id, { label: v });
            toast('已更新图片标签', 'ok');
          } catch (e) { toast(e.message, 'err'); onChange && onChange(list); }
        });
      } else {
        $('.img-label', cell).disabled = true;
      }
      grid.appendChild(cell);
    });

    if (list.length < Img.MAX_COUNT && canEdit) addSlot();
  },

  /* ---------------------- 只读查看 / 悬停缩略图 ---------------------- */

  /** 浮卡里的缩略图条 */
  thumbRow(assetId, images) {
    const list = (images || []).slice(0, Img.MAX_COUNT);
    if (!list.length) return '';
    const picks = list.length === 1
      ? list
      : (Img.LABELS.map((l) => list.find((x) => x.label === l)).filter(Boolean).concat(list.filter((x) => Img.LABELS.indexOf(x.label) < 0))).slice(0, 3);
    // 浮卡是悬停才渲染的，这里不能用 loading=lazy，否则第一帧会是空白
    return `<div class="pv-imgs">${picks.map((im) => `<span class="pv-img"><img src="${Img.url(assetId, im.id)}" alt="${esc(im.label || '图片')}"><b>${esc(im.label || '图片')}</b></span>`).join('')}</div>`;
  },

  /** 大图查看（左右翻页） */
  lightbox(assetId, images, startId) {
    const list = (images || []).slice(0, Img.MAX_COUNT);
    let i = Math.max(0, list.findIndex((x) => x.id === startId));
    const stage = h('<div class="lb-stage"><img alt="房产图片"></div>');
    const cap = h('<div class="lb-cap"></div>');
    const body = h('<div></div>');
    body.appendChild(stage);
    body.appendChild(cap);

    const paint = () => {
      const im = list[i];
      if (!im) return;
      $('img', stage).src = Img.url(assetId, im.id);
      cap.innerHTML = `<span class="tag n">${esc(im.label || '图片')}</span>
        <span class="muted" style="margin-left:8px">${esc(im.name || '')}</span>
        <span class="muted" style="margin-left:8px">${Img.sizeText(im.size)}${im.w && im.h ? ` · ${im.w}×${im.h}` : ''}</span>
        <span class="muted" style="margin-left:8px">${i + 1} / ${list.length}</span>`;
    };
    paint();
    const buttons = [{ text: '关闭' }];
    if (list.length > 1) {
      buttons.unshift({ text: '上一张', onClick: () => { i = (i - 1 + list.length) % list.length; paint(); } });
      buttons.unshift({ text: '下一张', cls: 'pri', onClick: () => { i = (i + 1) % list.length; paint(); } });
    }
    const dlg = modal({ title: '房产图片', size: 'wide', bodyNode: body, buttons });
    return dlg;
  },
};

/* ===== 13-report.js ===== */
'use strict';
/* ============================================================
 *  report —— 土地房屋资产统计分析报告（首页）
 *
 *  报告正文由后端 /api/report 按 server/assets/report-template.md 自动汇总生成，
 *  模板里的每个填空（`____`）都已规范化为具名占位符 {{令牌}}。
 *  本页除正文外，还列出「占位符 → 本次取值 → 替代规则」对照表，方便核对口径。
 * ============================================================ */

Pages.report = {
  title: '分析报告',

  render(root) {
    clear(root);
    const self = this;
    let data = null;
    let ruleOpen = false;

    const wrap = h('<div class="rp-wrap"></div>');
    root.appendChild(wrap);

    async function load() {
      wrap.innerHTML = '<div class="empty">正在汇总生成分析报告…</div>';
      try {
        data = await API.getQ('/api/report', Scope.params());
      } catch (e) {
        wrap.innerHTML = `<div class="empty"><div class="ic">⚠</div><div>${esc(e.message)}</div></div>`;
        return;
      }
      draw();
    }

    /* ---------------- 工具条 ---------------- */

    function toolbar() {
      const bar = h(`<div class="rp-bar">
        <div class="rp-meta" id="rp-meta"></div>
        <div class="spacer"></div>
        <button class="btn sm" id="rp-rule">≡ 替代规则</button>
        <button class="btn sm" id="rp-copy">⧉ 复制全文</button>
        <button class="btn sm" id="rp-md">⇩ 下载 Markdown</button>
        <button class="btn sm" id="rp-print">⎙ 打印 / 存为 PDF</button>
        <button class="btn sm" id="rp-refresh">↻ 刷新</button>
      </div>`);

      const meta = $('#rp-meta', bar);
      const m = data.meta || {};
      meta.innerHTML = [
        `<span class="rp-chip">统计范围：<b>${esc(Scope.label())}</b></span>`,
        `<span class="rp-chip">资产 <b>${fmt.n(m.total)}</b> 处</span>`,
        `<span class="rp-chip">总面积 <b>${fmt.area(m.totalArea)}</b> ㎡</span>`,
        `<span class="rp-chip">自有 <b>${fmt.n(m.own)}</b> · 借入 <b>${fmt.n(m.borrow)}</b> · 租入 <b>${fmt.n(m.rentIn)}</b></span>`,
        `<span class="rp-chip">截止 <b>${esc(m.asOf || '')}</b></span>`,
      ].join('');

      on($('#rp-refresh', bar), 'click', () => load());
      on($('#rp-rule', bar), 'click', () => { ruleOpen = !ruleOpen; draw(); });
      on($('#rp-print', bar), 'click', () => window.print());
      on($('#rp-md', bar), 'click', () => {
        const name = `土地房屋资产统计分析报告-${(data.meta && data.meta.scopeLabel) || '全部单位'}-${(data.meta && data.meta.asOf) || ''}.md`;
        downloadText(name, data.markdown, 'text/markdown;charset=utf-8');
      });
      on($('#rp-copy', bar), 'click', () => {
        const txt = data.markdown;
        const done = () => toast('报告全文已复制到剪贴板', 'ok');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
        } else fallbackCopy(txt, done);
      });
      return bar;
    }

    function fallbackCopy(txt, done) {
      const ta = h('<textarea style="position:fixed;left:-9999px;top:0"></textarea>');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请改用「下载 Markdown」', 'err'); }
      document.body.removeChild(ta);
    }

    /** 纯前端下载：Blob + a[download] */
    function downloadText(name, text, mime) {
      const blob = new Blob(['\ufeff' + text], { type: mime || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = h('<a style="display:none"></a>');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 500);
    }

    /* ---------------- 规则对照表 ---------------- */

    function ruleTable() {
      const box = h(`<div class="card" style="margin-top:12px">
        <div class="card-h">
          <h3>占位符替代规则（共 ${(data.values || []).length} 项）</h3>
          <div class="spacer"></div>
          <span class="muted" style="font-size:11.5px">模板中的 <code>____</code> → 具名占位符 <code>{{令牌}}</code> → 自动汇总值</span>
        </div>
        <div class="card-b" style="padding:0">
          <div style="overflow:auto;max-height:520px">
            <table class="tbl fixed" style="width:820px">
              <colgroup>
                <col style="width:80px"><col style="width:150px"><col style="width:150px"><col style="width:440px">
              </colgroup>
              <thead>
                <tr><th>占位符</th><th>含义</th><th>本次取值</th><th>替代规则</th></tr>
              </thead>
              <tbody id="rp-rule-body"></tbody>
            </table>
          </div>
        </div>
      </div>`);
      const tb = $('#rp-rule-body', box);
      (data.values || []).forEach((v) => {
        const tr = h(`<tr>
          <td><code>${esc(v.token)}</code></td>
          <td>${esc(v.label || '')}</td>
          <td><b>${esc(v.value)}</b></td>
          <td class="rp-rule">${esc(v.rule || '')}</td>
        </tr>`);
        tb.appendChild(tr);
      });
      return box;
    }

    /* ---------------- 渲染 ---------------- */

    function draw() {
      clear(wrap);
      wrap.appendChild(toolbar());

      if (!data.total && !(data.meta && data.meta.total)) {
        // 空数据也给正文，避免整页空白
      }

      const body = h('<div class="card rp-doc"><div class="card-b" id="rp-body"></div></div>');
      $('#rp-body', body).innerHTML = data.html;
      wrap.appendChild(body);

      if (ruleOpen) wrap.appendChild(ruleTable());

      if (data.missing && data.missing.length) {
        wrap.appendChild(h(`<div class="set-note warn" style="margin-top:10px">
          以下占位符未匹配到汇总规则，已显示为「—」：${esc(data.missing.join('、'))}
        </div>`));
      }
    }

    load();
  },

  leave() { /* 报告页无外部资源需释放 */ },
};

</script>
</body>
</html>
