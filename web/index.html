<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房屋土地信息系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232159d6'/%3E%3Cpath d='M8 15 16 8l8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H9a1 1 0 0 1-1-1z' fill='white'/%3E%3C/svg%3E">
<style>

/* ===== styles.css ===== */
:root {
  --bg: #f4f6fa;
  --panel: #ffffff;
  --panel-2: #fafbfd;
  --line: #e6e9f0;
  --line-2: #eef1f6;
  --text: #1c2434;
  --text-2: #5b6478;
  --text-3: #8b93a7;
  --brand: #2159d6;
  --brand-d: #17429f;
  --brand-l: #eaf0ff;
  --ok: #12a670;
  --ok-l: #e6f7f0;
  --warn: #d98700;
  --warn-l: #fdf3e2;
  --danger: #d92d20;
  --danger-l: #fdedec;
  --info: #0b8ec9;
  --info-l: #e6f4fb;
  --shadow: 0 1px 2px rgba(20, 30, 60, .05), 0 4px 16px rgba(20, 30, 60, .05);
  --shadow-lg: 0 8px 40px rgba(15, 25, 50, .16);
  --r: 8px;
  --sidebar: 208px;
  --topbar: 56px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }

/* ---------------- 布局 ---------------- */
#app { height: 100%; }

.layout { display: flex; height: 100%; }

.sidebar {
  width: var(--sidebar);
  flex: 0 0 var(--sidebar);
  background: #101a30;
  color: #c7d0e4;
  display: flex;
  flex-direction: column;
}

.sidebar .brand {
  height: var(--topbar);
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 16px;
  border-bottom: 1px solid rgba(255, 255, 255, .07);
}
.sidebar .brand .logo {
  width: 26px; height: 26px; border-radius: 6px;
  background: linear-gradient(135deg, #3b7bff, #2159d6);
  display: grid; place-items: center;
  color: #fff; font-size: 14px; font-weight: 700;
}
.sidebar .brand .t { font-size: 13.5px; font-weight: 600; color: #fff; line-height: 1.15; }
.sidebar .brand .s { font-size: 10.5px; color: #7f8db0; }

/* ---------------- 侧栏单位树 ---------------- */
.utree { padding: 8px 8px 4px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
.utree .ut-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 10px 6px; font-size: 10.5px; color: #64708d; letter-spacing: .5px;
}
.utree .ut-body { max-height: 38vh; overflow-y: auto; }
.utree .ut-node {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 6px; cursor: pointer;
  color: #b9c3da; font-size: 12.5px; user-select: none;
}
.utree .ut-node:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.utree .ut-node.on { background: var(--brand); color: #fff; }
.utree .ut-node.kid { padding-left: 18px; font-size: 12px; }
.utree .ut-arw { width: 12px; text-align: center; color: #7f8db0; font-size: 10px; }
.utree .ut-arw:hover { color: #fff; }
.utree .ut-arw.blank { color: #4d5875; }
.utree .ut-ic { font-size: 11px; width: 12px; text-align: center; }
.utree .ut-ic.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin: 0 2px; }
.utree .ut-nm { flex: 1; min-width: 0; }
.utree .ut-ct {
  background: rgba(255, 255, 255, .14); border-radius: 8px;
  padding: 0 6px; font-size: 10.5px; line-height: 16px; font-variant-numeric: tabular-nums;
}
.utree .ut-node.on .ut-ct { background: rgba(255, 255, 255, .25); }
/* 下级单位对本单位管理员为只读，节点上给出轻量标记 */
.utree .ut-ro {
  font-size: 9.5px; line-height: 14px; padding: 0 4px; border-radius: 3px;
  background: rgba(255, 255, 255, .10); color: #93a0bd; flex: none;
}
.utree .ut-node.on .ut-ro { background: rgba(255, 255, 255, .22); color: #fff; }
.utree .ut-empty { padding: 6px 10px 8px; font-size: 11.5px; color: #5d6885; }

.nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
.nav-group { font-size: 10.5px; color: #64708d; padding: 12px 10px 6px; letter-spacing: .5px; }
.nav a {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; margin-bottom: 2px;
  border-radius: 6px; color: #b9c3da; cursor: pointer;
  font-size: 13px; user-select: none;
}
.nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav a.on { background: var(--brand); color: #fff; }
.nav a .ic { width: 16px; text-align: center; opacity: .9; font-size: 13px; }
.nav a .badge {
  margin-left: auto; background: rgba(255, 255, 255, .16);
  border-radius: 8px; padding: 0 6px; font-size: 10.5px; line-height: 16px;
}
.nav a.on .badge { background: rgba(255, 255, 255, .25); }

.sidebar .foot {
  padding: 10px 12px; font-size: 11px; color: #64708d;
  border-top: 1px solid rgba(255, 255, 255, .07);
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--topbar); flex: 0 0 var(--topbar);
  background: #fff; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding: 0 18px;
}
.topbar .title { font-size: 15px; font-weight: 600; }
.topbar .crumb { color: var(--text-3); font-size: 12px; }
.topbar .spacer { flex: 1; }

.user-menu { position: relative; }
.user-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line);
  background: #fff;
}
.user-btn:hover { background: var(--panel-2); }
.user-btn .avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--brand-l); color: var(--brand);
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
}
.user-btn .nm { font-size: 12.5px; }
.user-btn .rl { font-size: 11px; color: var(--text-3); }
.dropdown {
  position: absolute; right: 0; top: 38px; min-width: 168px;
  background: #fff; border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-lg); padding: 5px; z-index: 4000; display: none;
}
.dropdown.on { display: block; }
.dropdown div.item { padding: 8px 10px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
.dropdown div.item:hover { background: var(--panel-2); }
.dropdown .sep { height: 1px; background: var(--line-2); margin: 4px 0; }

.content { flex: 1; overflow: auto; padding: 16px 18px 40px; }

/* ---------------- 通用组件 ---------------- */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
}
.card-h {
  padding: 12px 14px; border-bottom: 1px solid var(--line-2);
  display: flex; align-items: center; gap: 10px;
}
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.card-h .spacer { flex: 1; }
.card-b { padding: 14px; }
.card-b.tight { padding: 0; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; color: var(--text);
  font-size: 12.5px; white-space: nowrap; transition: .12s;
}
.btn:hover { border-color: #c9d2e3; background: var(--panel-2); }
.btn:active { transform: translateY(1px); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-d); border-color: var(--brand-d); }
.btn.danger { color: var(--danger); border-color: #f3c9c5; }
.btn.danger:hover { background: var(--danger-l); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.lg { padding: 9px 18px; font-size: 13.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.icon { padding: 6px 8px; }

.inp, .sel, .ta {
  width: 100%; padding: 6px 9px; border: 1px solid var(--line);
  border-radius: 6px; background: #fff; outline: none; font-size: 12.5px;
}
.inp:focus, .sel:focus, .ta:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(33, 89, 214, .1); }
.ta { resize: vertical; min-height: 60px; }
.sel { cursor: pointer; }

.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.field .unit { color: var(--text-3); font-size: 11.5px; }

.grid { display: grid; gap: 12px; }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  font-size: 11.5px; line-height: 18px; white-space: nowrap;
}
.tag.g { background: var(--ok-l); color: var(--ok); }
.tag.b { background: var(--brand-l); color: var(--brand); }
.tag.o { background: var(--warn-l); color: var(--warn); }
.tag.r { background: var(--danger-l); color: var(--danger); }
.tag.c { background: var(--info-l); color: var(--info); }
.tag.n { background: #f0f2f6; color: var(--text-2); }

.muted { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------------- 表格 ---------------- */
.tbl-wrap { overflow: auto; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
table.tbl th {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel-2); color: var(--text-2); font-weight: 600;
  text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap; font-size: 12px;
}
table.tbl th.sortable { cursor: pointer; user-select: none; }
table.tbl th.sortable:hover { color: var(--brand); }
table.tbl th .arw { color: var(--brand); font-size: 10px; }
table.tbl td {
  padding: 8px 10px; border-bottom: 1px solid var(--line-2);
  vertical-align: middle;
}
table.tbl tbody tr:hover td { background: #f8fafd; }
table.tbl tbody tr.sel td { background: var(--brand-l); }
table.tbl td.act { white-space: nowrap; }

/* 台账横向滚动区 */
.tbl-wrap.lst { max-height: calc(100vh - 268px); }
table.tbl.fixed { table-layout: fixed; }
/* 冻结列（左侧 / 右侧操作列） */
table.tbl th.fx, table.tbl td.fx { position: sticky; z-index: 3; background: var(--panel); }
table.tbl th.fx { background: var(--panel-2); z-index: 4; }
table.tbl th.fxr, table.tbl td.fxr { position: sticky; right: 0; z-index: 3; background: var(--panel); }
table.tbl th.fxr { background: var(--panel-2); z-index: 4; }
table.tbl tbody tr:hover td.fx, table.tbl tbody tr:hover td.fxr { background: #f8fafd; }
table.tbl tbody tr.sel td.fx, table.tbl tbody tr.sel td.fxr { background: var(--brand-l); }
/* 最后一个冻结列右侧的分隔阴影 */
table.tbl td.fx-last::after, table.tbl th.fx-last::after {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 6px;
  transform: translateX(100%); pointer-events: none;
  background: linear-gradient(90deg, rgba(15, 23, 42, .07), rgba(15, 23, 42, 0));
}
/* 右侧冻结列左侧的分隔阴影 */
table.tbl td.fxr::before, table.tbl th.fxr::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  transform: translateX(-100%); pointer-events: none;
  background: linear-gradient(270deg, rgba(15, 23, 42, .07), rgba(15, 23, 42, 0));
}
table.tbl td.act.fxr { padding-left: 12px; padding-right: 12px; }

/* ---------------- 列设置 ---------------- */
.colpick .bar { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
.colpick .grp-wrap { max-height: 52vh; overflow: auto; padding-right: 4px; }
.colpick .grp { margin-bottom: 14px; }
.colpick .grp-h {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 7px;
}
.colpick .ci-wrap { display: flex; flex-wrap: wrap; gap: 2px 8px; }
.colpick .ci {
  display: inline-flex; align-items: center; gap: 5px; width: 186px;
  padding: 3px 4px; font-size: 12.5px; cursor: pointer; border-radius: 5px;
}
.colpick .ci:hover { background: var(--panel-2); }
.colpick .ci span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.link { color: var(--brand); cursor: pointer; }
.link:hover { text-decoration: underline; }
.link.dg { color: var(--danger); }

.pager { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
.pager .spacer { flex: 1; }
.pager .info { color: var(--text-3); font-size: 12px; }

/* ---------------- 看板 ---------------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.kpi .lb { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .vl { font-size: 22px; font-weight: 650; margin-top: 6px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.kpi.bar::after { content: ''; display: block; height: 3px; border-radius: 2px; margin-top: 10px; background: var(--brand); }

.mini-kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
.mini {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
}
.mini .lb { font-size: 12px; color: var(--text-2); }
.mini .vl { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chart-grid.c3 { grid-template-columns: 1fr 1fr 1fr; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
.legend .it { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend .dot { width: 8px; height: 8px; border-radius: 2px; }

.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 74px; gap: 10px; align-items: center; font-size: 12px; }
.bar-row .nm { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { background: var(--line-2); height: 16px; border-radius: 3px; overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 3px; }
.bar-row .vv { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }

/* ---------------- 工具栏 / 筛选 ---------------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.toolbar .spacer { flex: 1; }
.toolbar .search { position: relative; width: 240px; }
.toolbar .search .inp { padding-left: 28px; }
.toolbar .search .si { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.toolbar .w { width: 118px; }
.toolbar .w2 { width: 88px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 3px 10px; border-radius: 12px; border: 1px solid var(--line);
  background: #fff; cursor: pointer; font-size: 12px; color: var(--text-2);
}
.chip:hover { border-color: #c9d2e3; }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ---------------- 弹窗 / 抽屉 ---------------- */
.mask {
  position: fixed; inset: 0; background: rgba(16, 24, 40, .42);
  display: flex; align-items: center; justify-content: center; z-index: 3000; padding: 24px;
}
.mask.hidden { display: none; }
.dlg {
  background: #fff; border-radius: 10px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 520px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
}
.dlg.wide { max-width: 880px; }
.dlg.full { max-width: 1180px; }
.dlg-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.dlg-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.dlg-h .spacer { flex: 1; }
.dlg-h .x { cursor: pointer; color: var(--text-3); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.dlg-h .x:hover { background: var(--line-2); color: var(--text); }
.dlg-b { padding: 16px 18px; overflow: auto; }
.dlg-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel-2); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 18px; background: var(--panel-2); }
.tabs .tb {
  padding: 9px 14px; cursor: pointer; font-size: 13px; color: var(--text-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs .tb:hover { color: var(--brand); }
.tabs .tb.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
.form-grid.c2 { grid-template-columns: repeat(2, 1fr); }
.form-grid .col-2 { grid-column: span 2; }
.form-grid .col-3 { grid-column: span 3; }
.sec-title { font-size: 12.5px; font-weight: 600; color: var(--text); margin: 4px 0 10px; display: flex; align-items: center; gap: 7px; }
.sec-title::before { content: ''; width: 3px; height: 12px; background: var(--brand); border-radius: 2px; }

/* ---------------- 提示 ---------------- */
#toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: #fff; border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow-lg); padding: 9px 16px; font-size: 13px;
  display: flex; align-items: center; gap: 8px; animation: tin .18s ease-out;
}
.toast.ok { border-left: 3px solid var(--ok); }
.toast.err { border-left: 3px solid var(--danger); }
.toast.warn { border-left: 3px solid var(--warn); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

.empty { padding: 46px 20px; text-align: center; color: var(--text-3); }
.empty .ic { font-size: 30px; opacity: .35; margin-bottom: 8px; }

/* ---------------- 登录 ---------------- */
.login-wrap {
  height: 100%; display: grid; place-items: center;
  background: linear-gradient(135deg, #16305e 0%, #1d4f9e 55%, #2159d6 100%);
  position: relative; overflow: hidden;
}
.login-wrap::before {
  content: ''; position: absolute; width: 700px; height: 700px; right: -180px; top: -220px;
  background: radial-gradient(circle, rgba(255, 255, 255, .09), transparent 65%);
}
.login-card {
  width: 380px; background: #fff; border-radius: 12px; padding: 30px 30px 26px;
  box-shadow: var(--shadow-lg); position: relative; z-index: 1;
}
.login-card .lg { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.login-card .lg .logo {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, #3b7bff, #2159d6);
  display: grid; place-items: center; color: #fff; font-size: 17px; font-weight: 700;
}
.login-card h1 { margin: 0; font-size: 17px; font-weight: 650; }
.login-card .sub { color: var(--text-3); font-size: 12px; margin: 4px 0 22px; }
.login-card .field { margin-bottom: 14px; }
.login-card .err { color: var(--danger); font-size: 12px; min-height: 17px; margin-bottom: 6px; }
.login-card .tip { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--text-3); line-height: 1.7; }
.login-card .tip b { color: var(--text-2); font-weight: 600; }

/* ---------------- 地图 ---------------- */
.map-page { display: flex; height: 100%; gap: 0; }
.map-side {
  width: 340px; flex: 0 0 340px; background: #fff;
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
}
.map-side .hd { padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.map-side .lst { flex: 1; overflow: auto; }
.map-side .it {
  padding: 9px 12px; border-bottom: 1px solid var(--line-2); cursor: pointer;
  display: flex; gap: 9px; align-items: flex-start;
}
.map-side .it:hover { background: var(--panel-2); }
.map-side .it.on { background: var(--brand-l); box-shadow: inset 3px 0 0 var(--brand); }
.map-side .it .nm { font-size: 12.5px; line-height: 1.4; }
.map-side .it .mt { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

<body>
<div id="app"></div>
<div id="toasts"></div>
<script>

/* ===== 00-geo.js ===== */
'use strict';
/* ============================================================
 *  geo —— 地图适配层
 *
 *  页面不再直接依赖任何一家地图 SDK：统一通过 Geo.xxx 操作地图，
 *  具体用腾讯地图还是天地图由「系统设置」里的配置决定（后端 /api/map/config）。
 *
 *  新增一家地图服务商只需两步：
 *    1) 后端 server/lib/mapconfig.js 的 PROVIDERS 里加一项（含注册指引）；
 *    2) 本文件的 GeoAdapters 里实现同名适配器。
 * ============================================================ */

/* 占位符由运行环境在返回 HTML 时替换，源码中必须保持原样 */
const GEO_PROXY = 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__';

function proxyReady() { return GEO_PROXY.indexOf('__WB_') < 0; }

const DEFAULT_VIEW = { lat: 29.5889, lng: 106.5515, zoom: 12 }; // 重庆市江北区

/* ------------------------------ 坐标换算 ------------------------------ */
/* 系统内统一按 GCJ-02（火星坐标）存储；天地图底图是 CGCS2000（≈ WGS84），
   需要互换才能保证点位落在正确的地面位置。 */
const GCJ_PI = Math.PI;
const GCJ_A = 6378245.0;
const GCJ_EE = 0.00669342162296594323;

function gcjOutOfChina(lng, lat) {
  return !(lng > 72.004 && lng < 137.8347 && lat > 0.8293 && lat < 55.8271);
}

function gcjTLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * GCJ_PI) + 20.0 * Math.sin(2.0 * x * GCJ_PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * GCJ_PI) + 40.0 * Math.sin(y / 3.0 * GCJ_PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * GCJ_PI) + 320 * Math.sin(y * GCJ_PI / 30.0)) * 2.0 / 3.0;
  return ret;
}

function gcjTLng(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * GCJ_PI) + 20.0 * Math.sin(2.0 * x * GCJ_PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * GCJ_PI) + 40.0 * Math.sin(x / 3.0 * GCJ_PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * GCJ_PI) + 300.0 * Math.sin(x / 30.0 * GCJ_PI)) * 2.0 / 3.0;
  return ret;
}

function wgs84ToGcj02(lng, lat) {
  if (gcjOutOfChina(lng, lat)) return { lng, lat };
  const wgsLat = lat, wgsLng = lng;
  let dLat = gcjTLat(wgsLng - 105.0, wgsLat - 35.0);
  let dLng = gcjTLng(wgsLng - 105.0, wgsLat - 35.0);
  const radLat = wgsLat / 180.0 * GCJ_PI;
  let magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * GCJ_PI);
  dLng = (dLng * 180.0) / (GCJ_A / sqrtMagic * Math.cos(radLat) * GCJ_PI);
  return { lng: wgsLng + dLng, lat: wgsLat + dLat };
}

/** 反向换算：迭代逼近（两次即可收敛到厘米级） */
function gcj02ToWgs84(lng, lat) {
  if (gcjOutOfChina(lng, lat)) return { lng, lat };
  let wlng = lng, wlat = lat;
  for (let i = 0; i < 3; i++) {
    const g = wgs84ToGcj02(wlng, wlat);
    wlng += lng - g.lng;
    wlat += lat - g.lat;
  }
  return { lng: wlng, lat: wlat };
}

/* ------------------------------ 适配器：腾讯地图 GL ------------------------------ */

const TMapAdapter = {
  global: 'TMap',
  needKey: false, // 无 key 时可用运行环境代理

  loadUrl(key) {
    return 'https://map.qq.com/api/gljs?v=1.exp&libraries=service' + (key ? '&key=' + encodeURIComponent(key) : '');
  },
  beforeLoad(key) {
    if (!key && proxyReady()) window._TMapSecurityConfig = { serviceHost: GEO_PROXY };
  },
  missingKeyMsg() {
    return '当前未配置腾讯地图 Key，且页面不在内置预览环境中（无法使用免密钥代理）。请到「系统设置 → 地图服务」填写 Key。';
  },

  toMap(lat, lng) { return { lat, lng }; },
  fromMap(lat, lng) { return { lat, lng }; },

  createMap(divId, view) {
    const TMap = window.TMap;
    return new TMap.Map(divId, {
      zoom: view.zoom,
      center: new TMap.LatLng(view.lat, view.lng),
    });
  },
  setCenter(map, lat, lng) { map.setCenter(new window.TMap.LatLng(lat, lng)); },
  panTo(map, lat, lng, zoom) {
    map.setCenter(new window.TMap.LatLng(lat, lng));
    if (Number.isFinite(zoom)) map.setZoom(zoom);
  },
  setZoom(map, z) { map.setZoom(z); },
  fitBounds(map, pts, padding) {
    const TMap = window.TMap;
    if (!pts.length) return;
    if (pts.length === 1) { this.setCenter(map, pts[0].lat, pts[0].lng); map.setZoom(16); return; }
    try {
      const b = new TMap.LatLngBounds();
      pts.forEach((p) => b.extend(new TMap.LatLng(p.lat, p.lng)));
      map.fitBounds(b, { padding: padding || 70 });
    } catch (e) { this.setCenter(map, pts[0].lat, pts[0].lng); map.setZoom(13); }
  },
  getCenter(map) {
    const c = map.getCenter();
    return { lat: c.getLat(), lng: c.getLng() };
  },
  getZoom(map) { return map.getZoom(); },
  project(map, lat, lng) {
    const p = map.projectToContainer(new window.TMap.LatLng(lat, lng));
    return p ? { x: p.x, y: p.y } : null;
  },
  resize(map) { if (typeof map.resize === 'function') map.resize(); },
  onMap(map, ev, fn) {
    if (ev === 'viewchange') {
      ['pan', 'zoom', 'center_changed', 'zoom_changed'].forEach((e) => {
        try { map.on(e, fn); } catch (err) { /* 事件名不被支持时忽略 */ }
      });
      return;
    }
    map.on(ev === 'click' ? 'click' : ev, fn);
  },
  clickLngLat(evt) {
    const p = evt && evt.latLng;
    return p ? { lat: p.getLat(), lng: p.getLng() } : null;
  },
  destroy(map) { if (map && typeof map.destroy === 'function') map.destroy(); },

  createMarkerLayer(map, styles) {
    const TMap = window.TMap;
    const layer = new TMap.MultiMarker({ map, styles: toTMapStyles(TMap, styles), geometries: [] });
    layer._toTMap = (styles2) => toTMapStyles(TMap, styles2);
    return layer;
  },
  setLayerStyles(layer, styles) { layer.setStyles(toTMapStyles(window.TMap, styles)); },
  setLayerGeoms(layer, geoms) {
    const TMap = window.TMap;
    layer.setGeometries(geoms.map((g) => Object.assign({}, g, { position: new TMap.LatLng(g.position.lat, g.position.lng) })));
  },
  createPolygonLayer(map, style) {
    const TMap = window.TMap;
    return new TMap.MultiPolygon({
      map,
      styles: { p: new TMap.PolygonStyle({
        color: style.fillColor, showBorder: true, borderColor: style.borderColor, borderWidth: style.borderWidth,
      }) },
      geometries: [],
    });
  },
  createPolylineLayer(map, style) {
    const TMap = window.TMap;
    return new TMap.MultiPolyline({
      map,
      styles: { d: new TMap.PolylineStyle({ color: style.borderColor, width: style.borderWidth, borderWidth: 0 }) },
      geometries: [],
    });
  },
  setPathGeoms(layer, geoms) {
    const TMap = window.TMap;
    layer.setGeometries(geoms.map((g) => ({
      id: g.id, styleId: g.styleId, paths: g.paths.map((p) => new TMap.LatLng(p.lat, p.lng)),
    })));
  },
  createInfoWindow(map, opts) {
    const TMap = window.TMap;
    const build = () => {
      const iw = new TMap.InfoWindow({
        map,
        position: new TMap.LatLng(DEFAULT_VIEW.lat, DEFAULT_VIEW.lng),
        content: '<div class="iw">—</div>', // content 必须是字符串，空串会触发 SDK 解析告警
        offset: { x: 0, y: -34 },
        enableCustom: true,
      });
      iw.close();
      return iw;
    };
    try {
      return build();
    } catch (e) {
      /* 部分 WebView 环境下 InfoWindow 构造即抛错（地图尚未完成首次布局时）。
         返回惰性代理：首次真正使用时重试创建，仍失败则静默降级，
         保证不阻断地图初始化与点位渲染。 */
      let real = null;
      const ensure = () => {
        if (real !== null) return real;
        try { real = build(); } catch (e2) { real = null; }
        return real;
      };
      return {
        __lazy: true,
        open() { const i = ensure(); if (i) i.open(); },
        close() { if (real) real.close(); },
        setContent(html) { const i = ensure(); if (i) i.setContent(html); },
        setPosition(latlng) { const i = ensure(); if (i) i.setPosition(latlng); },
        destroy() { try { if (real) real.destroy(); } catch (e2) { /* 忽略 */ } },
      };
    }
  },
  setIwContent(iw, html) { iw.setContent(html); },
  setIwPosition(iw, lat, lng) { iw.setPosition(new window.TMap.LatLng(lat, lng)); },
  openIw(iw) { iw.open(); },
  closeIw(iw) { iw.close(); },
  layerOn(layer, ev, fn) { layer.on(ev, fn); },
  destroyLayer(layer) { if (layer && typeof layer.destroy === 'function') layer.destroy(); },
  destroyIw(iw) { if (iw && typeof iw.destroy === 'function') iw.destroy(); },

  async geocode(address) {
    const TMap = window.TMap;
    const geo = new TMap.service.Geocoder();
    const res = await geo.getLocation({ address });
    const loc = res && res.result && res.result.location;
    if (loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lng)) return { lng: loc.lng, lat: loc.lat };
    return null;
  },
  async reverse(lat, lng) {
    const TMap = window.TMap;
    const geo = new TMap.service.Geocoder();
    const res = await geo.getAddress({ location: new TMap.LatLng(lat, lng) });
    const rr = res && res.result;
    return (rr && (rr.address || (rr.formatted_addresses && rr.formatted_addresses.recommend))) || '';
  },

  /**
   * 地点搜索：优先用浏览器端「关键词输入提示」（免密钥代理下同样可用），
   * 失败再退到服务端 WebServiceAPI（需要系统设置里已配置 Key）。
   */
  async suggest(keyword, n) {
    const kw = String(keyword || '').trim();
    if (!kw) return [];
    const TMap = window.TMap;
    try {
      if (TMap && TMap.service && TMap.service.Suggestion) {
        const sug = new TMap.service.Suggestion();
        const res = await sug.getSuggestions({ keyword: kw });
        const list = normalizeSuggestions(res && (res.data || res.result || res.suggestions), n || 10);
        if (list.length) return list;
      }
    } catch (e) { /* 浏览器端不可用时走服务端兜底 */ }
    return serverSuggest(kw, n || 10);
  },
};

function toTMapStyles(TMap, styles) {
  const out = {};
  Object.keys(styles || {}).forEach((k) => {
    const s = styles[k];
    out[k] = new TMap.MarkerStyle({
      width: s.width, height: s.height, src: s.src,
      anchor: { x: s.anchorX, y: s.anchorY },
    });
  });
  return out;
}

/* ------------------------------ 适配器：天地图 JS API 4.0 ------------------------------ */

const TiandituAdapter = {
  global: 'T',
  needKey: true,

  loadUrl(key) {
    return 'https://api.tianditu.gov.cn/api?v=4.0&tk=' + encodeURIComponent(key);
  },
  beforeLoad() { /* 天地图无需前置配置 */ },
  missingKeyMsg() {
    return '未配置天地图密钥（tk）。请到「系统设置 → 地图服务」选择天地图并填写密钥。';
  },

  /** 存储坐标（GCJ-02）→ 天地图底图坐标（CGCS2000 ≈ WGS84） */
  toMap(lat, lng) { return gcj02ToWgs84(lng, lat); },
  fromMap(lat, lng) { return wgs84ToGcj02(lng, lat); },

  createMap(divId, view) {
    const T = window.T;
    // 经纬度直投，避免再做一次投影换算
    const map = new T.Map(divId, { projection: 'EPSG:4326' });
    const c = this.toMap(view.lat, view.lng);
    map.centerAndZoom(new T.LngLat(c.lng, c.lat), view.zoom);
    try { map.enableScrollWheelZoom(); } catch (e) { /* 忽略 */ }
    return map;
  },
  setCenter(map, lat, lng) {
    const c = this.toMap(lat, lng);
    map.panTo(new window.T.LngLat(c.lng, c.lat));
  },
  panTo(map, lat, lng, zoom) {
    const c = this.toMap(lat, lng);
    if (Number.isFinite(zoom)) map.panTo(new window.T.LngLat(c.lng, c.lat), zoom);
    else map.panTo(new window.T.LngLat(c.lng, c.lat));
  },
  setZoom(map, z) { map.setZoom(z); },
  fitBounds(map, pts, padding) {
    const T = window.T;
    if (!pts.length) return;
    const view = pts.map((p) => { const c = this.toMap(p.lat, p.lng); return new T.LngLat(c.lng, c.lat); });
    if (view.length === 1) { map.panTo(view[0], 16); return; }
    try { map.setViewport(view); } catch (e) { map.panTo(view[0], 13); }
  },
  getCenter(map) {
    const c = map.getCenter();
    const lat = c.getLat(), lng = c.getLng();
    return this.fromMap(lat, lng);
  },
  getZoom(map) { return map.getZoom(); },
  project(map, lat, lng) {
    const c = this.toMap(lat, lng);
    const p = map.lngLatToContainer(new window.T.LngLat(c.lng, c.lat));
    if (!p) return null;
    const x = typeof p.getX === 'function' ? p.getX() : p.x;
    const y = typeof p.getY === 'function' ? p.getY() : p.y;
    return (Number.isFinite(x) && Number.isFinite(y)) ? { x, y } : null;
  },
  resize(map) { if (typeof map.checkResize === 'function') map.checkResize(); },
  onMap(map, ev, fn) {
    if (ev === 'viewchange') {
      ['move', 'moveend', 'zoomend', 'drag'].forEach((e) => {
        try { map.addEventListener(e, fn); } catch (err) { /* 忽略 */ }
      });
      return;
    }
    const name = ev === 'click' ? 'click' : ev;
    map.addEventListener(name, fn);
  },
  clickLngLat(evt) {
    const p = (evt && (evt.lnglat || evt.lngLat)) || null;
    if (!p) return null;
    const lat = typeof p.getLat === 'function' ? p.getLat() : p.lat;
    const lng = typeof p.getLng === 'function' ? p.getLng() : p.lng;
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    return this.fromMap(lat, lng); // 天地图坐标 → 存储坐标
  },

  createMarkerLayer(map, styles) { return tdOverlayLayer(map, 'marker', styles); },
  setLayerStyles(layer, styles) { layer.setStyles(styles); },
  setLayerGeoms(layer, geoms) { layer.setGeometries(geoms); },
  createPolygonLayer(map, style) { return tdOverlayLayer(map, 'polygon', style); },
  createPolylineLayer(map, style) { return tdOverlayLayer(map, 'polyline', style); },
  setPathGeoms(layer, geoms) { layer.setGeometries(geoms); },
  createInfoWindow(map) {
    const T = window.T;
    const iw = new T.InfoWindow();
    try { iw.setContent('<div class="iw">—</div>'); } catch (e) { /* 忽略 */ }
    return { _iw: iw, _map: map, _open: false };
  },
  setIwContent(iw, html) { iw._iw.setContent(html); },
  setIwPosition(iw, lat, lng) {
    const c = this.toMap(lat, lng);
    iw._iw.setLngLat(new window.T.LngLat(c.lng, c.lat));
    if (iw._open && iw._map) { iw._map.removeOverLay(iw._iw); iw._map.addOverLay(iw._iw); }
  },
  openIw(iw) {
    if (!iw || !iw._map) return;
    iw._map.addOverLay(iw._iw);
    iw._open = true;
  },
  closeIw(iw) {
    if (!iw || !iw._map) return;
    try { iw._map.removeOverLay(iw._iw); } catch (e) { /* 忽略 */ }
    iw._open = false;
  },
  layerOn(layer, ev, fn) { layer.on(ev, fn); },
  destroyLayer(layer) { if (layer && typeof layer.destroy === 'function') layer.destroy(); },
  destroyIw(iw) { this.closeIw(iw); },
  destroy(map) {
    try { map.clearOverLays(); } catch (e) { /* 忽略 */ }
  },

  async geocode(address) {
    const r = await API.getQ('/api/geo/geocode', { address });
    if (r && Number.isFinite(r.lng) && Number.isFinite(r.lat)) {
      // 天地图返回的是 CGCS2000 坐标，必须换算成系统存储坐标 GCJ-02，
      // 否则打点会与底图错位数百米（跟点击取点走同一条换算）。
      const g = this.fromMap(r.lat, r.lng);
      return { lng: g.lng, lat: g.lat };
    }
    return null;
  },
  async reverse(lat, lng) {
    const c = this.toMap(lat, lng); // 服务端按天地图坐标查询
    const r = await API.getQ('/api/geo/reverse', { lng: c.lng, lat: c.lat });
    return (r && r.address) || '';
  },

  /** 地点搜索：走服务端代理（天地图搜索服务需服务端密钥），结果同样换算为 GCJ-02 */
  async suggest(keyword, n) {
    const kw = String(keyword || '').trim();
    if (!kw) return [];
    const raw = await serverSuggest(kw, n || 10);
    // 服务端按天地图原生坐标（CGCS2000）返回，转换后才是系统存储坐标
    const list = raw.map((it) => {
      const g = this.fromMap(it.lat, it.lng);
      return Object.assign({}, it, { lng: g.lng, lat: g.lat });
    });
    if (list.length) return list;
    // 搜索服务不可用时退化为地址解析（单点，够用）
    const loc = await this.geocode(kw);
    return loc ? [{ title: kw, address: '', lng: loc.lng, lat: loc.lat }] : [];
  },
};

/** 天地图没有 MultiMarker，这里自建一个「按 id 增量维护覆盖物」的图层 */
function tdOverlayLayer(map, kind, style) {
  const items = new Map(); // id -> { obj, sig }
  const handlers = {};
  const self = {
    kind,
    _map: map,
    styles: style,
    setStyles(s) { self.styles = s; },
    setGeometries(list) {
      const keep = new Set((list || []).map((g) => g.id));
      items.forEach((it, id) => {
        if (!keep.has(id)) { try { map.removeOverLay(it.obj); } catch (e) { /* 忽略 */ } items.delete(id); }
      });
      (list || []).forEach((g) => {
        const sig = JSON.stringify([g.styleId, g.position || g.paths]);
        const cur = items.get(g.id);
        if (cur && cur.sig === sig) return;
        if (cur) { try { map.removeOverLay(cur.obj); } catch (e) { /* 忽略 */ } items.delete(g.id); }
        let obj = null;
        try {
          obj = kind === 'marker' ? tdMarker(map, g, style) : tdPath(map, g, kind, style);
        } catch (e) { console.error(e); return; }
        if (!obj) return;
        (handlers.click || []).forEach((fn) => {
          try { obj.addEventListener('click', () => fn({ geometry: { id: g.id } })); } catch (e) { /* 忽略 */ }
        });
        (handlers.hover || []).forEach((fn) => {
          try { obj.addEventListener('mouseover', () => fn({ geometry: { id: g.id } })); } catch (e) { /* 忽略 */ }
        });
        try { map.addOverLay(obj); } catch (e) { /* 忽略 */ }
        items.set(g.id, { obj, sig });
      });
    },
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    destroy() {
      items.forEach((it) => { try { map.removeOverLay(it.obj); } catch (e) { /* 忽略 */ } });
      items.clear();
    },
  };
  return self;
}

function tdMarker(map, g, styles) {
  const T = window.T;
  const s = (styles && styles[g.styleId]) || {};
  const c = TiandituAdapter.toMap(g.position.lat, g.position.lng);
  const opt = {};
  if (s.src) {
    opt.icon = new T.Icon({
      iconUrl: s.src,
      iconSize: new T.Point(s.width || 26, s.height || 34),
      iconAnchor: new T.Point(s.anchorX || ((s.width || 26) / 2), s.anchorY || (s.height || 34)),
    });
  }
  return new T.Marker(new T.LngLat(c.lng, c.lat), opt);
}

function tdPath(map, g, kind, style) {
  const T = window.T;
  const pts = (g.paths || []).map((p) => {
    const c = TiandituAdapter.toMap(p.lat, p.lng);
    return new T.LngLat(c.lng, c.lat);
  });
  if (pts.length < 2) return null;
  if (kind === 'polygon') {
    return new T.Polygon(pts, {
      color: (style && style.borderColor) || '#2159d6',
      weight: (style && style.borderWidth) || 2,
      opacity: 0.9,
      fillColor: (style && style.fillColor) || 'rgba(33,89,214,0.20)',
      fillOpacity: 0.2,
    });
  }
  return new T.Polyline(pts, {
    color: (style && style.borderColor) || '#2159d6',
    weight: (style && style.borderWidth) || 3,
    opacity: 0.9,
  });
}

/* ------------------------------ 地点搜索（共用） ------------------------------ */

/**
 * 把各家返回的候选地点统一成 [{ title, address, lng, lat }]。
 * 兼容三种坐标写法：{ lng, lat } 数值、SDK 的 LatLng（getLng/getLat）、"lng lat" 字符串。
 */
function normalizeSuggestions(list, n) {
  const max = n || 10;
  return (Array.isArray(list) ? list : []).map((d) => {
    if (!d) return null;
    const p = d.location || d.latLng || d.point || d;
    let lng = NaN, lat = NaN;
    if (p && typeof p === 'object') {
      lng = Number(typeof p.getLng === 'function' ? p.getLng() : p.lng);
      lat = Number(typeof p.getLat === 'function' ? p.getLat() : p.lat);
    } else if (typeof p === 'string') {
      const ab = p.split(/[,\s]+/);
      lng = Number(ab[0]); lat = Number(ab[1]);
    }
    if (!Number.isFinite(lng) || !Number.isFinite(lat)) return null;
    if (Math.abs(lng) > 180 || Math.abs(lat) > 90) return null;
    return { title: String(d.title || d.name || ''), address: String(d.address || ''), lng, lat };
  }).filter(Boolean).slice(0, max);
}

/** 服务端代理搜索：腾讯走 WebServiceAPI，天地图走服务端搜索接口（都需要已配置密钥） */
async function serverSuggest(keyword, n) {
  try {
    const r = await API.getQ('/api/geo/search', { keyword, limit: n || 10 });
    return normalizeSuggestions(r && r.items, n || 10);
  } catch (e) {
    return [];
  }
}

const GeoAdapters = { tmap: TMapAdapter, tianditu: TiandituAdapter };

/* ------------------------------ 统一入口 ------------------------------ */

const Geo = {
  cfg: null,
  _sdkPromise: null,
  _sdkProvider: null,
  _cfgAt: 0,

  /** 读取地图配置（默认缓存 30 秒，管理员修改设置后可用 force 立即刷新） */
  async config(force) {
    if (this.cfg && !force && Date.now() - this._cfgAt < 30000) return this.cfg;
    let cfg = null;
    try {
      const r = await API.get('/api/map/config');
      cfg = r && r.map;
    } catch (e) { cfg = null; }
    if (!cfg) cfg = { provider: 'tmap', key: '', hasKey: false, center: Object.assign({}, DEFAULT_VIEW) };
    if (!cfg.center) cfg.center = Object.assign({}, DEFAULT_VIEW);
    // 兼容早期版本写在本地的腾讯地图 key
    if (!cfg.key && cfg.provider === 'tmap') {
      const local = (localStorage.getItem('tmapKey') || '').trim();
      if (local) { cfg.key = local; cfg.hasKey = true; }
    }
    this.cfg = cfg;
    this._cfgAt = Date.now();
    return cfg;
  },

  provider() { return (this.cfg && this.cfg.provider) || 'tmap'; },
  adapter() { return GeoAdapters[this.provider()] || TMapAdapter; },
  center() { return (this.cfg && this.cfg.center) || DEFAULT_VIEW; },

  /** 地图是否可用（配置齐全）。不可用时页面会给出引导 */
  async ready() {
    const cfg = await this.config();
    const ad = this.adapter();
    if (ad.needKey && !(cfg.key || '').trim()) return { ok: false, msg: ad.missingKeyMsg() };
    if (!ad.needKey && !(cfg.key || '').trim() && !proxyReady()) return { ok: false, msg: ad.missingKeyMsg() };
    return { ok: true };
  },

  /** 加载当前服务商的 SDK（返回全局命名空间，如 window.TMap / window.T） */
  async sdk(force) {
    // SDK 已就绪时直接复用：既避免重复加载脚本，也让注入了桩件的环境无需真实密钥
    if (!force) {
      const known = GeoAdapters[(this.cfg && this.cfg.provider) || 'tmap'] || TMapAdapter;
      if (window[known.global]) { this._sdkProvider = known.global; return window[known.global]; }
    }

    const cfg = await this.config(force);
    const ad = this.adapter();
    const key = (cfg.key || '').trim();

    if (ad.needKey && !key) { const e = new Error('NO_CONFIG'); e.msg = ad.missingKeyMsg(); throw e; }
    if (!ad.needKey && !key && !proxyReady()) { const e = new Error('NO_CONFIG'); e.msg = ad.missingKeyMsg(); throw e; }

    const g = ad.global;
    if (this._sdkPromise && this._sdkProvider === ad.global && !force) return this._sdkPromise;

    this._sdkProvider = ad.global;
    this._sdkPromise = new Promise((resolve, reject) => {
      ad.beforeLoad(key);
      const s = document.createElement('script');
      s.src = ad.loadUrl(key);
      s.onload = () => (window[g] ? resolve(window[g]) : reject(new Error('地图 SDK 已加载但未初始化，请刷新重试')));
      s.onerror = () => reject(new Error('地图 SDK 加载失败，请检查网络或系统设置里的密钥是否正确'));
      document.head.appendChild(s);
    }).catch((e) => { this._sdkPromise = null; throw e; });

    return this._sdkPromise;
  },

  /* ---- 坐标：存储（GCJ-02） ↔ 底图 ---- */
  toMap(lat, lng) { return this.adapter().toMap(lat, lng); },
  fromMap(lat, lng) { return this.adapter().fromMap(lat, lng); },

  /* ---- 地图 ---- */
  createMap(divId, view) { return this.adapter().createMap(divId, view || this.center()); },
  setCenter(map, lat, lng) { this.adapter().setCenter(map, lat, lng); },
  panTo(map, lat, lng, zoom) { this.adapter().panTo(map, lat, lng, zoom); },
  setZoom(map, z) { this.adapter().setZoom(map, z); },
  fitBounds(map, pts, padding) { this.adapter().fitBounds(map, pts, padding || 70); },
  getCenter(map) { return this.adapter().getCenter(map); },
  getZoom(map) { return this.adapter().getZoom(map); },
  project(map, lat, lng) {

  },
  resize(map) { try { this.adapter().resize(map); } catch (e) { /* 忽略 */ } },
  onMap(map, ev, fn) { try { this.adapter().onMap(map, ev, fn); } catch (e) { /* 忽略 */ } },
  clickLngLat(evt) { try { return this.adapter().clickLngLat(evt); } catch (e) { return null; } },
  destroyMap(map) {
    try { this.adapter().destroy(map); } catch (e) { /* 忽略 */ }
    return null;
  },

  /* ---- 图层 ---- */
  markerLayer(map, styles) { return this.adapter().createMarkerLayer(map, styles || {}); },
  polygonLayer(map, style) { return this.adapter().createPolygonLayer(map, style || {}); },
  polylineLayer(map, style) { return this.adapter().createPolylineLayer(map, style || {}); },
  setStyles(layer, styles) { this.adapter().setLayerStyles(layer, styles); },
  setMarkers(layer, geoms) { this.adapter().setLayerGeoms(layer, geoms); },
  setPaths(layer, geoms) { this.adapter().setPathGeoms(layer, geoms); },
  layerOn(layer, ev, fn) { this.adapter().layerOn(layer, ev, fn); },
  destroyLayer(layer) { try { this.adapter().destroyLayer(layer); } catch (e) { /* 忽略 */ } return null; },

  /* ---- 信息窗 ---- */
  infoWindow(map) { return this.adapter().createInfoWindow(map); },
  setIwContent(iw, html) { this.adapter().setIwContent(iw, html); },
  setIwPosition(iw, lat, lng) { this.adapter().setIwPosition(iw, lat, lng); },
  openIw(iw) { this.adapter().openIw(iw); },
  closeIw(iw) { this.adapter().closeIw(iw); },
  destroyIw(iw) { try { this.adapter().destroyIw(iw); } catch (e) { /* 忽略 */ } return null; },

  /* ---- 地理编码 ---- */
  async geocode(address) { return this.adapter().geocode(address); },
  async reverse(lat, lng) { return this.adapter().reverse(lat, lng); },

  /**
   * 地点搜索：关键词 → 候选地点 [{ title, address, lng, lat }]（已统一为 GCJ-02）。
   * 适配器没实现搜索时退化为地址解析的单点结果。
   */
  async suggest(keyword, n) {
    const kw = String(keyword || '').trim();
    if (!kw) return [];
    const ad = this.adapter();
    if (typeof ad.suggest === 'function') {
      const list = await ad.suggest(kw, n || 10);
      if (list && list.length) return list;
    }
    const loc = await this.geocode(kw);
    return loc ? [{ title: kw, address: '', lng: loc.lng, lat: loc.lat }] : [];
  },
};

/* ------------------------------ DOM ------------------------------ */

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

const ESC_RULES = [[/&/g, '&#38;'], [/</g, '&#60;'], [/>/g, '&#62;'], [/"/g, '&#34;'], [/'/g, '&#39;']];

function esc(s) {
  let out = String(s == null ? '' : s);
  for (let i = 0; i < ESC_RULES.length; i++) out = out.replace(ESC_RULES[i][0], ESC_RULES[i][1]);
  return out;
}

/** 由 HTML 字符串创建节点 */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html).trim();
  return t.content.firstElementChild;
}

function on(node, ev, fn, opts) {
  if (!node) return node;
  node.addEventListener(ev, fn, opts);
  return node;
}

function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }

/* ------------------------------ 地图实例释放 ------------------------------ */

/**
 * 释放腾讯地图实例 / 图层，返回 null。
 * SPA 切换页面会移除整个 DOM，但地图实例仍绑定在已移除的容器上，
 * 若不在离开时销毁，再次进入页面时新容器会是空白（"地图不显示"）。
 */
function disposeMapObj(o) {
  if (!o) return null;
  try { if (typeof o.destroy === 'function') { o.destroy(); return null; } } catch (e) { /* 忽略 */ }
  try { if (typeof o.setMap === 'function') o.setMap(null); } catch (e) { /* 忽略 */ }
  return null;
}

/** 等待地图容器完成布局后再执行（尺寸为 0 时地图会渲染异常） */
function whenMapSized(el, cb, tries) {
  let left = tries || 20;
  const step = () => {
    if (!el || !el.isConnected) return;
    const w = el.clientWidth, hh = el.clientHeight;
    if ((w > 0 && hh > 0) || left <= 0) { cb(w, hh); return; }
    left--;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ------------------------------ 格式化 ------------------------------ */

const fmt = {
  n(v, digits) {
    if (v === null || v === undefined || v === '') return '-';
    const num = Number(v);
    if (!Number.isFinite(num)) return String(v);
    return num.toLocaleString('zh-CN', { minimumFractionDigits: digits || 0, maximumFractionDigits: digits === undefined ? 2 : digits });
  },
  /** 面积：保留两位并去掉多余小数 */
  area(v) {
    if (v === null || v === undefined || v === '') return '-';
    const num = Number(v);
    if (!Number.isFinite(num)) return String(v);
    return (Math.round(num * 100) / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  },
  /** 金额：按万元/亿元折算，便于阅读 */
  money(v) {
    const num = Number(v);
    if (!Number.isFinite(num)) return '-';
    const abs = Math.abs(num);
    if (abs >= 1e8) return (num / 1e8).toFixed(2) + ' 亿元';
    if (abs >= 1e4) return (num / 1e4).toFixed(2) + ' 万元';
    return num.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' 元';
  },
  moneyPlain(v) {
    const num = Number(v);
    if (!Number.isFinite(num)) return '-';
    return num.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  date(v) {
    if (!v) return '-';
    const s = String(v);
    return s.length > 10 ? s.slice(0, 10) : s;
  },
  rel(v) {
    if (!v) return '-';
    const t = new Date(String(v).replace(' ', 'T')).getTime();
    if (!Number.isFinite(t)) return String(v).slice(0, 16);
    const diff = Date.now() - t;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 30 * 86400000) return Math.floor(diff / 86400000) + ' 天前';
    return String(v).slice(0, 10);
  },
  pct(a, b) {
    if (!b) return '0%';
    return (Math.round((a / b) * 1000) / 10) + '%';
  },
  cut(s, n) {
    const str = String(s == null ? '' : s);
    return str.length > n ? str.slice(0, n) + '…' : str;
  },
};

/* ------------------------------ 弹窗 ------------------------------ */

function modal(opts) {
  const o = opts || {};
  const mask = h(`<div class="mask">
    <div class="dlg ${o.size || ''}">
      <div class="dlg-h"><h3>${esc(o.title || '')}</h3><div class="spacer"></div><div class="x">✕</div></div>
      <div class="dlg-b"></div>
      ${o.footer === false ? '' : '<div class="dlg-f"></div>'}
    </div>
  </div>`);
  const body = $('.dlg-b', mask);
  const foot = $('.dlg-f', mask);

  if (o.bodyNode) body.appendChild(o.bodyNode);
  else if (o.body) body.innerHTML = o.body;

  if (o.buttons) {
    o.buttons.forEach((b) => {
      const btn = h(`<button class="btn ${b.cls || ''}">${esc(b.text)}</button>`);
      on(btn, 'click', () => { if (b.onClick) b.onClick(apiClose); else apiClose(); });
      foot.appendChild(btn);
    });
  }

  const close = () => { mask.remove(); if (o.onClose) o.onClose(); };
  function apiClose() { close(); }
  on($('.x', mask), 'click', close);
  on(mask, 'click', (e) => { if (e.target === mask && o.maskClose !== false) close(); });
  const escHandler = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', escHandler);
  const origRemove = mask.remove.bind(mask);
  mask.remove = () => { document.removeEventListener('keydown', escHandler); origRemove(); };

  document.body.appendChild(mask);
  return { mask, body, foot, close };
}

function confirmDlg(msg, title) {
  return new Promise((resolve) => {
    let done = false;
    const fin = (v) => { if (!done) { done = true; resolve(v); } };
    modal({
      title: title || '请确认',
      size: '',
      body: `<div style="font-size:13px;line-height:1.7">${msg}</div>`,
      // 注意：必须先 fin(...) 再 c()。c() 会触发 onClose → fin(false)，
      // 若顺序颠倒，点「确定」也会得到 false（历史 bug）。
      buttons: [
        { text: '取消', onClick: (c) => { fin(false); c(); } },
        { text: '确定', cls: 'pri', onClick: (c) => { fin(true); c(); } },
      ],
      onClose: () => fin(false),
    });
  });
}

/* ------------------------------ 接口 ------------------------------ */

const API = (function () {
  const DEFAULT_PORT = 8789;
  let base = localStorage.getItem('apiBase');
  if (!base) {
    base = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') && location.port === String(DEFAULT_PORT)
      ? ''
      : `http://127.0.0.1:${DEFAULT_PORT}`;
  }

  return {
    get base() { return base; },
    setBase(v) { base = String(v || '').replace(/\/+$/, ''); localStorage.setItem('apiBase', base); },

    async call(method, path, body) {
      let res;
      try {
        res = await fetch(base + path, {
          method,
          headers: Object.assign(
            { 'Content-Type': 'application/json' },
            Session.token ? { Authorization: 'Bearer ' + Session.token } : {}
          ),
          body: body === undefined ? undefined : JSON.stringify(body),
        });
      } catch (e) {
        throw new Error('无法连接后端服务（' + base + '）。请确认服务已启动：node server/server.js');
      }
      const ct = res.headers.get('content-type') || '';
      if (res.status === 401) {
        Session.clear();
        boot();
        throw new Error('登录已过期，请重新登录');
      }
      if (!ct.includes('json')) {
        if (res.status >= 400) throw new Error('请求失败 ' + res.status);
        return { status: res.status, blob: await res.blob() };
      }
      const data = await res.json();
      if (res.status >= 400) throw new Error(data.error || ('请求失败 ' + res.status));
      return data;
    },

    get(p) { return API.call('GET', p); },
    post(p, b) { return API.call('POST', p, b); },
    put(p, b) { return API.call('PUT', p, b); },
    del(p) { return API.call('DELETE', p); },

    /** 带查询串的 GET */
    getQ(p, params) {
      const q = new URLSearchParams();
      Object.keys(params || {}).forEach((k) => {
        const v = params[k];
        if (v === null || v === undefined || v === '' || v === false) return;
        if (Array.isArray(v)) { if (v.length) q.set(k, v.join(',')); return; }
        q.set(k, String(v));
      });
      const s = q.toString();
      return API.call('GET', p + (s ? '?' + s : ''));
    },
  };
})();

/** 带鉴权头下载文件（window.open 无法携带 Authorization，必须先取回 blob） */
async function downloadAuth(pathWithQuery, filename) {
  const res = await fetch(API.base + pathWithQuery, {
    headers: Object.assign({ 'Content-Type': 'application/json' }, Session.token ? { Authorization: 'Bearer ' + Session.token } : {}),
  });
  if (!res.ok) {
    let msg = '下载失败 ' + res.status;
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) { /* 非 JSON 响应 */ }
    throw new Error(msg);
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ------------------------------ 会话 ------------------------------ */

const Session = {
  token: localStorage.getItem('token') || '',
  user: null,
  options: null,

  save(token, user) {
    this.token = token;
    this.user = user;
    localStorage.setItem('token', token);
  },
  clear() {
    this.token = '';
    this.user = null;
    this.options = null;
    localStorage.removeItem('token');
  },
  can(p) {
    if (!this.user) return false;
    const roles = (this.options && this.options.roles) || {};
    const r = roles[this.user.role];
    return !!r && r.can.indexOf(p) >= 0;
  },
  /** 是否系统管理员（可见并管理全部单位） */
  isSysAdmin() { return !!this.user && this.user.role === 'admin'; },
  /**
   * 当前用户所属单位名称（'' = 未绑定）。
   * 注意：非系统管理员未绑定单位时可见范围为空（与后端 org.js 一致），
   * 不能退化成「可见全部」，否则就是越权。
   */
  myUnit() { return (this.user && this.user.unit) || ''; },
  /** 是否可修改某单位的资产：系统管理员全部可改；其余仅本单位可改（下级单位只读） */
  canWriteUnit(unitName) {
    if (!this.user) return false;
    if (this.isSysAdmin()) return true;
    if (!this.myUnit()) return false;
    return String(unitName || '') === this.myUnit();
  },
  canWriteAsset(asset) { return !!asset && this.canWriteUnit(asset.unit); },
  async loadOptions(force) {
    if (this.options && !force) return this.options;
    this.options = await API.get('/api/options');
    return this.options;
  },
  field(key) {
    const f = (this.options && this.options.fields || []).find((x) => x.key === key);
    return f || { key, label: key, type: 'text', options: [] };
  },
};

/* ------------------------------ 单位作用域 ------------------------------ */

/**
 * Scope —— 全局「当前单位」作用域。左侧单位树点选后，看板 / 台账 / 地图 / 预览 / 导出
 * 均只显示该单位的数据。unit 为空串表示「全部单位」。
 * 非管理员（绑定了所属单位）只能看到并锁定在自己的单位，后端也会再兜一层过滤。
 */
const Scope = {
  unit: '',        // 当前查看单位名称；'' = 全部单位
  tree: [],        // 层级树：[{ id, name, parent, level, path, children: [...] }]
  units: [],       // 可见单位名称（树的前序遍历，含数据中已出现但未登记的单位）
  counts: {},      // { 单位名: 资产条数 } 精确口径（含下级用 countTree）
  total: 0,
  collapsed: false, // 整棵树折叠
  fold: {},        // { 单位 id: true } 单个节点折叠
  _subs: [],

  key() { return 'scopeUnit:' + (((Session.user || {}).id) || ''); },
  /** 是否可切换到「全部单位」：仅系统管理员 */
  canAll() { return Session.isSysAdmin(); },
  label() { return this.unit || '全部单位'; },

  /** 登录/刷新后初始化：恢复上次选择，并拉取单位层级与数量 */
  async init() {
    const me = Session.user || {};
    const saved = localStorage.getItem(this.key());
    let u = saved == null ? '' : String(saved);
    if (!this.canAll()) u = me.unit || '';
    this.unit = u;
    this.collapsed = localStorage.getItem(this.key() + ':collapsed') === '1';
    try { this.fold = JSON.parse(localStorage.getItem(this.key() + ':fold') || '{}') || {}; }
    catch (e) { this.fold = {}; }
    await this.refresh();
    if (!this.canAll()) this.unit = me.unit || '';
    else if (this.unit && this.units.length && this.units.indexOf(this.unit) < 0) this.unit = ''; // 单位已删除
  },

  /** 拉取单位层级 + 可见范围内的单位分布数量 */
  async refresh() {
    try {
      const [us, st] = await Promise.all([API.get('/api/units'), API.get('/api/stats')]);
      const visible = us.visible ? new Set(us.visible) : null;
      let rows = (us.rows || []).filter((r) => !visible || visible.has(r.name));
      // 数据中出现但未在单位表登记的单位（仅在其可见时才补进树，作为顶级节点）
      const known = new Set(rows.map((r) => r.name));
      (st.byUnit || []).map((x) => x.name).filter((n) => n && n !== '未填写' && !known.has(n)).forEach((n) => {
        if (visible && !visible.has(n)) return;
        rows.push({ id: 'v:' + n, name: n, parent: '', code: '', sort: 9999, level: 0, virtual: true });
      });
      this.tree = this.buildTree(rows);
      this.units = [];
      const walk = (arr) => arr.forEach((n) => { this.units.push(n.name); walk(n.children || []); });
      walk(this.tree);
      this.counts = {};
      (st.byUnit || []).forEach((x) => { this.counts[x.name] = x.count; });
      this.total = st.total || 0;
    } catch (e) {
      this.tree = this.tree || [];
      this.units = this.units || [];
    }
  },

  /** 由扁平行（含 parent）构建层级树 */
  buildTree(rows) {
    const nodes = rows.map((r) => Object.assign({ children: [] }, r));
    const byId = new Map();
    nodes.forEach((n) => byId.set(n.id, n));
    const roots = [];
    nodes.forEach((n) => {
      const p = n.parent ? byId.get(n.parent) : null;
      if (p && p !== n) p.children.push(n); else roots.push(n);
    });
    const sortRec = (arr) => {
      arr.sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), 'zh-CN'));
      arr.forEach((x) => sortRec(x.children));
    };
    sortRec(roots);
    return roots;
  },

  /** 精确条数 */
  countOf(name) { return this.counts[name] || 0; },

  /** 某单位及其全部下级的名称列表 */
  subtreeNames(name) {
    const find = (arr) => {
      for (const n of arr) {
        if (n.name === name) return n;
        const hit = find(n.children || []);
        if (hit) return hit;
      }
      return null;
    };
    const node = find(this.tree);
    if (!node) return [name];
    const out = [];
    const walk = (n) => { out.push(n.name); (n.children || []).forEach(walk); };
    walk(node);
    return out;
  },

  /** 含全部下级单位的合计条数 */
  countTree(name) {
    return this.subtreeNames(name).reduce((s, n) => s + this.countOf(n), 0);
  },

  /** 该单位是否可选（非系统管理员只能在本单位及下级之间切换） */
  canSelect(name) {
    const next = String(name || '');
    if (!next) return this.canAll();
    return this.units.indexOf(next) >= 0;
  },

  set(name) {
    const next = String(name || '');
    if (!this.canSelect(next)) return;
    if (next === this.unit) return;
    this.unit = next;
    localStorage.setItem(this.key(), next);
    this.emit();
  },

  toggle() {
    this.collapsed = !this.collapsed;
    localStorage.setItem(this.key() + ':collapsed', this.collapsed ? '1' : '0');
    this.emit();
  },

  /** 单个节点的展开 / 收起 */
  toggleNode(id) {
    if (!id) return;
    this.fold[id] = !this.fold[id];
    localStorage.setItem(this.key() + ':fold', JSON.stringify(this.fold));
    this.emit();
  },

  /** 给接口查询串附加当前单位（页面自身的单位筛选由调用方做交集处理） */
  params(extra) { return Object.assign({ unit: this.unit }, extra || {}); },

  onChange(fn) { if (typeof fn === 'function') this._subs.push(fn); },
  emit() { this._subs.slice().forEach((f) => { try { f(); } catch (e) { console.error(e); } }); },

  reset() {
    this.unit = ''; this.tree = []; this.units = []; this.counts = {};
    this.total = 0; this.collapsed = false; this.fold = {}; this._subs = [];
  },
};

/* ------------------------------ 单位树 ------------------------------ */

/**
 * 左侧「单位范围」树：
 *   · 系统管理员 / 未绑定单位：根节点「全部单位」+ 完整单位层级（上级 → 下级）
 *   · 单位管理员等绑定单位的用户：以其所属单位为根，可切换到任意下级单位（下级只读）
 * 父节点条数为「本单位 + 全部下级」的合计，便于查看汇总。
 */
function renderUnitTree() {
  const box = $('#utree');
  if (!box) return;
  clear(box);

  const canAll = Scope.canAll();
  const arrow = Scope.collapsed ? '▸' : '▾';

  const nodeHtml = (n, depth) => {
    const kids = n.children || [];
    const open = !Scope.fold[n.id] && !Scope.collapsed;
    const cnt = Scope.countTree(n.name);
    const own = Scope.countOf(n.name);
    const readonly = !Session.canWriteUnit(n.name);
    const tip = `${n.path || n.name}${kids.length ? `\n含下级合计 ${cnt} 条（本单位 ${own} 条）` : `\n${own} 条`}${readonly ? '\n下级单位：只读' : ''}`;
    return `
      <div class="ut-node kid ${Scope.unit === n.name ? 'on' : ''}" data-u="${esc(n.name)}"
           style="padding-left:${4 + depth * 13}px" title="${esc(tip)}">
        <span class="ut-arw ${kids.length ? '' : 'blank'}" ${kids.length ? `data-fold="${esc(n.id)}"` : ''}>${kids.length ? (open ? '▾' : '▸') : '•'}</span>
        <span class="ut-ic dot" style="background:${esc(colorOf(CAT_COLOR, n.name, depth))}"></span>
        <span class="ut-nm ellip">${esc(n.name)}</span>
        ${readonly ? '<span class="ut-ro">只读</span>' : ''}
        <span class="ut-ct">${cnt}</span>
      </div>
      ${kids.length && open ? kids.map((c) => nodeHtml(c, depth + 1)).join('') : ''}`;
  };

  const roots = Scope.tree;
  // 注意：h() 只返回模板的第一个根元素，整棵树必须包在单个节点里
  box.appendChild(h(`<div>
    <div class="ut-hd">
      <span>单位范围</span>
      <span class="muted" style="font-size:11px">${canAll ? '点击切换' : '已锁定'}</span>
    </div>
    <div class="ut-body">
      ${canAll ? `
      <div class="ut-node ${Scope.unit === '' ? 'on' : ''}" data-u="">
        <span class="ut-arw" id="ut-arw" title="展开 / 收起">${arrow}</span>
        <span class="ut-ic">⌸</span>
        <span class="ut-nm">全部单位</span>
        <span class="ut-ct">${Scope.total}</span>
      </div>` : ''}
      <div class="ut-kids" style="${Scope.collapsed ? 'display:none' : ''}">
        ${roots.map((n) => nodeHtml(n, canAll ? 0 : 0)).join('')}
        ${roots.length ? '' : '<div class="ut-empty">暂无单位数据</div>'}
      </div>
    </div>
  </div>`));

  const arw = $('#ut-arw', box);
  if (arw) on(arw, 'click', (e) => { e.stopPropagation(); Scope.toggle(); });

  $$('[data-fold]', box).forEach((n) => on(n, 'click', (e) => {
    e.stopPropagation();
    Scope.toggleNode(n.dataset.fold);
  }));

  $$('.ut-node', box).forEach((n) => {
    on(n, 'click', () => {
      const u = n.dataset.u == null ? '' : n.dataset.u;
      if (n.classList.contains('dis')) return;
      if (Scope.unit === u) return;
      Scope.set(u); // set() 内部按可见范围校验，越权选择会被忽略
    });
  });

  updateCrumb();
}

function updateCrumb() {
  const el = $('#pg-crumb');
  if (!el) return;
  const readonly = Scope.unit && !Session.canWriteUnit(Scope.unit);
  const me = Session.user || {};

  el.innerHTML = `${role ? esc(role) + ' ｜ ' : ''}单位：<b>${esc(Scope.label())}</b>${readonly ? ' <span class="tag n">下级单位 · 只读</span>' : ''}`;

function go(pageKey, params) {
  if (curPageKey && curPageKey !== pageKey) leavePage(curPageKey);
  curPageKey = pageKey;
  document.body.classList.remove('nav-open'); // 移动端：切页即收起抽屉
  const page = Pages[pageKey] || Pages.dashboard;
  $$('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.k === pageKey));
  updateCrumb();
  const titleEl = $('#pg-title');
  if (titleEl) titleEl.textContent = page.title;
  const content = $('#content');
  clear(content);
  content.scrollTop = 0;
  try {
    page.render(content, params || {});
  } catch (e) {
    console.error(e);
    content.appendChild(h(`<div class="empty"><div class="ic">⚠</div><div>页面加载失败：${esc(e.message)}</div></div>`));
  }
}

function currentPage() {
  const m = /^#\/(\w+)/.exec(location.hash || '');
  let k = m ? m[1] : 'report';
  if (!Pages[k]) k = 'report';
  const item = NAV.reduce((acc, g) => acc || g.items.find((i) => i.k === k), null);
  if (item && !navVisible(item)) k = 'report';
  return k;
}

/* ------------------------------ 启动 ------------------------------ */

let booting = false;

/**
 * 单位切换后：刷新树高亮并重新渲染当前页面（各页面自行读取 Scope.unit）。
 * 注意：退登 / 重登会调用 Scope.reset() 清空订阅，因此这里以「订阅是否存在」为准，
 * 不能用一个只增不减的标志位判断，否则第二次登录后切换单位页面不再刷新。
 */
function bindScope() {
  if (Scope._subs.length) return;
  Scope.onChange(() => {
    renderUnitTree();
    if (curPageKey) go(curPageKey);
  });
}

async function boot() {
  if (booting) return;
  booting = true;
  try {
    if (!Session.token) { renderLogin(); return; }
    if (!Session.user) {
      const r = await API.get('/api/auth/me');
      Session.user = r.user;
    }
    await Session.loadOptions(true);
    Session.user = Session.options.me || Session.user;
    // 预取地图配置（服务商 / 密钥 / 默认视野），地图页与设置页进入时即可直接使用
    try { await Geo.config(true); } catch (e) { /* 地图配置失败不阻断登录 */ }
    await Scope.init();
    bindScope();
    renderApp();
    go(currentPage());
  } catch (e) {
    Session.clear();
    Scope.reset();
    renderLogin(e.message);
  } finally {
    booting = false;
  }
}

on(window, 'hashchange', () => {
  if (Session.token && $('#nav')) go(currentPage());
});

'use strict';
/* ============================================================
 *  charts —— 纯 SVG 图表（无第三方图表库）
 * ============================================================ */

const SVGNS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  Object.keys(attrs || {}).forEach((k) => e.setAttribute(k, attrs[k]));
  return e;
}

/** 环形图：items = [{name, value, color}] */
function chartDonut(items, opts) {
  const o = opts || {};
  const size = o.size || 168;
  const r = o.r || (size / 2 - 16);
  const sw = o.width || 22;
  const total = items.reduce((s, it) => s + Math.max(0, it.value), 0);
  const cx = size / 2, cy = size / 2;
  const C = 2 * Math.PI * r;

  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, width: '100%', height: size, style: 'display:block' });
  svg.appendChild(svgEl('circle', { cx, cy, r, fill: 'none', stroke: '#eef1f6', 'stroke-width': sw }));

  let offset = 0;
  if (total > 0) {
    items.forEach((it) => {
      const v = Math.max(0, it.value);
      if (!v) return;
      const len = (v / total) * C;
      const c = svgEl('circle', {
        cx, cy, r, fill: 'none',
        stroke: it.color || '#2159d6',
        'stroke-width': sw,
        'stroke-dasharray': `${len} ${C - len}`,
        'stroke-dashoffset': -offset,
        transform: `rotate(-90 ${cx} ${cy})`,
      });
      c.appendChild(svgEl('title', {})).textContent = `${it.name}: ${v}`;
      svg.appendChild(c);
      offset += len;
    });
  }

  const t1 = svgEl('text', { x: cx, y: cy - 2, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 650, fill: '#1c2434' });
  t1.textContent = o.centerValue !== undefined ? o.centerValue : total;
  const t2 = svgEl('text', { x: cx, y: cy + 15, 'text-anchor': 'middle', 'font-size': 11, fill: '#8b93a7' });
  t2.textContent = o.centerLabel || '合计';
  svg.appendChild(t1);
  svg.appendChild(t2);
  return svg;
}

/** 环形图图例 */
function chartLegend(items, unitFn) {
  const wrap = h('<div class="legend"></div>');
  items.forEach((it) => {
    const total = items.reduce((s, x) => s + Math.max(0, x.value), 0);
    const pct = total ? fmt.pct(it.value, total) : '0%';
    wrap.appendChild(h(`<div class="it" title="${esc(it.name)}">
      <span class="dot" style="background:${it.color}"></span>
      <span>${esc(fmt.cut(it.name, 10))}</span>
      <span class="muted">${esc(unitFn ? unitFn(it) : it.value)} · ${pct}</span>
    </div>`));
  });
  return wrap;
}

/** 横向条形（HTML）：items = [{name, value, color, text}] */
function chartBars(items, opts) {
  const o = opts || {};
  const max = Math.max(1, ...items.map((it) => Math.max(0, it.value)));
  const wrap = h('<div class="bars"></div>');
  if (!items.length) {
    wrap.appendChild(h('<div class="muted" style="padding:10px 0">暂无数据</div>'));
    return wrap;
  }
  items.forEach((it, i) => {
    const pctW = Math.max(2, (Math.max(0, it.value) / max) * 100);
    wrap.appendChild(h(`
      <div class="bar-row" title="${esc(it.name)}">
        <div class="nm">${esc(fmt.cut(it.name, 14))}</div>
        <div class="track"><div class="fill" style="width:${pctW}%;background:${it.color || colorOf({}, '', i)}"></div></div>
        <div class="vv">${esc(o.textFn ? o.textFn(it) : fmt.n(it.value))}</div>
      </div>`));
  });
  return wrap;
}

/** 纵向柱状图（SVG）：items = [{name, value, color}] */
function chartColumns(items, opts) {
  const o = opts || {};
  const W = o.width || 520, H = o.height || 200;
  const padL = 34, padR = 8, padT = 12, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(1, ...items.map((it) => Math.max(0, it.value)));

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, style: 'display:block' });

  // 网格与 Y 轴刻度
  for (let i = 0; i <= 4; i++) {
    const y = padT + (ih / 4) * i;
    svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#eef1f6' }));
    const t = svgEl('text', { x: padL - 6, y: y + 3.5, 'text-anchor': 'end', 'font-size': 10, fill: '#8b93a7' });
    t.textContent = Math.round((max / 4) * (4 - i));
    svg.appendChild(t);
  }

  const step = iw / Math.max(1, items.length);
  const bw = Math.min(46, step * 0.56);
  items.forEach((it, i) => {
    const v = Math.max(0, it.value);
    const bh = (v / max) * ih;
    const x = padL + step * i + (step - bw) / 2;
    const y = padT + ih - bh;
    const rect = svgEl('rect', { x, y, width: bw, height: Math.max(1, bh), rx: 3, fill: it.color || '#2159d6' });
    rect.appendChild(svgEl('title', {})).textContent = `${it.name}: ${v}`;
    svg.appendChild(rect);
    const vt = svgEl('text', { x: x + bw / 2, y: y - 4, 'text-anchor': 'middle', 'font-size': 10, fill: '#5b6478' });
    vt.textContent = v;
    svg.appendChild(vt);
    const lt = svgEl('text', { x: padL + step * i + step / 2, y: H - padB + 15, 'text-anchor': 'middle', 'font-size': 10.5, fill: '#5b6478' });
    lt.textContent = fmt.cut(it.name, 6);
    svg.appendChild(lt);
  });
  return svg;
}

/** 进度条 */
function progressBar(value, total, color) {
  const p = total ? Math.min(100, (value / total) * 100) : 0;
  return h(`<div class="progress"><div class="p" style="width:${p}%;background:${color || 'var(--brand)'}"></div></div>`);
}

/** 看板小卡片 */
function kpiCard(label, value, sub, icon) {
  return h(`<div class="kpi">
    <div class="lb">${icon ? `<span>${icon}</span>` : ''}<span>${esc(label)}</span></div>
    <div class="vl">${value}</div>
    <div class="sub">${sub || ''}</div>
  </div>`);
}

function miniStat(label, value, color) {
  return h(`<div class="mini">
    <div class="lb">${esc(label)}</div>
    <div class="vl" style="color:${color || 'var(--text)'}">${value}</div>
  </div>`);
}

function cardBox(title, bodyNode, actions, cls) {
  const c = h(`<div class="card ${cls || ''}">
    <div class="card-h"><h3>${esc(title)}</h3><div class="spacer"></div><div class="acts"></div></div>
    <div class="card-b"></div>
  </div>`);
  (actions || []).forEach((a) => $('.acts', c).appendChild(a));
  if (typeof bodyNode === 'string') $('.card-b', c).innerHTML = bodyNode;
  else if (bodyNode) $('.card-b', c).appendChild(bodyNode);
  return c;
}

  } catch (e) { /* 忽略损坏的存储 */ }

      let unitFilter = ListState.unit;
      if (Scope.unit) {
        // 全局单位按「含下级」口径，列表内单位筛选只要落在该子树内即保留
        const scope = new Set(Scope.subtreeNames(Scope.unit));
        unitFilter = ListState.unit.length ? ListState.unit.filter((u) => scope.has(u)) : [Scope.unit];
        if (!unitFilter.length) {           // 交集为空：不请求，直接显示空表

          renderTable(tblWrap);

          order: ListState.order,
          page: ListState.page,

        ListState.rows = r.rows;
        renderTable(tblWrap);
        renderPager(pager);
